name: Fix five-question newline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript question separator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          pattern = r"question:chosen\.map\(\(q,i\)=>`\$\{i\+1\}\. \$\{q\.question\}`\)\.join\('.*?'\),"
          replacement = "question:chosen.map((q,i)=>`${i+1}. ${q.question}`).join(String.fromCharCode(10,10)),"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('newline repair failed')
          app.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: repair five-question JavaScript separator"
          git push
