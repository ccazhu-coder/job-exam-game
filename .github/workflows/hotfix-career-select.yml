name: Hotfix career selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unlock career selector and clarify label
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          old = "$('careerSelect').disabled=state.round!=='career'"
          new = "$('careerSelect').disabled=false"
          if old in text:
              app.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<label>求職方向</label>', '<label>求職方向（可先選擇；第三輪依此出題）</label>')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "fix: allow career selection in every round"
          git push
