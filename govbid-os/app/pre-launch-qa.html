<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜正式上線前驗收</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜正式上線前驗收</div><div class="sub">正式上線前 Gate：強制使用最新版 Production API，不再讀取舊 config.js。</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span12"><h2>一鍵驗收</h2><div class="hint">本頁已直接指定最新 Web App URL，避免 GitHub Pages 或瀏覽器快取造成串連錯誤。</div><div class="btns"><button id="runBtn" onclick="runAll()">一鍵執行正式上線前驗收</button><button class="secondary" onclick="clearLog()">清除結果</button></div><div id="summary" class="kpis" style="margin-top:12px"></div><div id="log" class="msg">尚未驗收。</div></section><section class="card span12"><h2>正式頁面入口</h2><div class="btns"><button class="secondary" onclick="location.href='./dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='./projects.html'">專案管理</button><button class="secondary" onclick="location.href='./activities.html'">活動管理</button><button class="secondary" onclick="location.href='./enrollment.html'">招生報名</button><button class="secondary" onclick="location.href='./course-ops.html'">課程執行</button><button class="secondary" onclick="location.href='./vendors.html'">廠商管理</button><button class="secondary" onclick="location.href='./crm.html'">CRM</button><button class="secondary" onclick="location.href='./archive.html'">核銷歸檔</button></div></section></div></main><script>window.GOVOPS_CONFIG={ENV:'production',VERSION:'2026.05.13-force-router-fix-direct',APP_NAME:'GovOps OS',PLAN:'enterprise',API_URL:'https://script.google.com/macros/s/AKfycbw10pdDg_lpoeb86nU_SJfBs2kex30xPKS50pOnJD5-Z7YGPeI0MSjuJwPbd5zJbyandQ/exec'};</script><script src="./govops-api-client.js?v=force-router-fix-20260513-2"></script><script src="./erp-aligned-core.js?v=force-router-fix-20260513-2"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();let running=false;const requiredTests=[['初始化合作廠商主檔',{action:'初始化合作廠商主檔'}],['初始化招生報名系統',{action:'初始化招生報名系統'}],['初始化課程執行系統',{action:'初始化課程執行系統'}],['查詢專案',{action:'查詢專案'}],['查詢活動',{action:'查詢活動'}],['查詢合作廠商',{action:'查詢合作廠商'}],['查詢招生活動',{action:'查詢招生活動'}],['查詢報名資料庫',{action:'查詢報名資料庫'}],['查詢學員CRM',{action:'查詢學員CRM'}],['查詢簽到表',{action:'查詢簽到表'}],['查詢課程執行資料',{action:'查詢課程執行資料',模組:'課程執行紀錄'}]];const optionalTests=[['正式平台初始化',{action:'正式平台初始化'}],['正式平台健康檢查',{action:'正式平台健康檢查'}],['查詢核銷缺件',{action:'查詢核銷缺件'}],['取得ERP儀表板',{action:'取得ERP儀表板'}],['ERP專案總覽',{action:'ERP專案總覽'}],['ERP風險報告',{action:'ERP風險報告'}],['行銷名單',{action:'行銷名單'}],['回流學員分析',{action:'回流學員分析'}]];function line(t){document.getElementById('log').textContent+='\n'+t}function clearLog(){document.getElementById('log').textContent='尚未驗收。';document.getElementById('summary').innerHTML=''}function ok(res){return !!(res&&res.success)}function missingRoute(res){return res&&String(res.message||'').indexOf('找不到對應功能')>=0}async function callTest(name,payload,optional){line('▶ '+name);const res=await ERPALIGNED.api(payload);if(ok(res)){line('✅ '+name+'｜'+(res.message||'通過'));return{pass:1,fail:0,skip:0}}if(optional&&missingRoute(res)){line('⚠️ '+name+'｜後端尚未提供此統整 action，已列為選配，不阻擋正式驗收');return{pass:0,fail:0,skip:1}}line('❌ '+name+'｜'+((res&&res.message)||'失敗'));return{pass:0,fail:1,skip:0}}async function runAll(){if(running)return;running=true;document.getElementById('runBtn').disabled=true;clearLog();document.getElementById('log').textContent='';let pass=0,fail=0,skip=0;line('開始驗收：'+new Date().toLocaleString());line('API URL：'+((window.GOVOPS_CONFIG&&GOVOPS_CONFIG.API_URL)||'未設定'));for(const [name,payload] of requiredTests){const r=await callTest(name,payload,false);pass+=r.pass;fail+=r.fail;skip+=r.skip}line('--- 選配檢查 ---');for(const [name,payload] of optionalTests){const r=await callTest(name,payload,true);pass+=r.pass;fail+=r.fail;skip+=r.skip}const status=fail===0?'可進入人工流程驗收':'需修正';document.getElementById('summary').innerHTML='<div class="kpi"><div class="num">'+pass+'</div><div class="name">通過</div></div><div class="kpi"><div class="num">'+fail+'</div><div class="name">未通過</div></div><div class="kpi"><div class="num">'+skip+'</div><div class="name">選配略過</div></div><div class="kpi"><div class="num">'+status+'</div><div class="name">判斷</div></div>';line('驗收完成：'+status);document.getElementById('runBtn').disabled=false;running=false;}</script></body></html>
