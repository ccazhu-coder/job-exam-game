<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜正式上線前驗收</title><link rel="stylesheet" href="./erp-page-style.css"><script src="./config.js?v=codegs-allinone-final-20260513"></script></head><body><header><div class="wrap"><div class="brand">GovOps OS｜正式上線前驗收</div><div class="sub">正式上線前 Gate：強制使用最新【程式碼.gs】ALL-IN-ONE 後端。</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span12"><h2>一鍵驗收</h2><div class="hint">本頁透過 config.js 指向最新 Web App URL，確保後端版本一致。</div><div class="btns"><button id="runBtn" onclick="runAll()">一鍵執行正式上線前驗收</button><button class="secondary" onclick="clearLog()">清除結果</button></div><div id="summary" class="kpis" style="margin-top:12px"></div><div id="log" class="msg">尚未驗收。</div></section><section class="card span12"><h2>正式頁面入口</h2><div class="btns"><button class="secondary" onclick="location.href='./dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='./projects.html'">專案管理</button><button class="secondary" onclick="location.href='./activities.html'">活動管理</button><button class="secondary" onclick="location.href='./enrollment.html'">招生報名</button><button class="secondary" onclick="location.href='./course-ops.html'">課程執行</button><button class="secondary" onclick="location.href='./vendors.html'">廠商管理</button><button class="secondary" onclick="location.href='./crm.html'">CRM</button><button class="secondary" onclick="location.href='./archive.html'">核銷歸檔</button></div></section></div></main><script src="./govops-api-client.js?v=codegs-allinone-final-20260513"></script><script src="./erp-aligned-core.js?v=codegs-allinone-final-20260513"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();let running=false;const requiredTests=[['正式平台健康檢查',{action:'正式平台健康檢查'}],['正式平台初始化',{action:'正式平台初始化'}],['初始化合作廠商主檔',{action:'初始化合作廠商主檔'}],['初始化招生報名系統',{action:'初始化招生報名系統'}],['初始化課程執行系統',{action:'初始化課程執行系統'}],['查詢專案',{action:'查詢專案'}],['查詢活動',{action:'查詢活動'}],['查詢合作廠商',{action:'查詢合作廠商'}],['查詢招生活動',{action:'查詢招生活動'}],['查詢報名資料庫',{action:'查詢報名資料庫'}],['查詢學員CRM',{action:'查詢學員CRM'}],['查詢簽到表',{action:'查詢簽到表'}],['查詢課程執行資料',{action:'查詢課程執行資料',模組:'課程執行紀錄'}],['查詢核銷缺件',{action:'查詢核銷缺件'}],['取得ERP儀表板',{action:'取得ERP儀表板'}],['ERP專案總覽',{action:'ERP專案總覽'}],['ERP風險報告',{action:'ERP風險報告'}],['行銷名單',{action:'行銷名單'}],['回流學員分析',{action:'回流學員分析'}]];function line(t){document.getElementById('log').textContent+='\n'+t}function clearLog(){document.getElementById('log').textContent='尚未驗收。';document.getElementById('summary').innerHTML=''}function ok(res){return !!(res&&res.success)}async function callTest(name,payload){line('▶ '+name);const res=await ERPALIGNED.api(payload);if(ok(res)){line('✅ '+name+'｜'+(res.message||'通過'));return{pass:1,fail:0}}line('❌ '+name+'｜'+((res&&res.message)||'失敗'));return{pass:0,fail:1}}async function runAll(){if(running)return;running=true;document.getElementById('runBtn').disabled=true;clearLog();document.getElementById('log').textContent='';let pass=0,fail=0;line('開始驗收：'+new Date().toLocaleString());line('API URL：'+((window.GOVOPS_CONFIG&&GOVOPS_CONFIG.API_URL)||'未設定'));for(const [name,payload] of requiredTests){const r=await callTest(name,payload);pass+=r.pass;fail+=r.fail}const status=fail===0?'可進入人工流程驗收':'需修正';document.getElementById('summary').innerHTML='<div class="kpi"><div class="num">'+pass+'</div><div class="name">通過</div></div><div class="kpi"><div class="num">'+fail+'</div><div class="name">未通過</div></div><div class="kpi"><div class="num">'+requiredTests.length+'</div><div class="name">總項目</div></div><div class="kpi"><div class="num">'+status+'</div><div class="name">判斷</div></div>';line('驗收完成：'+status);document.getElementById('runBtn').disabled=false;running=false;}</script></body></html>
