<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜正式上線前驗收</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜正式上線前驗收</div><div class="sub">正式上線前 Gate：後端初始化、健康檢查、ERP 全模組 API、頁面連結</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span12"><h2>一鍵驗收</h2><div class="hint">驗收期重點：確認後端 action 能跑、資料能查、新增／修改／查詢都能呼叫。招生報名與課程執行已納入正式驗收。</div><div class="btns"><button onclick="runAll()">一鍵執行正式上線前驗收</button><button class="secondary" onclick="clearLog()">清除結果</button></div><div id="summary" class="kpis" style="margin-top:12px"></div><div id="log" class="msg">尚未驗收。</div></section><section class="card span12"><h2>正式頁面入口</h2><div class="btns"><button class="secondary" onclick="location.href='./dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='./projects.html'">專案管理</button><button class="secondary" onclick="location.href='./activities.html'">活動管理</button><button class="secondary" onclick="location.href='./enrollment.html'">招生報名</button><button class="secondary" onclick="location.href='./course-ops.html'">課程執行</button><button class="secondary" onclick="location.href='./vendors.html'">廠商管理</button><button class="secondary" onclick="location.href='./crm.html'">CRM</button><button class="secondary" onclick="location.href='./archive.html'">核銷歸檔</button></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();const tests=[['正式平台初始化',{action:'正式平台初始化'}],['正式平台健康檢查',{action:'正式平台健康檢查'}],['初始化合作廠商主檔',{action:'初始化合作廠商主檔'}],['初始化招生報名系統',{action:'初始化招生報名系統'}],['初始化課程執行系統',{action:'初始化課程執行系統'}],['查詢專案',{action:'查詢專案'}],['查詢活動',{action:'查詢活動'}],['查詢合作廠商',{action:'查詢合作廠商'}],['查詢招生活動',{action:'查詢招生活動'}],['查詢報名資料庫',{action:'查詢報名資料庫'}],['查詢學員CRM',{action:'查詢學員CRM'}],['查詢簽到表',{action:'查詢簽到表'}],['查詢課程執行資料',{action:'查詢課程執行資料',模組:'課程執行紀錄'}],['查詢核銷缺件',{action:'查詢核銷缺件'}],['取得ERP儀表板',{action:'取得ERP儀表板'}],['ERP專案總覽',{action:'ERP專案總覽'}],['ERP風險報告',{action:'ERP風險報告'}],['行銷名單',{action:'行銷名單'}],['回流學員分析',{action:'回流學員分析'}]];function line(t){document.getElementById('log').textContent+='\n'+t}function clearLog(){document.getElementById('log').textContent='';document.getElementById('summary').innerHTML=''}async function runAll(){clearLog();let pass=0,fail=0;line('開始驗收：'+new Date().toLocaleString());for(const [name,payload] of tests){line('▶ '+name);const res=await ERPALIGNED.api(payload);if(res&&res.success){pass++;line('✅ '+name+'｜'+(res.message||'通過'))}else{fail++;line('❌ '+name+'｜'+((res&&res.message)||'失敗'))}}document.getElementById('summary').innerHTML='<div class="kpi"><div class="num">'+pass+'</div><div class="name">通過</div></div><div class="kpi"><div class="num">'+fail+'</div><div class="name">未通過</div></div><div class="kpi"><div class="num">'+tests.length+'</div><div class="name">總項目</div></div><div class="kpi"><div class="num">'+(fail===0?'可進入人工流程驗收':'需修正')+'</div><div class="name">判斷</div></div>';line('驗收完成。');}</script></body></html>
