<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ProjectOps ERP｜專案池</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:#102542;color:#fff;padding:26px}main{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}label{display:block;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;box-sizing:border-box}textarea{min-height:90px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:900;background:#1d4e89;color:white;cursor:pointer;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left}th{background:#f8fafc}@media(max-width:800px){.span-6,.span-4{grid-column:span 12}}</style></head><body><header><h1>ProjectOps ERP｜專案池</h1><div>新增政府標案、自辦課程、合作課程，後續共用招生、開課、派工、CRM、結案流程</div></header><main><section class="card"><h2>新增專案</h2><div class="grid"><div class="span-4"><label>案源類型</label><select id="sourceType" onchange="toggleType()"><option>自辦課程</option><option>政府標案</option><option>合作課程</option><option>企業委託</option><option>政府補助案</option><option>其他</option></select></div><div class="span-4"><label>專案名稱</label><input id="projectName"></div><div class="span-4"><label>專案類型</label><input id="projectType" placeholder="課程/講座/諮詢/活動"></div><div class="span-4"><label>主辦單位</label><input id="ownerOrg"></div><div class="span-4"><label>合作單位</label><input id="partnerOrg"></div><div class="span-4"><label>負責人</label><input id="ownerName"></div><div class="span-4"><label>開始日期</label><input id="startDate" type="date"></div><div class="span-4"><label>結束日期</label><input id="endDate" type="date"></div><div class="span-4"><label>預算/營收目標</label><input id="targetAmount" type="number"></div><div class="span-12"><label>備註</label><textarea id="note"></textarea></div></div><div id="govBox" style="display:none"><h3>政府標案資料</h3><div class="grid"><div class="span-4"><label>機關名稱</label><input id="agencyName"></div><div class="span-4"><label>採購類型</label><input id="procurementType"></div><div class="span-4"><label>截止日期</label><input id="deadline" type="date"></div><div class="span-4"><label>預算金額</label><input id="budget" type="number"></div><div class="span-4"><label>押標金</label><input id="bidBond"></div><div class="span-4"><label>履約保證金</label><input id="performanceBond"></div><div class="span-12"><label>標案連結</label><input id="tenderUrl"></div></div></div><div id="courseBox"><h3>自辦課程資料</h3><div class="grid"><div class="span-4"><label>課程定價</label><input id="price" type="number"></div><div class="span-4"><label>早鳥價</label><input id="earlyPrice" type="number"></div><div class="span-4"><label>優惠價</label><input id="salePrice" type="number"></div><div class="span-4"><label>招生目標人數</label><input id="targetPeople" type="number"></div><div class="span-4"><label>最低開課人數</label><input id="minPeople" type="number"></div><div class="span-4"><label>付款方式</label><input id="payMethod"></div></div></div><button class="good" onclick="createProject()">建立專案</button><button onclick="bootstrapProject()">建立專案＋場次＋招生草稿</button><button class="secondary" onclick="queryProjects()">查詢專案</button><button class="secondary" onclick="location.href='./registration-management.html'">報名管理</button><button class="secondary" onclick="location.href='./task-assignment.html'">任務派工</button><div id="result" class="status">尚未操作。</div></section><section class="card"><h2>專案清單</h2><input id="keyword" placeholder="搜尋專案名稱/專案ID/案源類型"><button onclick="queryProjects()">搜尋</button><div id="projectTable"></div></section></main><script>const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'';function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO'}}}function val(id){return(document.getElementById(id)||{}).value||''}function payload(){const u=profile();return{tenantId:u.tenantId,userId:u.userId,案源類型:val('sourceType'),專案名稱:val('projectName'),專案類型:val('projectType'),主辦單位:val('ownerOrg'),合作單位:val('partnerOrg'),負責人:val('ownerName'),開始日期:val('startDate'),結束日期:val('endDate'),營收目標:val('targetAmount'),預算金額:val('targetAmount'),備註:val('note'),機關名稱:val('agencyName'),採購類型:val('procurementType'),截止日期:val('deadline'),押標金:val('bidBond'),履約保證金:val('performanceBond'),標案連結:val('tenderUrl'),預算金額:val('budget')||val('targetAmount'),課程名稱:val('projectName'),課程類型:val('projectType'),課程定價:val('price'),早鳥價:val('earlyPrice'),優惠價:val('salePrice'),招生目標人數:val('targetPeople'),最低開課人數:val('minPeople'),付款方式:val('payMethod')}}async function api(data){document.getElementById('result').textContent='處理中...';let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}document.getElementById('result').textContent=JSON.stringify(res,null,2);return res}function toggleType(){const isGov=val('sourceType')==='政府標案';document.getElementById('govBox').style.display=isGov?'block':'none';document.getElementById('courseBox').style.display=isGov?'none':'block'}async function createProject(){await api(Object.assign({action:'project.create'},payload()));queryProjects()}async function bootstrapProject(){await api(Object.assign({action:'project.bootstrap'},payload()));queryProjects()}async function queryProjects(){const u=profile();const r=await api({action:'project.query',tenantId:u.tenantId,userId:u.userId,keyword:val('keyword')});const rows=(r.data&&r.data.rows)||[];document.getElementById('projectTable').innerHTML=rows.length?'<table><thead><tr><th>專案ID</th><th>案源</th><th>專案名稱</th><th>狀態</th><th>主辦單位</th><th>開始</th><th>結束</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+safe(x.專案ID)+'</td><td>'+safe(x.案源類型)+'</td><td>'+safe(x.專案名稱)+'</td><td>'+safe(x.專案狀態)+'</td><td>'+safe(x.主辦單位)+'</td><td>'+safe(x.開始日期)+'</td><td>'+safe(x.結束日期)+'</td></tr>').join('')+'</tbody></table>':'<div class="status">無專案資料</div>'}function safe(x){return String(x||'').replace(/[<>&]/g,'')}toggleType();queryProjects();</script></body></html>
