<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜核銷歸檔</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">對齊：核銷檢查中心／09_成果附件</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>核銷歸檔</h1>
    <p>追蹤簽到表、成果照片、核銷單據等文件；查詢結果點「編輯」修改</p>
  </div>
  <div class="grid">
    <section class="card span4">
      <h2>新增核銷文件</h2>
      <form id="createForm">
        <div class="form-row">
          <div class="field"><label>活動ID＊</label><input name="活動ID" required placeholder="ACT-…"></div>
          <div class="field"><label>文件名稱＊</label><input name="文件名稱" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label>文件類型</label>
            <select name="文件類型"><option>簽到表</option><option>成果照片</option><option>滿意度</option><option>核銷單據</option><option>成果報告</option><option>其他</option></select>
          </div>
          <div class="field"><label>狀態</label>
            <select name="狀態"><option>已上傳</option><option>待補件</option><option>已確認</option></select>
          </div>
        </div>
        <label>Drive 連結</label><input name="driveUrl" type="url">
        <label>備註</label><textarea name="備註" rows="2"></textarea>
        <div class="btns"><button type="submit">新增文件</button></div>
      </form>
      <div id="createMsg" class="msg" style="margin-top:8px">尚未新增。</div>

      <div class="section-sep" style="margin-top:16px"><span>快速功能</span></div>
      <div class="btns" style="flex-direction:column;align-items:stretch">
        <button class="secondary" onclick="queryMissing()">查詢核銷缺件</button>
        <button class="secondary" onclick="buildFolder()">建立活動資料夾</button>
      </div>
      <div id="actionMsg" class="msg" style="margin-top:8px;display:none"></div>
    </section>

    <section class="card span8">
      <h2>查詢文件</h2>
      <div class="form-row">
        <div class="field"><input id="keyword" placeholder="活動ID、文件名稱、狀態" onkeydown="if(event.key==='Enter')queryArchive()"></div>
        <div class="field" style="max-width:110px"><button onclick="queryArchive()">查詢</button></div>
      </div>
      <div id="queryMsg" class="msg">尚未查詢。</div>
      <div id="table" style="margin-top:8px"></div>
    </section>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const o = {action:'新增成果文件'}; fd.forEach((v,k)=>{if(v)o[k]=v;});
  const r = await ERPALIGNED.api(o, 'createMsg');
  if (r && r.success) { e.target.reset(); queryArchive(); }
});

const ARC_EDIT_FIELDS = [
  {name:'文件ID', label:'文件 ID', readonly:true},
  {name:'活動ID', label:'活動 ID'},
  {name:'文件名稱', label:'文件名稱'},
  {name:'文件類型', label:'文件類型', type:'select', options:['簽到表','成果照片','滿意度','核銷單據','成果報告','其他']},
  {name:'狀態', label:'狀態', type:'select', options:['已上傳','待補件','已確認']},
  {name:'缺件項目', label:'缺件項目'},
  {name:'driveUrl', label:'Drive 連結'},
  {name:'備註', label:'備註', type:'textarea'}
];

function openArcEdit(row) {
  ERPALIGNED.showEditModal('編輯文件：' + (row['文件名稱']||''), ARC_EDIT_FIELDS, row, '修改成果文件', '文件ID', queryArchive);
}

async function queryArchive() {
  const r = await ERPALIGNED.api({action:'查詢成果文件', keyword: document.getElementById('keyword').value}, 'queryMsg');
  ERPALIGNED.renderTableWithEdit(r, 'table', openArcEdit,
    ['文件ID','活動ID','文件名稱','文件類型','狀態','driveUrl']);
}

async function queryMissing() {
  const el = document.getElementById('actionMsg');
  el.style.display = '';
  const r = await ERPALIGNED.api({action:'查詢核銷缺件'}, 'actionMsg');
  ERPALIGNED.renderTableWithEdit(r, 'table', openArcEdit, ['活動ID','文件類型','文件名稱','狀態','缺件說明']);
}

async function buildFolder() {
  const kw = document.getElementById('keyword').value;
  if (!kw) { document.getElementById('actionMsg').style.display=''; document.getElementById('actionMsg').textContent='❌ 請先在查詢欄填入活動ID'; return; }
  document.getElementById('actionMsg').style.display='';
  await ERPALIGNED.api({action:'建立活動資料夾與歸檔清單', 活動ID: kw}, 'actionMsg');
}

queryArchive();
</script>
</body>
</html>
