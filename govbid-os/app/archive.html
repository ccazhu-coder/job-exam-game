<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜核銷與歸檔</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜核銷與歸檔</div><div class="sub">對齊：核銷檢查中心／09_成果附件／30_結案交付</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span6"><h2>新增核銷／成果文件</h2><form id="createForm"><label>活動ID＊</label><input name="活動ID" required><label>文件名稱＊</label><input name="文件名稱" required><div class="row"><div><label>文件類型</label><select name="文件類型"><option>簽到表</option><option>成果照片</option><option>滿意度</option><option>核銷單據</option><option>成果報告</option><option>其他</option></select></div><div><label>狀態</label><select name="狀態"><option>已上傳</option><option>待補件</option><option>已確認</option></select></div></div><label>Drive 連結</label><input name="driveUrl"><label>備註</label><textarea name="備註"></textarea><button>新增文件</button></form><div id="createMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>修改核銷資料</h2><form id="updateForm"><label>文件ID</label><input name="文件ID"><label>文件名稱</label><input name="文件名稱"><div class="row"><div><label>狀態</label><select name="狀態"><option value="">不變更</option><option>已上傳</option><option>待補件</option><option>已確認</option></select></div><div><label>缺件項目</label><input name="缺件項目"></div></div><label>Drive 連結</label><input name="driveUrl"><label>備註</label><textarea name="備註"></textarea><button class="green">修改文件</button></form><div class="btns"><button class="secondary" onclick="queryMissing()">查詢核銷缺件</button><button class="secondary" onclick="buildFolder()">建立活動資料夾</button></div><div id="updateMsg" class="msg">尚未修改。</div></section><section class="card span12"><h2>查詢文件／核銷狀態</h2><div class="row"><input id="keyword" placeholder="活動ID、文件名稱、狀態"><button onclick="queryArchive()">查詢文件</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function obj(id,action){const fd=new FormData(document.getElementById(id));const o={action};fd.forEach((v,k)=>{if(v)o[k]=v});return o}document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('createForm','新增成果文件'),'createMsg');queryArchive();});document.getElementById('updateForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('updateForm','修改成果文件'),'updateMsg');queryArchive();});async function queryArchive(){const r=await ERPALIGNED.api({action:'查詢成果文件',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}async function queryMissing(){const r=await ERPALIGNED.api({action:'查詢核銷缺件'},'updateMsg');ERPALIGNED.renderTable(r,'table')}async function buildFolder(){const id=document.querySelector('[name="活動ID"]').value;if(!id){document.getElementById('updateMsg').textContent='請先填寫活動ID';return}await ERPALIGNED.api({action:'建立活動資料夾與歸檔清單',活動ID:id},'updateMsg')}queryArchive();</script></body></html>
