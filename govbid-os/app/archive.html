<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜核銷歸檔</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">政府標案全流程營運系統</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>核銷歸檔</h1>
    <p>追蹤簽到表、成果照片、核銷單據等文件狀態</p>
  </div>
  <div class="card">
    <div class="btns" style="margin-bottom:10px;flex-wrap:wrap">
      <button class="gold" onclick="openCreate()">＋ 新增文件</button>
      <button class="secondary" style="font-size:.8rem" onclick="queryMissing()">查詢缺件</button>
      <button class="secondary" style="font-size:.8rem" onclick="buildFolder()">建立活動資料夾</button>
      <div style="flex:1"></div>
      <input id="keyword" placeholder="活動ID、文件名稱、狀態…" style="max-width:240px;margin:0" onkeydown="if(event.key==='Enter')query()">
      <button onclick="query()">查詢</button>
    </div>
    <div id="queryMsg" class="msg">載入中…</div>
    <div id="table" style="margin-top:8px"></div>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

const ARC_CREATE = [
  {name:'活動ID', label:'活動ID＊'},
  {name:'文件名稱', label:'文件名稱＊'},
  {name:'文件類型', label:'文件類型', type:'select', options:['簽到表','成果照片','滿意度','核銷單據','成果報告','其他']},
  {name:'狀態', label:'狀態', type:'select', options:['已上傳','待補件','已確認']},
  {name:'driveUrl', label:'Drive 連結'},
  {name:'備註', label:'備註', type:'textarea'}
];
const ARC_EDIT = [
  {name:'文件ID', label:'文件 ID', readonly:true},
  {name:'活動ID', label:'活動ID'},
  {name:'文件名稱', label:'文件名稱'},
  {name:'文件類型', label:'文件類型', type:'select', options:['簽到表','成果照片','滿意度','核銷單據','成果報告','其他']},
  {name:'狀態', label:'狀態', type:'select', options:['已上傳','待補件','已確認']},
  {name:'缺件項目', label:'缺件項目'},
  {name:'driveUrl', label:'Drive 連結'},
  {name:'備註', label:'備註', type:'textarea'}
];

function openCreate(){ERPALIGNED.showEditModal('新增核銷文件',ARC_CREATE,{},'新增成果文件',null,query);}
function openEdit(row){ERPALIGNED.showEditModal('編輯文件：'+row['文件名稱'],ARC_EDIT,row,'修改成果文件','文件ID',query);}
async function query(){
  const r=await ERPALIGNED.api({action:'查詢成果文件',keyword:document.getElementById('keyword').value},'queryMsg');
  ERPALIGNED.renderTableWithEdit(r,'table',openEdit,['文件ID','活動ID','文件名稱','文件類型','狀態','driveUrl']);
}
async function queryMissing(){
  const r=await ERPALIGNED.api({action:'查詢核銷缺件'},'queryMsg');
  ERPALIGNED.renderTableWithEdit(r,'table',openEdit,['活動ID','文件類型','文件名稱','狀態','缺件說明']);
}
async function buildFolder(){
  const kw=document.getElementById('keyword').value;
  if(!kw){document.getElementById('queryMsg').textContent='❌ 請先在查詢欄填入活動ID再建立資料夾';return;}
  await ERPALIGNED.api({action:'建立活動資料夾與歸檔清單',活動ID:kw},'queryMsg');
}
query();
</script>
</body>
</html>
