<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜招生／報名／簽到</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜招生／報名／簽到</div><div class="sub">對齊：招生活動管理、報名資料庫、學員CRM、簽到表、簽到表紀錄</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span6"><h2>新增招生活動</h2><form id="campaignForm"><label>課程名稱＊</label><input name="課程名稱" required><div class="row"><div><label>專案ID</label><input name="專案ID"></div><div><label>活動ID</label><input name="活動ID"></div></div><div class="row"><div><label>開課日期</label><input name="開課日期" type="date"></div><div><label>招生名額</label><input name="招生名額" type="number"></div></div><div class="row"><div><label>報名開始日</label><input name="報名開始日" type="date"></div><div><label>報名截止日</label><input name="報名截止日" type="date"></div></div><label>招生渠道</label><input name="招生渠道" placeholder="FB、LINE、表單、官網"><button>新增招生活動</button></form><div id="campaignMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>新增報名資料</h2><form id="registrationForm"><label>招生活動ID＊</label><input name="招生活動ID" required><label>姓名＊</label><input name="姓名" required><div class="row"><div><label>電話＊</label><input name="電話" required></div><div><label>Email</label><input name="Email"></div></div><div class="row"><div><label>身分別</label><input name="身分別"></div><div><label>服務單位</label><input name="服務單位"></div></div><label>報名來源</label><input name="報名來源"><button>新增報名／同步CRM</button></form><div id="registrationMsg" class="msg">尚未新增。</div></section><section class="card span12"><h2>招生與報名查詢</h2><div class="row"><input id="keyword" placeholder="課程、姓名、電話、Email"><button onclick="queryCampaigns()">查詢招生活動</button><button onclick="queryRegistrations()">查詢報名資料庫</button><button onclick="queryCRM()">查詢學員CRM</button></div><div class="btns"><button class="secondary" onclick="generateAttendance()">產出簽到表</button><button class="secondary" onclick="queryAttendance()">查詢簽到表</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function obj(id,action){const fd=new FormData(document.getElementById(id));const o={action};fd.forEach((v,k)=>{if(v)o[k]=v});return o}document.getElementById('campaignForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('campaignForm','新增招生活動'),'campaignMsg');});document.getElementById('registrationForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('registrationForm','新增報名'),'registrationMsg');});async function queryCampaigns(){const r=await ERPALIGNED.api({action:'查詢招生活動',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}async function queryRegistrations(){const r=await ERPALIGNED.api({action:'查詢報名資料庫',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}async function queryCRM(){const r=await ERPALIGNED.api({action:'查詢學員CRM',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}async function generateAttendance(){const id=prompt('請輸入招生活動ID');if(!id)return;await ERPALIGNED.api({action:'產出簽到表','招生活動ID':id},'queryMsg')}async function queryAttendance(){const id=prompt('請輸入招生活動ID');const r=await ERPALIGNED.api({action:'查詢簽到表','招生活動ID':id},'queryMsg');ERPALIGNED.renderTable(r,'table')}</script></body></html>
