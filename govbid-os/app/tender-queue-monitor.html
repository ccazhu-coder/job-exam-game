<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜標案文件 Queue 監控台</title>
<script src="./config.js"></script>
<script src="./saas-runtime.js"></script>
<script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:white;padding:30px 20px}.wrap{max-width:1180px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:26px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}textarea{min-height:120px}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.danger{background:#b42318}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}@media(max-width:900px){.span-6{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>標案文件 Queue 監控台</h1><div class="sub">SaaS Queue Runtime｜批次、佇列、Worker、失敗重試、卡住釋放、健康檢查。</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>Queue Runtime 總覽</h2><button class="good" onclick="loadHealth()">載入健康狀態</button><button onclick="runWorker()">手動執行 Worker</button><button class="secondary" onclick="installWorker()">安裝 Worker</button><button class="secondary" onclick="repairQueue()">修復 Queue</button><button class="danger" onclick="releaseStuck()">釋放卡住佇列</button><button class="secondary" onclick="location.href='./tender-erp.html'">回標案 ERP</button><div class="kpis" id="kpiBox"></div><div id="healthResult" class="status">尚未載入。</div></section>
<section class="card span-6"><h2>建立文件批次</h2><label>標案ID</label><input id="batchTenderId"><label>標案名稱</label><input id="batchTenderName"><label>Drive URL 清單（一行一個）</label><textarea id="fileList"></textarea><button class="good" onclick="createBatch()">建立批次</button><div id="batchCreateResult" class="status">尚未建立。</div></section>
<section class="card span-6"><h2>查詢批次 / Queue</h2><label>批次ID</label><input id="batchId"><button onclick="loadBatchStatus()">查詢批次</button><button onclick="retryFailed()">重試失敗</button><div id="batchResult" class="status">尚未查詢。</div></section>
<section class="card span-12"><h2>Queue 明細</h2><div id="queueTable"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.userRole||u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function renderKpis(summary,status){summary=summary||{};const items=[['狀態',status||'-'],['總數',summary.total||0],['等待',summary.waiting||0],['處理中',summary.processing||0],['完成',summary.done||0],['失敗',summary.failed||0]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}
function renderQueue(rows){rows=rows||[];const box=document.getElementById('queueTable');if(!rows.length){box.innerHTML='<div class="status">無 Queue 明細</div>';return}const keys=['佇列ID','批次ID','文件類型','檔案名稱','處理階段','處理狀態','重試次數','錯誤訊息'];box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function loadHealth(){const r=await api({action:'tender.document.queueHealth'},'healthResult');renderKpis(r.data&&r.data.summary,r.data&&r.data.status)}
async function runWorker(){const r=await api({action:'tender.document.worker.run',limit:5},'healthResult');const h=r.data&&r.data.queueHealth;renderKpis(h&&h.summary,h&&h.status)}
async function installWorker(){await api({action:'tender.document.worker.install',everyMinutes:5},'healthResult')}
async function repairQueue(){await api({action:'tender.document.queue.repair'},'healthResult');loadHealth()}
async function releaseStuck(){await api({action:'tender.document.queue.releaseStuck',minutes:20},'healthResult');loadHealth()}
async function retryFailed(){await api({action:'tender.document.queueRetryFailed'},'batchResult');loadBatchStatus()}
async function createBatch(){const files=val('fileList').split('\n').map(x=>x.trim()).filter(Boolean).map(url=>({DriveURL:url}));await api({action:'tender.document.batchCreate',標案ID:val('batchTenderId'),標案名稱:val('batchTenderName'),files:JSON.stringify(files)},'batchCreateResult');loadHealth()}
async function loadBatchStatus(){const r=await api({action:'tender.document.batchStatus',批次ID:val('batchId')},'batchResult');renderQueue(r.data&&r.data.queueRows);renderKpis(r.data&&r.data.queueSummary,'batch')}
loadHealth();
</script>
</body>
</html>
