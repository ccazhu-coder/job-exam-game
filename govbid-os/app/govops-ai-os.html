<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps AI OS</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;background:#f8fafc;color:#0f172a}header{background:linear-gradient(135deg,#1d4ed8,#2563eb,#7c3aed);color:white;padding:28px 18px;border-radius:0 0 26px 26px}h1{margin:0;font-size:28px}p{line-height:1.7}.page{max-width:1180px;margin:0 auto;padding:16px 16px 88px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 25px rgba(15,23,42,.08)}label{display:block;font-size:13px;color:#64748b;font-weight:800;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:14px;font-size:15px;box-sizing:border-box}button{border:0;border-radius:999px;padding:11px 16px;background:#2563eb;color:white;font-weight:900;font-size:15px;margin:6px 6px 6px 0}button.secondary{background:#e2e8f0;color:#0f172a}.grid{display:grid;grid-template-columns:1fr;gap:10px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu button{border-radius:18px;text-align:left;background:white;color:#0f172a;border:1px solid #e2e8f0;box-shadow:0 10px 25px rgba(15,23,42,.08)}.section{display:none}.section.show{display:block}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px}.num{font-size:28px;font-weight:900}.small{font-size:13px;color:#64748b;line-height:1.6}.item{border:1px solid #e2e8f0;border-radius:16px;padding:13px;margin-bottom:10px}.msg{white-space:pre-wrap;color:#64748b;font-size:14px;line-height:1.6}.bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.bottom button{font-size:12px;background:#f1f5f9;color:#0f172a;margin:0;border-radius:14px}@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.menu{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>GovOps AI OS</h1><p>政府專案 AI 營運作業系統｜專案、活動、任務、核銷、請款、結案與 LINE 戰情中心</p></header>
<main class="page">
<section class="card"><h2>系統連線設定</h2><div class="grid"><div><label>GAS Web App API 網址</label><input id="apiUrl" placeholder="請貼上 Apps Script Web App 網址"></div><div><label>租戶ID</label><input id="tenantId" value="預設租戶"></div><div><label>使用者ID</label><input id="userId" value="系統管理者"></div></div><button onclick="saveConfig()">儲存設定</button><button class="secondary" onclick="testApi()">測試連線</button><button onclick="initSystem()">初始化系統</button><div id="sysMsg" class="msg">請先貼上 GAS Web App API 網址。</div></section>
<section class="menu"><button onclick="showPage('dashboard')"><b>AI 戰情中心</b><br><span class="small">今日最急、風險與請款</span></button><button onclick="showPage('projects')"><b>專案中心</b><br><span class="small">新增與查詢專案</span></button><button onclick="showPage('activities')"><b>活動中心</b><br><span class="small">活動、課程、場次</span></button><button onclick="showPage('tasks')"><b>任務中心</b><br><span class="small">逾期與待辦</span></button></section>
<section id="dashboard" class="section show"><div class="card"><h2>今日 GovOps 戰情</h2><button onclick="loadDashboard()">重新整理 Dashboard</button><button onclick="dailyCommand()">產生今日戰情</button><button onclick="riskCheck()">AI 風險檢查</button></div><div id="stats" class="stats"></div><div class="card"><h3>AI 建議</h3><div id="aiTips"></div></div><div class="card"><h3>今日活動</h3><div id="todayActivities"></div></div><div class="card"><h3>逾期任務</h3><div id="overdueTasks"></div></div></section>
<section id="projects" class="section"><div class="card"><h2>新增專案</h2><div class="grid"><div><label>專案名稱</label><input id="projectName"></div><div><label>專案類型</label><select id="projectType"><option>政府勞務採購</option><option>政府補助案</option><option>教育訓練案</option><option>活動執行案</option></select></div><div><label>機關名稱</label><input id="agencyName"></div><div><label>契約編號</label><input id="contractNo"></div><div><label>契約金額</label><input id="contractAmount" type="number"></div><div><label>請款方式</label><select id="paymentType"><option>一次結案付款</option><option>分期付款</option><option>每月請款</option><option>每場活動請款</option></select></div><div><label>履約起日</label><input id="startDate" type="date"></div><div><label>履約迄日</label><input id="endDate" type="date"></div><div><label>專案狀態</label><select id="projectStatus"><option>履約準備中</option><option>執行中</option><option>核銷中</option><option>請款中</option><option>已結案</option></select></div></div><button onclick="createProject()">新增專案</button><button class="secondary" onclick="listProjects()">查詢專案</button></div><div class="card"><h3>專案清單</h3><div id="projectList"></div></div></section>
<section id="activities" class="section"><div class="card"><h2>新增活動</h2><div class="grid"><div><label>所屬專案</label><select id="activityProjectId"></select></div><div><label>活動名稱</label><input id="activityName"></div><div><label>活動類型</label><select id="activityType"><option>課程</option><option>講座</option><option>說明會</option><option>媒合會</option></select></div><div><label>活動日期</label><input id="activityDate" type="date"></div><div><label>開始時間</label><input id="activityStart" type="time"></div><div><label>結束時間</label><input id="activityEnd" type="time"></div><div><label>活動地點</label><input id="activityPlace"></div><div><label>預計人數</label><input id="expectedPeople" type="number"></div><div><label>活動狀態</label><select id="activityStatus"><option>籌備中</option><option>招生中</option><option>待執行</option><option>已完成</option></select></div></div><button onclick="createActivity()">新增活動</button><button class="secondary" onclick="listActivities()">查詢活動</button></div><div class="card"><h3>活動清單</h3><div id="activityList"></div></div></section>
<section id="tasks" class="section"><div class="card"><h2>任務中心</h2><button onclick="listTasks()">查詢任務</button><button class="secondary" onclick="listOverdueTasks()">只看逾期</button></div><div class="card"><h3>任務清單</h3><div id="taskList"></div></div></section>
</main>
<nav class="bottom"><button onclick="showPage('dashboard')">戰情</button><button onclick="showPage('projects')">專案</button><button onclick="showPage('activities')">活動</button><button onclick="showPage('tasks')">任務</button></nav>
<script>
const state={apiUrl:'',tenantId:'預設租戶',userId:'系統管理者',projects:[],activities:[]};
window.addEventListener('load',()=>{loadConfig();if(state.apiUrl)refreshAll();});
function loadConfig(){state.apiUrl=localStorage.getItem('GovOpsAI_API')||'';state.tenantId=localStorage.getItem('GovOpsAI_Tenant')||'預設租戶';state.userId=localStorage.getItem('GovOpsAI_User')||'系統管理者';apiUrl.value=state.apiUrl;tenantId.value=state.tenantId;userId.value=state.userId;}
function saveConfig(){state.apiUrl=apiUrl.value.trim();state.tenantId=tenantId.value.trim()||'預設租戶';state.userId=userId.value.trim()||'系統管理者';localStorage.setItem('GovOpsAI_API',state.apiUrl);localStorage.setItem('GovOpsAI_Tenant',state.tenantId);localStorage.setItem('GovOpsAI_User',state.userId);msg('sysMsg','設定已儲存。');}
async function callApi(action,data={},filters={}){if(!state.apiUrl)throw new Error('尚未設定 GAS Web App API 網址');const res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify({action,tenantId:state.tenantId,userId:state.userId,data,filters})});const json=await res.json();if(!json.成功&&!json.ok)throw new Error(json.錯誤訊息||json.error||'API 呼叫失敗');return json.結果||json.result||json;}
function msg(id,text){document.getElementById(id).textContent=typeof text==='string'?text:JSON.stringify(text,null,2)}
function val(id){return document.getElementById(id).value||''}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function showPage(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');if(id==='projects')listProjects();if(id==='activities')listActivities();if(id==='tasks')listTasks();}
async function testApi(){try{saveConfig();msg('sysMsg','連線測試中...');msg('sysMsg',await callApi('健康檢查'));}catch(e){msg('sysMsg','連線失敗：'+e.message)}}
async function initSystem(){try{saveConfig();msg('sysMsg',await callApi('初始化系統'));}catch(e){msg('sysMsg','初始化失敗：'+e.message)}}
async function refreshAll(){await listProjects();await listActivities();await loadDashboard();updateSelects();}
async function loadDashboard(){try{const r=await callApi('取得Dashboard');const s=r.摘要||{};stats.innerHTML=[['專案數',s.專案數||0],['今日活動',s.今日活動數||0],['逾期任務',s.逾期任務數||0],['高風險案件',s.高風險案件數||0],['核銷缺件',s.核銷缺件數||0],['未完成請款',s.未完成請款數||0],['活動數',s.活動數||0],['風險警示',s.風險警示數||0]].map(x=>`<div class="stat"><div class="num">${x[1]}</div><div class="small">${x[0]}</div></div>`).join('');renderSimple('aiTips',(r.AI建議||[]));renderActivities('todayActivities',r.今日活動||[]);renderTasks('overdueTasks',r.逾期任務||[]);}catch(e){msg('sysMsg','Dashboard 載入失敗：'+e.message)}}
async function dailyCommand(){try{const r=await callApi('產生今日戰情');alert(r.LINE文字||JSON.stringify(r,null,2));await loadDashboard();}catch(e){alert('產生今日戰情失敗：'+e.message)}}
async function riskCheck(){try{alert(JSON.stringify(await callApi('每日AI風險檢查'),null,2));await loadDashboard();}catch(e){alert('AI 風險檢查失敗：'+e.message)}}
async function createProject(){try{const data={專案名稱:val('projectName'),專案類型:val('projectType'),機關名稱:val('agencyName'),契約編號:val('contractNo'),契約金額:val('contractAmount'),履約起日:val('startDate'),履約迄日:val('endDate'),請款方式:val('paymentType'),專案負責人ID:state.userId,專案狀態:val('projectStatus')};const r=await callApi('新增專案',data);alert(r.訊息||'專案已新增');await listProjects();updateSelects();}catch(e){alert('新增專案失敗：'+e.message)}}
async function listProjects(){try{const r=await callApi('查詢專案');state.projects=r.資料||[];renderProjects('projectList',state.projects);updateSelects();}catch(e){projectList.innerHTML='<div class="item">查詢失敗：'+esc(e.message)+'</div>'}}
async function createActivity(){try{const data={專案ID:val('activityProjectId'),活動名稱:val('activityName'),活動類型:val('activityType'),活動日期:val('activityDate'),開始時間:val('activityStart'),結束時間:val('activityEnd'),活動地點:val('activityPlace'),預計人數:val('expectedPeople'),是否招生:true,是否用餐:true,是否簽到:true,是否問卷:true,是否核銷:true,活動狀態:val('activityStatus')};const r=await callApi('新增活動',data);alert(r.訊息||'活動已新增');await listActivities();await listTasks();updateSelects();}catch(e){alert('新增活動失敗：'+e.message)}}
async function listActivities(){try{const r=await callApi('查詢活動');state.activities=r.資料||[];renderActivities('activityList',state.activities);updateSelects();}catch(e){activityList.innerHTML='<div class="item">查詢失敗：'+esc(e.message)+'</div>'}}
async function listTasks(){try{const r=await callApi('查詢任務');renderTasks('taskList',r.資料||[]);}catch(e){taskList.innerHTML='<div class="item">查詢失敗：'+esc(e.message)+'</div>'}}
async function listOverdueTasks(){try{const r=await callApi('查詢任務');const today=new Date().toISOString().slice(0,10);renderTasks('taskList',(r.資料||[]).filter(x=>x.預計完成日&&x.預計完成日<today&&x.任務狀態!=='已完成'));}catch(e){taskList.innerHTML='<div class="item">查詢失敗：'+esc(e.message)+'</div>'}}
function renderSimple(id,data){document.getElementById(id).innerHTML=data.length?data.map(x=>'<div class="item">'+esc(x)+'</div>').join(''):'<div class="item small">目前沒有資料</div>'}
function renderProjects(id,data){document.getElementById(id).innerHTML=data.length?data.map(p=>`<div class="item"><b>${esc(p.專案名稱||'未命名專案')}</b><div class="small">專案ID：${esc(p.專案ID||'')}<br>機關：${esc(p.機關名稱||'')}<br>履約：${esc(p.履約起日||'')} ～ ${esc(p.履約迄日||'')}</div></div>`).join(''):'<div class="item small">目前沒有專案資料</div>'}
function renderActivities(id,data){document.getElementById(id).innerHTML=data.length?data.map(a=>`<div class="item"><b>${esc(a.活動名稱||'未命名活動')}</b><div class="small">活動ID：${esc(a.活動ID||'')}<br>日期：${esc(a.活動日期||'')} ${esc(a.開始時間||'')}-${esc(a.結束時間||'')}<br>地點：${esc(a.活動地點||'')}</div></div>`).join(''):'<div class="item small">目前沒有活動資料</div>'}
function renderTasks(id,data){document.getElementById(id).innerHTML=data.length?data.map(t=>`<div class="item"><b>${esc(t.任務名稱||'未命名任務')}</b><div class="small">任務ID：${esc(t.任務ID||'')}<br>期限：${esc(t.預計完成日||'未設定')}<br>狀態：${esc(t.任務狀態||'未開始')}</div></div>`).join(''):'<div class="item small">目前沒有任務資料</div>'}
function updateSelects(){['activityProjectId'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='<option value="">請選擇專案</option>'+state.projects.map(p=>`<option value="${esc(p.專案ID)}">${esc(p.專案名稱||p.專案ID)}</option>`).join('')})}
</script>
</body>
</html>
