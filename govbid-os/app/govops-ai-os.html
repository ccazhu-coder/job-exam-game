<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps AI OS｜完整 SaaS 操作版</title><style>:root{--bg:#07111f;--panel:#0f1b2e;--card:#13243d;--line:#263852;--text:#e5edf8;--muted:#90a4bf;--blue:#38bdf8;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#172554 0,#07111f 38%,#050b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.loginCard,.panel{background:rgba(15,27,46,.96);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.32)}.loginCard{max-width:460px;width:100%}.app{display:grid;grid-template-columns:1fr;min-height:100vh}.side{display:none;background:rgba(15,27,46,.98);border-right:1px solid var(--line);padding:18px}.brand{font-size:22px;font-weight:950}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.nav{display:grid;gap:7px;margin-top:20px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:14px;padding:11px;text-align:left;font-weight:900}.nav button.active,.nav button:hover{background:#13243d;color:var(--text);border-color:var(--line)}.main{padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1,h2,h3{margin:0 0 10px}.sub,.small{color:var(--muted);font-size:13px;line-height:1.65}.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#1e3a8a;color:#bfdbfe;margin:3px}.tag.red{background:rgba(239,68,68,.18);color:#fecaca}.tag.yellow{background:rgba(245,158,11,.17);color:#fde68a}.tag.green{background:rgba(34,197,94,.16);color:#bbf7d0}.section{display:none}.section.show{display:block}.grid{display:grid;grid-template-columns:1fr;gap:12px}.grid2,.grid3{display:grid;grid-template-columns:1fr;gap:14px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:rgba(7,17,31,.58);border:1px solid var(--line);border-radius:18px;padding:13px;cursor:pointer}.kpi .label{color:var(--muted);font-size:12px;font-weight:900}.kpi .num{font-size:30px;font-weight:950}.kpi.red .num{color:var(--red)}.kpi.yellow .num{color:var(--yellow)}.kpi.green .num{color:var(--green)}.kpi.blue .num{color:var(--blue)}input,select,textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#081424;color:var(--text);font-size:15px}textarea{min-height:72px}label{display:block;color:var(--muted);font-size:12px;font-weight:950;margin:10px 0 6px}button{border:0;border-radius:14px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:950;font-size:14px;cursor:pointer}button.secondary{background:#1f2f49;color:var(--text);border:1px solid var(--line)}button.green{background:#16a34a}button.warn{background:#d97706}button.red{background:#dc2626}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.item{background:rgba(7,17,31,.48);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}.msg{white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.65}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.timebox{background:rgba(7,17,31,.48);border:1px solid var(--line);border-radius:16px;padding:10px}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{aspect-ratio:1;border-radius:12px;background:#13243d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:950;color:var(--muted)}.day.hot{background:rgba(239,68,68,.25);color:#fecaca}.day.mid{background:rgba(245,158,11,.22);color:#fde68a}.barRow{display:grid;grid-template-columns:90px 1fr 42px;gap:8px;align-items:center}.bar{height:10px;background:#1e293b;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green))}.mobile{position:fixed;left:0;right:0;bottom:0;background:rgba(15,27,46,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}.mobile button{font-size:12px;background:#13243d;padding:10px 4px}@media(min-width:1000px){.app{grid-template-columns:270px 1fr}.side{display:block;position:sticky;top:0;height:100vh}.main{padding:24px 28px 60px}.mobile{display:none}.grid{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1.2fr .8fr}.grid3{grid-template-columns:1fr 1fr 1fr}.kpis{grid-template-columns:repeat(4,1fr)}}</style></head><body><div id="loginView" class="login"><div class="loginCard"><h1>GovOps AI OS</h1><p class="sub">正式 SaaS 登入版。使用 companyCode、Email、密碼登入，前端只保存 Session Token。</p><label>GAS Web App API</label><input id="loginApi"><label>公司代碼</label><input id="loginCompany"><label>Email</label><input id="loginEmail"><label>密碼</label><input id="loginPassword" type="password"><div class="btns"><button class="green" onclick="login()">登入</button><button class="secondary" onclick="testPublicApi()">測試連線</button></div><div id="loginMsg" class="msg"></div></div></div><div id="appView" class="app hidden"><aside class="side"><div class="brand">GovOps AI OS<small>政府專案 AI 營運作業系統</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">戰情中心</h1><div id="tenantLine" class="sub">Session 初始化中</div></div><div><span id="runtimeStatus" class="pill">Runtime</span><button class="red" onclick="logout()">登出</button></div></div><section id="dashboard" class="section show"><div class="panel"><h2>今日戰情摘要</h2><div id="kpis" class="kpis"></div></div><div class="grid2"><div class="panel"><h2>今日最急 5 件事</h2><div id="topFive"></div></div><div class="panel"><h2>AI 建議</h2><div id="aiTips"></div></div></div><div class="grid3"><div class="panel"><h3>案件健康度</h3><div id="healthList"></div></div><div class="panel"><h3>營運熱區</h3><div id="heatMap" class="heat"></div></div><div class="panel"><h3>時間軸中心</h3><div id="timeline" class="timeline"></div></div></div><div class="grid2"><div class="panel"><h3>跨案衝突</h3><div id="conflicts"></div></div><div class="panel"><h3>工作負載</h3><div id="workload"></div></div></div></section><section id="projects" class="section"></section><section id="activities" class="section"></section><section id="tasks" class="section"></section><section id="registration" class="section"></section><section id="survey" class="section"></section><section id="finance" class="section"></section><section id="docs" class="section"></section><section id="line" class="section"></section><section id="settings" class="section"></section></main><nav class="mobile"><button onclick="showPage('dashboard')">戰情</button><button onclick="showPage('projects')">專案</button><button onclick="showPage('activities')">活動</button><button onclick="showPage('finance')">財務</button><button onclick="showPage('settings')">設定</button></nav></div><script>const modules=[['dashboard','戰情中心'],['projects','專案生命週期'],['activities','活動執行'],['tasks','任務檢核'],['registration','報名審核'],['survey','滿意度問卷'],['finance','財務核銷'],['docs','文件結案'],['line','LINE提醒'],['settings','系統設定']];const state={apiUrl:'',token:'',user:null,projects:[],activities:[],tasks:[],finance:[],docs:[],dashboard:null};window.addEventListener('load',boot);async function boot(){buildNav();buildModuleScreens();state.apiUrl=localStorage.getItem('GovOpsAI_API')||'';state.token=localStorage.getItem('GovOpsAI_TOKEN')||'';loginApi.value=state.apiUrl;if(!state.apiUrl||!state.token)return showLogin();try{await loadCurrentUser();showApp();await refreshAll()}catch(e){sessionExpired(e.message)}}function buildNav(){nav.innerHTML=modules.map((m,i)=>`<button class="${i===0?'active':''}" onclick="showPage('${m[0]}',this)">${m[1]}</button>`).join('')}function showLogin(){loginView.classList.remove('hidden');appView.classList.add('hidden')}function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden')}function saveApi(){state.apiUrl=loginApi.value.trim();localStorage.setItem('GovOpsAI_API',state.apiUrl)}async function testPublicApi(){try{saveApi();loginMsg.textContent='連線正常：'+JSON.stringify(await callPublic('健康檢查'))}catch(e){loginMsg.textContent='連線失敗：'+e.message}}async function login(){try{saveApi();loginMsg.textContent='登入中...';const r=await callPublic('login',{companyCode:loginCompany.value.trim(),email:loginEmail.value.trim(),password:loginPassword.value});state.token=r.token;localStorage.setItem('GovOpsAI_TOKEN',r.token);await loadCurrentUser();showApp();await refreshAll()}catch(e){loginMsg.textContent='登入失敗：'+e.message}}async function logout(){try{if(state.token)await callPublic('logout',{},{token:state.token})}catch(e){}localStorage.removeItem('GovOpsAI_TOKEN');state.token='';showLogin()}async function loadCurrentUser(){const r=await callApi('getCurrentUser',{},true);state.user=r;tenantLine.textContent=`${r.companyName||r.companyCode}｜${r.displayName||r.userId}｜${r.role}｜${r.plan||''}`;runtimeStatus.textContent='Session正常';return r}function sessionExpired(m){localStorage.removeItem('GovOpsAI_TOKEN');showLogin();loginMsg.textContent='Session 已失效，請重新登入。'+(m?'\n'+m:'')}async function callPublic(action,data={},extra={}){if(!state.apiUrl)throw new Error('尚未設定 API');const res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify(Object.assign({action,data},extra))});const j=await res.json();if(!j.success&&!j.成功)throw new Error(j.error||j.錯誤訊息||'API錯誤');return j.result||j.結果||j}async function callApi(action,data={},publicSession=false){if(!state.token&&!publicSession)throw new Error('尚未登入');const res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify({action,data,token:state.token})});const j=await res.json();if(!j.success&&!j.成功){const m=j.error||j.錯誤訊息||'API錯誤';if(m.includes('session')||m.includes('過期')||m.includes('登入'))sessionExpired(m);throw new Error(m)}return j.result||j.結果||j}async function refreshAll(){await loadDashboard();await listProjects();await listActivities();await listTasks();await listFinance();await listDocs();updateSelects()}async function loadDashboard(){try{const r=await callApi('取得Dashboard');state.dashboard=r;renderDashboard(r)}catch(e){aiTips.innerHTML=errItem(e)}}function renderDashboard(d){const s=d.摘要||{};kpis.innerHTML=[['高風險案件數',s.高風險案件數||0,'red','tasks'],['今日待辦數',(s.逾期任務數||0)+(s.今日活動數||0),'blue','tasks'],['逾期任務數',s.逾期任務數||0,'red','tasks'],['核銷缺件數',s.核銷缺件數||0,'yellow','finance'],['未請款金額',s.未完成請款數||0,'yellow','finance'],['未撥款金額',s.未完成請款數||0,'yellow','finance'],['本週活動數',countWeekActivities(),'green','activities'],['結案倒數案件',0,'blue','docs']].map(x=>`<div class="kpi ${x[2]}" onclick="showPage('${x[3]}')"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');topFive.innerHTML=makeTopFive(d);aiTips.innerHTML=renderTips(d.AI建議||[]);renderHealth();renderHeat();renderTimeline();conflicts.innerHTML=calcConflicts();workload.innerHTML=calcWorkload()}function makeTopFive(d){let arr=[];(d.高風險案件||[]).slice(0,2).forEach(x=>arr.push(['高風險',x.風險標題||'風險警示',x.風險說明||'請立即確認','查看']));(d.逾期任務||[]).slice(0,2).forEach(x=>arr.push(['逾期',x.任務名稱||'任務逾期','期限：'+(x.預計完成日||'未設定'),'處理']));(d.今日活動||[]).slice(0,1).forEach(x=>arr.push(['今日活動',x.活動名稱||'活動',x.活動地點||'未設定','查看']));while(arr.length<5)arr.push(['新手引導','請建立或同步資料','AI 會依資料產生任務、缺件與戰情','新增']);return arr.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x[1])}</b><span class="tag ${x[0]==='高風險'||x[0]==='逾期'?'red':'yellow'}">${x[0]}</span><div class="small">${esc(x[2])}</div><button class="secondary">${x[3]}</button></div>`).join('')}function renderTips(tips){return(tips.length?tips:['目前尚無高風險資料，請先建立專案或同步 Dashboard。']).map(x=>`<div class="item"><b>AI 建議</b><div class="small">${esc(x)}</div></div>`).join('')}function buildModuleScreens(){projects.innerHTML=moduleHtml('專案生命週期','project',[['專案名稱','projectName'],['機關名稱','agencyName'],['契約金額','contractAmount','number'],['履約起日','startDate','date'],['履約迄日','endDate','date']],['履約規格設定','核銷與結案規格設定','請款規則設定','專案健康度']);activities.innerHTML=moduleHtml('活動執行','activity',[['活動名稱','activityName'],['活動日期','activityDate','date'],['開始時間','activityStart','time'],['結束時間','activityEnd','time'],['活動地點','activityPlace'],['預計人數','expectedPeople','number']],['活動需求勾選','活動前任務','活動中任務','活動後任務','Google Calendar同步','活動異動同步']);tasks.innerHTML=moduleSimple('任務檢核','task',['任務清單','逾期任務','缺件任務','檢核表','批次更新狀態','負責人追蹤']);registration.innerHTML=moduleSimple('報名審核','registration',['線上報名連結設定','報名ID自動判讀','報名資料匯入','手動新增報名','報名去重','錄取／備取／不錄取','批次通知','自動產生簽到表','用餐統計','訂餐表']);survey.innerHTML=moduleSimple('滿意度問卷','survey',['滿意度連結設定','問卷ID自動判讀','問卷資料匯入','滿意度去重','滿意度分析','產生分析報告','結案報告摘要文字']);finance.innerHTML=moduleHtml('財務核銷','finance',[['金額','financeAmount','number'],['交易日期','financeDate','date'],['說明','financeDesc']],['收入管理','支出管理','發票管理','領據管理','請款規則','請款資料包','核銷缺件','撥款追蹤','對帳','未請款／未撥款']);docs.innerHTML=moduleHtml('文件結案','doc',[['文件名稱','docName'],['檔案連結','docUrl']],['文件索引','文件版本','簽到表上傳','成果照片上傳','領據附件','發票附件','結案報告 Word Generator','核銷附件清單','結案包產生']);line.innerHTML=moduleSimple('LINE提醒','line',['LINE Tenant Binding','使用者 LINE ID 綁定','今日戰情推播','高風險提醒','核銷缺件提醒','結案倒數提醒','LINE查詢指令','LINE快捷選單']);settings.innerHTML=moduleSimple('系統設定','settings',['公司資料','使用者管理','角色權限','API設定','Google Calendar設定','LINE設定','方案與用量'])}function moduleHtml(title,key,fields,features){return`<div class="panel"><h2>${title}</h2><div class="grid">${fields.map(f=>`<div><label>${f[0]}</label><input id="${f[1]}" type="${f[2]||'text'}"></div>`).join('')}</div><div class="btns"><button onclick="moduleAdd('${key}')">新增</button><button class="secondary" onclick="moduleQuery('${key}')">查詢</button><button class="warn" onclick="moduleUpdate('${key}')">修改</button><button class="green" onclick="moduleStatus('${key}')">狀態更新</button></div><div>${features.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div id="${key}Msg" class="msg"></div></div><div class="panel"><h3>${title}資料清單</h3><div id="${key}List"></div></div>`}function moduleSimple(title,key,features){return`<div class="panel"><h2>${title}</h2><div class="grid"><input id="${key}Keyword" placeholder="關鍵字／ID"><select id="${key}Status"><option>啟用</option><option>進行中</option><option>已完成</option><option>封存</option></select><textarea id="${key}Note" placeholder="新增或修改內容"></textarea></div><div class="btns"><button onclick="moduleAdd('${key}')">新增</button><button class="secondary" onclick="moduleQuery('${key}')">查詢</button><button class="warn" onclick="moduleUpdate('${key}')">修改</button><button class="green" onclick="moduleStatus('${key}')">狀態更新</button></div><div>${features.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div id="${key}Msg" class="msg"></div></div><div class="panel"><h3>${title}清單</h3><div id="${key}List"><div class="item"><b>新手引導</b><div class="small">請先新增資料或按查詢同步，系統會依資料產生後續操作。</div></div></div></div>`}async function moduleAdd(key){try{if(key==='project')return createProject();if(key==='activity')return createActivity();if(key==='finance')return createFinance();if(key==='doc')return createDoc();document.getElementById(key+'Msg').textContent='已建立前端操作區；後端 action 將於 Runtime 補齊後自動串接。'}catch(e){document.getElementById(key+'Msg').textContent=e.message}}function moduleQuery(key){if(key==='project')return listProjects();if(key==='activity')return listActivities();if(key==='task')return listTasks();if(key==='finance')return listFinance();if(key==='doc')return listDocs();document.getElementById(key+'List').innerHTML='<div class="item"><b>查詢結果</b><div class="small">目前此模組尚無資料，請新增或匯入。</div></div>'}function moduleUpdate(key){document.getElementById(key+'Msg').textContent='已進入修改模式：請選擇資料ID後更新。'}function moduleStatus(key){document.getElementById(key+'Msg').textContent='狀態更新已送出：正式後端將保留歷史紀錄，不直接刪除。'}async function listProjects(){try{const r=await callApi('查詢專案');state.projects=r.資料||[];projectList.innerHTML=renderCards(state.projects,'專案名稱','專案狀態');updateSelects()}catch(e){projectList.innerHTML=errItem(e)}}async function listActivities(){try{const r=await callApi('查詢活動');state.activities=r.資料||[];activityList.innerHTML=renderCards(state.activities,'活動名稱','活動日期');updateSelects()}catch(e){activityList.innerHTML=errItem(e)}}async function listTasks(){try{const r=await callApi('查詢任務');state.tasks=r.資料||[];taskList.innerHTML=renderCards(state.tasks,'任務名稱','預計完成日')}catch(e){taskList.innerHTML=errItem(e)}}async function listFinance(){try{const r=await callApi('查詢財務');state.finance=r.資料||[];financeList.innerHTML=renderCards(state.finance,'說明','金額')}catch(e){financeList.innerHTML=errItem(e)}}async function listDocs(){try{const r=await callApi('查詢文件');state.docs=r.資料||[];docList.innerHTML=renderCards(state.docs,'文件名稱','文件類型')}catch(e){docList.innerHTML=errItem(e)}}async function createProject(){try{await callApi('新增專案',{專案名稱:projectName.value,機關名稱:agencyName.value,契約金額:contractAmount.value,履約起日:startDate.value,履約迄日:endDate.value});await refreshAll();showPage('dashboard')}catch(e){projectMsg.textContent=e.message}}async function createActivity(){try{await callApi('新增活動',{專案ID:(state.projects[0]||{}).專案ID,活動名稱:activityName.value,活動日期:activityDate.value,開始時間:activityStart.value,結束時間:activityEnd.value,活動地點:activityPlace.value,預計人數:expectedPeople.value});await refreshAll();showPage('dashboard')}catch(e){activityMsg.textContent=e.message}}async function createFinance(){try{await callApi('新增財務',{專案ID:(state.projects[0]||{}).專案ID,金額:financeAmount.value,交易日期:financeDate.value,說明:financeDesc.value,類型:'支出'});await refreshAll()}catch(e){financeMsg.textContent=e.message}}async function createDoc(){try{await callApi('新增文件',{專案ID:(state.projects[0]||{}).專案ID,文件名稱:docName.value,檔案連結:docUrl.value,文件類型:'文件索引'});await refreshAll()}catch(e){docMsg.textContent=e.message}}function renderCards(data,titleKey,subKey){return data.length?data.map(x=>`<div class="item"><b>${esc(x[titleKey]||'未命名')}</b><span class="tag">${esc(x[subKey]||'')}</span><div class="small">${Object.keys(x).slice(0,5).map(k=>esc(k)+'：'+esc(x[k])).join('<br>')}</div></div>`).join(''):'<div class="item"><b>目前沒有資料</b><div class="small">請新增資料或匯入資料，這裡會自動更新。</div></div>'}function errItem(e){return`<div class="item"><b>載入失敗</b><div class="small">${esc(e.message)}</div></div>`}function updateSelects(){}function renderHealth(){healthList.innerHTML=(state.projects.length?state.projects:[{專案名稱:'尚無專案',健康分數:0}]).map(p=>{const s=Number(p.健康分數||85);return`<div class="barRow"><div class="small">${esc(p.專案名稱||'未命名')}</div><div class="bar"><i style="width:${Math.max(5,s)}%"></i></div><b>${s}</b></div>`}).join('')}function renderHeat(){let h='';for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=d.toISOString().slice(0,10);const c=state.activities.filter(a=>a.活動日期===ds).length+state.tasks.filter(t=>t.預計完成日===ds).length;h+=`<div class="day ${c>=4?'hot':c>=2?'mid':''}">${d.getDate()}</div>`}heatMap.innerHTML=h}function renderTimeline(){timeline.innerHTML=[['今日',0,0],['本週',1,7],['下週',8,14],['30天',1,30]].map(b=>`<div class="timebox"><b>${b[0]}</b><div class="num">${countRange(b[1],b[2])}</div><span class="tag green">正常</span></div>`).join('')}function countRange(a,b){return state.activities.filter(x=>days(x.活動日期)>=a&&days(x.活動日期)<=b).length+state.tasks.filter(x=>days(x.預計完成日)>=a&&days(x.預計完成日)<=b).length}function calcConflicts(){return'<div class="item"><b>跨案衝突掃描</b><div class="small">目前依日期偵測活動與任務壓力，後續可接講師／場地／人力衝突。</div></div>'}function calcWorkload(){return'<div class="item"><b>工作負載</b><div class="small">本週任務＋活動：'+countRange(0,7)+' 件</div></div>'}function days(ds){if(!ds)return 999;return Math.ceil((new Date(ds)-new Date(new Date().toISOString().slice(0,10)))/86400000)}function countWeekActivities(){return state.activities.filter(a=>days(a.活動日期)>=0&&days(a.活動日期)<=7).length}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</script></body></html>
