<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps AI OS｜AI SaaS 指揮中心</title><style>:root{--bg0:#0B1020;--bg1:#0F172A;--bg2:#111827;--card:#172033;--card2:#1E293B;--glass:rgba(17,24,39,.74);--line:rgba(255,255,255,.08);--line2:rgba(99,102,241,.35);--text:#E5EDF8;--muted:#94A3B8;--brand:#4F46E5;--brand2:#6366F1;--hover:#7C3AED;--cyan:#06B6D4;--ai:#8B5CF6;--red:#EF4444;--amber:#F59E0B;--green:#10B981;--blue:#3B82F6;--teal:#14B8A6;--orange:#F97316;--linegreen:#22C55E;--google:#60A5FA;--shadow:0 24px 80px rgba(0,0,0,.45);--glow:0 0 28px rgba(79,70,229,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;background:radial-gradient(circle at 18% 8%,rgba(79,70,229,.22),transparent 32%),radial-gradient(circle at 84% 16%,rgba(6,182,212,.16),transparent 30%),linear-gradient(135deg,#070B16 0%,#0B1020 42%,#111827 100%)}body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 75%);pointer-events:none}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.loginCard,.panel{position:relative;background:linear-gradient(180deg,rgba(17,24,39,.88),rgba(15,23,42,.82));border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.loginCard:before,.panel:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(99,102,241,.6),rgba(6,182,212,.18),rgba(255,255,255,.04));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.loginCard{max-width:980px;width:100%;display:grid;grid-template-columns:1fr;gap:18px}.loginHero{display:none;padding:26px;border-radius:24px;background:linear-gradient(135deg,rgba(79,70,229,.26),rgba(6,182,212,.16));border:1px solid rgba(255,255,255,.08);box-shadow:var(--glow)}.logoMark{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 32px rgba(6,182,212,.3)}h1,h2,h3{margin:0 0 10px}h1{font-size:44px;letter-spacing:-1.5px}.gradientText{background:linear-gradient(135deg,#fff,#A5B4FC,#67E8F9);-webkit-background-clip:text;color:transparent}.sub,.small{color:var(--muted);font-size:13px;line-height:1.7}.feature{display:flex;gap:10px;align-items:center;margin:12px 0;color:#cbd5e1}.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--cyan));box-shadow:0 0 16px rgba(6,182,212,.65)}label{display:block;color:#A8B6CC;font-size:12px;font-weight:950;margin:10px 0 6px}input,select,textarea{width:100%;padding:13px 14px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:rgba(8,20,36,.82);color:var(--text);font-size:15px;outline:none;transition:.22s}input:focus,select:focus,textarea:focus{border-color:rgba(99,102,241,.8);box-shadow:0 0 0 4px rgba(99,102,241,.12),0 0 18px rgba(99,102,241,.14)}input[type=checkbox]{width:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.tabs button{background:rgba(15,23,42,.72);color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;box-shadow:0 12px 36px rgba(79,70,229,.28)}button{border:0;border-radius:15px;padding:12px 16px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font-weight:950;font-size:14px;cursor:pointer;transition:.22s;box-shadow:0 10px 28px rgba(79,70,229,.18)}button:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(124,58,237,.28);filter:saturate(1.08)}button.secondary{background:rgba(30,41,59,.86);color:var(--text);border:1px solid var(--line);box-shadow:none}button.green{background:linear-gradient(135deg,var(--green),#22C55E)}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.msg{white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.65;margin-top:12px}.grid{display:grid;grid-template-columns:1fr;gap:12px}.app{display:grid;grid-template-columns:1fr;min-height:100vh}.side{display:none;background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(11,16,32,.96));border-right:1px solid var(--line);padding:20px;box-shadow:12px 0 38px rgba(0,0,0,.18)}.brand{font-size:22px;font-weight:950;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.brandIcon{display:inline-flex;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--cyan));align-items:center;justify-content:center;margin-right:8px;box-shadow:0 0 26px rgba(79,70,229,.35)}.nav{display:grid;gap:8px;margin-top:24px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;text-align:left;box-shadow:none;display:flex;gap:9px;align-items:center}.nav button.active,.nav button:hover{background:linear-gradient(135deg,rgba(79,70,229,.24),rgba(6,182,212,.08));color:var(--text);border-color:rgba(99,102,241,.32)}.navIcon{width:10px;height:10px;border-radius:999px;background:var(--brand2);box-shadow:0 0 14px currentColor}.main{padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:16px;border:1px solid var(--line);background:rgba(15,23,42,.58);border-radius:22px;backdrop-filter:blur(14px)}.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:rgba(59,130,246,.18);color:#BFDBFE;margin:3px;border:1px solid rgba(59,130,246,.22)}.section{display:none}.section.show{display:block}.section.show#dashboard:before{content:"AI 營運控制塔";display:block;margin-bottom:14px;padding:20px;border-radius:24px;border:1px solid rgba(99,102,241,.22);background:linear-gradient(135deg,rgba(79,70,229,.25),rgba(6,182,212,.15));box-shadow:0 0 40px rgba(79,70,229,.16);font-size:24px;font-weight:950;letter-spacing:-.5px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.kpi{position:relative;background:linear-gradient(180deg,rgba(30,41,59,.72),rgba(15,23,42,.76));border:1px solid var(--line);border-radius:20px;padding:14px;overflow:hidden;transition:.22s}.kpi:after{content:"";position:absolute;right:-24px;top:-28px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.24),transparent 62%)}.kpi:hover{transform:translateY(-3px);border-color:rgba(99,102,241,.46);box-shadow:0 0 28px rgba(99,102,241,.16)}.kpi:nth-child(1){box-shadow:0 0 24px rgba(239,68,68,.08)}.kpi:nth-child(3){box-shadow:0 0 24px rgba(245,158,11,.08)}.kpi:nth-child(4){box-shadow:0 0 24px rgba(20,184,166,.1)}.kpi:nth-child(6){box-shadow:0 0 24px rgba(59,130,246,.1)}.kpi .label{color:var(--muted);font-size:12px;font-weight:900}.kpi .num{font-size:32px;font-weight:950;background:linear-gradient(135deg,#fff,#93C5FD);-webkit-background-clip:text;color:transparent}.item{background:linear-gradient(180deg,rgba(15,23,42,.72),rgba(8,20,36,.78));border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;transition:.2s}.item:hover{border-color:rgba(139,92,246,.34);box-shadow:0 0 24px rgba(139,92,246,.1)}.panel h2:before,.panel h3:before{content:"✦";color:var(--ai);margin-right:8px;text-shadow:0 0 12px rgba(139,92,246,.75)}.mobile{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;backdrop-filter:blur(16px)}.mobile button{font-size:12px;background:rgba(30,41,59,.88);padding:10px 4px;box-shadow:none}.shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);background-size:220% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-220% 0}}@keyframes pulseGlow{0%,100%{box-shadow:0 0 22px rgba(139,92,246,.18)}50%{box-shadow:0 0 38px rgba(6,182,212,.24)}}#aiTips .item{animation:pulseGlow 3s infinite}@media(min-width:1000px){.loginCard{grid-template-columns:.85fr 1fr;padding:22px}.loginHero{display:block}.app{grid-template-columns:280px 1fr}.side{display:block;position:sticky;top:0;height:100vh}.main{padding:24px 30px 60px}.mobile{display:none}.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}} </style></head><body><div id="loginView" class="login"><div class="loginCard"><div class="loginHero"><div class="logoMark">✦</div><h1 class="gradientText">GovOps AI OS</h1><p class="sub">AI 政府專案營運控制塔，整合戰情、履約、核銷、請款與結案風險。</p><div class="feature"><span class="dot"></span><span>AI 戰情中心與風險預警</span></div><div class="feature"><span class="dot"></span><span>多租戶 SaaS 資料隔離</span></div><div class="feature"><span class="dot"></span><span>政府專案全生命週期管理</span></div></div><div><h1>GovOps AI OS</h1><p class="sub">新公司可先註冊，系統會自動產生公司代碼並直接進入系統。</p><div class="tabs"><button id="loginTab" class="active" onclick="switchAuth('login')">登入</button><button id="registerTab" onclick="switchAuth('register')">註冊新公司</button></div><div id="loginPanel"><label>公司代碼</label><input id="loginCompany" placeholder="註冊成功後系統會自動填入"><label>Email</label><input id="loginEmail"><label>密碼</label><input id="loginPassword" type="password"><div class="btns"><button class="green" onclick="login()">登入</button><button class="secondary" onclick="testPublicApi()">測試系統連線</button></div></div><div id="registerPanel" class="hidden"><div class="grid"><div><label>公司／單位名稱</label><input id="regCompanyName" placeholder="例如：知己知途"></div><div><label>負責人姓名</label><input id="regDisplayName"></div><div><label>Email</label><input id="regEmail"></div><div><label>電話</label><input id="regPhone"></div><div><label>方案</label><select id="regPlan"><option>FREE</option><option>TRIAL</option></select></div><div><label>密碼</label><input id="regPassword" type="password"></div><div><label>確認密碼</label><input id="regConfirmPassword" type="password"></div></div><label><input id="regAgree" type="checkbox"> 我同意服務條款與資料使用規範</label><div class="small">公司代碼由系統自動產生，若重複會自動加數字重試。</div><div class="btns"><button id="registerBtn" class="green" onclick="registerTenant()">建立公司帳號</button><button class="secondary" onclick="switchAuth('login')">已有帳號登入</button></div></div><div id="loginMsg" class="msg"></div></div></div></div><div id="appView" class="app hidden"><aside class="side"><div class="brand"><span class="brandIcon">✦</span>GovOps AI OS<small>政府專案 AI 營運作業系統</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">戰情中心</h1><div id="tenantLine" class="sub">Session 初始化中</div></div><div><span id="runtimeStatus" class="pill">AI Runtime</span><button class="secondary" onclick="logout()">登出</button></div></div><section id="dashboard" class="section show"><div class="panel"><h2>今日戰情摘要</h2><div id="kpis" class="kpis"></div></div><div class="panel"><h2>今日最急 5 件事</h2><div id="topFive"></div></div><div class="panel"><h2>AI 建議</h2><div id="aiTips"></div></div></section><section id="projects" class="section"></section><section id="activities" class="section"></section><section id="tasks" class="section"></section><section id="finance" class="section"></section><section id="settings" class="section"></section></main><nav class="mobile"><button onclick="showPage('dashboard')">戰情</button><button onclick="showPage('projects')">專案</button><button onclick="showPage('activities')">活動</button><button onclick="showPage('finance')">財務</button><button onclick="showPage('settings')">設定</button></nav></div><script>const GOVOPS_API_URL='https://script.google.com/macros/s/AKfycbzOCj5JyioBnk6KBdoWyPIxIEQc1ZXHt0Inh4_OYdIWbQCBeUjnL_w1BUL2K3gIaCt7/exec';const modules=[['dashboard','戰情中心'],['projects','專案生命週期'],['activities','活動執行'],['tasks','任務檢核'],['finance','財務核銷'],['settings','系統設定']];const state={apiUrl:GOVOPS_API_URL,token:'',user:null,projects:[],activities:[],tasks:[],finance:[]};window.addEventListener('load',boot);async function boot(){localStorage.setItem('GovOpsAI_API',GOVOPS_API_URL);buildNav();buildModuleScreens();state.token=localStorage.getItem('GovOpsAI_TOKEN')||'';if(!state.token)return showLogin();try{await loadCurrentUser();showApp();await refreshAll()}catch(e){sessionExpired(e.message)}}function switchAuth(mode){loginTab.classList.toggle('active',mode==='login');registerTab.classList.toggle('active',mode==='register');loginPanel.classList.toggle('hidden',mode!=='login');registerPanel.classList.toggle('hidden',mode!=='register');loginMsg.textContent=''}function buildNav(){nav.innerHTML=modules.map((m,i)=>`<button class="${i===0?'active':''}" onclick="showPage('${m[0]}',this)"><span class="navIcon"></span>${m[1]}</button>`).join('')}function showLogin(){loginView.classList.remove('hidden');appView.classList.add('hidden')}function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden')}async function testPublicApi(){try{loginMsg.textContent='連線正常：'+JSON.stringify(await callPublic('健康檢查'))}catch(e){loginMsg.textContent='連線失敗：'+friendly(e.message)}}async function login(){try{loginMsg.textContent='登入中...';const r=await callPublic('login',{companyCode:loginCompany.value.trim(),email:loginEmail.value.trim(),password:loginPassword.value});await acceptLoginResult(r);await loadCurrentUser();showApp();await refreshAll()}catch(e){loginMsg.textContent='登入失敗：'+friendly(e.message)}}async function registerTenant(){try{if(!regCompanyName.value.trim())throw new Error('請填公司／單位名稱');if(!regDisplayName.value.trim())throw new Error('請填負責人姓名');if(!regEmail.value.trim())throw new Error('請填 Email');if(regPassword.value.length<6)throw new Error('密碼至少 6 碼');if(regPassword.value!==regConfirmPassword.value)throw new Error('密碼不一致');if(!regAgree.checked)throw new Error('請先勾選同意服務條款');registerBtn.disabled=true;registerBtn.textContent='建立中...';let base=makeCompanyCode(regCompanyName.value,regEmail.value);let lastErr='';for(let i=0;i<3;i++){let code=i===0?base:base+(Math.floor(Math.random()*900)+100);try{const payload={companyName:regCompanyName.value.trim(),companyCode:code,displayName:regDisplayName.value.trim(),email:regEmail.value.trim(),phone:regPhone.value.trim(),password:regPassword.value,plan:regPlan.value};const r=await callPublic('registerTenant',payload);const token=extractToken(r);if(!token)throw new Error('REGISTER_NO_TOKEN');loginCompany.value=code;loginEmail.value=payload.email;loginPassword.value=payload.password;loginMsg.textContent='註冊成功，正在進入系統...';saveSessionFromAuth(r,token,code,payload);await loadCurrentUser();showApp();await refreshAll();return}catch(err){lastErr=err.message;if(String(err.message)==='REGISTER_NO_TOKEN')throw err;if(!String(err.message).includes('公司代碼'))throw err;}}throw new Error(lastErr||'公司代碼重複，系統重試後仍失敗，請稍後再試');}catch(e){loginMsg.textContent='註冊失敗：'+friendly(e.message)}finally{registerBtn.disabled=false;registerBtn.textContent='建立公司帳號'}}function extractToken(r){return r&&(r.token||r.sessionToken||(r.data&&(r.data.token||r.data.sessionToken))||(r.result&&(r.result.token||r.result.sessionToken))||(r.結果&&(r.結果.token||r.結果.sessionToken)))}function saveSessionFromAuth(r,token,code,payload){state.token=token;localStorage.setItem('GovOpsAI_TOKEN',token);localStorage.setItem('GovOpsAI_companyCode',r.companyCode||code);localStorage.setItem('GovOpsAI_tenantId',r.tenantId||'');localStorage.setItem('GovOpsAI_email',r.email||payload.email||'');localStorage.setItem('GovOpsAI_companyName',r.companyName||payload.companyName||'');localStorage.setItem('GovOpsAI_plan',r.plan||payload.plan||'');localStorage.setItem('GovOpsAI_role',r.role||'老闆')}async function acceptLoginResult(r){const token=extractToken(r);if(!token)throw new Error('LOGIN_NO_TOKEN');state.token=token;localStorage.setItem('GovOpsAI_TOKEN',token);localStorage.setItem('GovOpsAI_companyCode',r.companyCode||loginCompany.value.trim());localStorage.setItem('GovOpsAI_tenantId',r.tenantId||'');localStorage.setItem('GovOpsAI_email',r.email||loginEmail.value.trim()||'');localStorage.setItem('GovOpsAI_companyName',r.companyName||'');localStorage.setItem('GovOpsAI_plan',r.plan||'');localStorage.setItem('GovOpsAI_role',r.role||'')}function makeCompanyCode(name,email){const prefix=(email||'company').split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10);return prefix||('company'+Date.now().toString().slice(-6))}async function logout(){try{if(state.token)await callPublic('logout',{},{token:state.token})}catch(e){}localStorage.removeItem('GovOpsAI_TOKEN');state.token='';showLogin()}async function loadCurrentUser(){const r=await callApi('getCurrentUser',{},true);state.user=r;tenantLine.textContent=`${r.companyName||r.companyCode}｜${r.displayName||r.userId}｜${r.role}｜${r.plan||''}`;runtimeStatus.textContent='Session正常';return r}function sessionExpired(m){localStorage.removeItem('GovOpsAI_TOKEN');state.token='';showLogin();loginMsg.textContent='Session 已失效，請重新登入。'+(m?'\n'+friendly(m):'')}async function callPublic(action,data={},extra={}){let res;try{res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify(Object.assign({action,data},extra))})}catch(e){throw new Error('目前無法連線到系統後端，請確認 Apps Script 已部署為任何人可存取。')}const j=await res.json();if(!j.success&&!j.成功)throw new Error(j.error||j.錯誤訊息||'API錯誤');return j.result||j.結果||j}async function callApi(action,data={},allowNoToken=false){if(!state.token&&!allowNoToken)throw new Error('尚未登入');const res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify({action,data,token:state.token})});const j=await res.json();if(!j.success&&!j.成功){const m=j.error||j.錯誤訊息||'API錯誤';if(m.includes('session')||m.includes('過期'))sessionExpired(m);throw new Error(m)}return j.result||j.結果||j}function friendly(m){if(m==='REGISTER_NO_TOKEN')return'後端已建立帳號，但沒有回傳登入憑證。請將新版 GAS registerTenant 貼上並重新部署。';if(m==='LOGIN_NO_TOKEN')return'登入成功資料不完整：後端沒有回傳 token，請重新部署最新版 GAS。';if(m.includes('尚未登入或缺少 session token'))return'尚未取得登入憑證，請重新整理後再註冊一次。';if(m.includes('Failed to fetch'))return'目前無法連線到系統後端，請確認 Apps Script 已部署為任何人可存取。';if(m.includes('找不到指定的動作')||m.includes('registerTenant'))return'後端註冊功能尚未部署，請更新 Apps Script 程式碼並重新部署 Web App。';return m}async function refreshAll(){await loadDashboard();await listProjects();await listActivities();await listTasks();await listFinance()}async function loadDashboard(){try{const r=await callApi('取得Dashboard');renderDashboard(r)}catch(e){aiTips.innerHTML=errItem(e)}}function renderDashboard(d){const s=d.摘要||d.summary||{};kpis.innerHTML=[['高風險案件數',s.高風險案件數||0],['今日待辦數',(s.逾期任務數||0)+(s.今日活動數||0)],['逾期任務數',s.逾期任務數||0],['核銷缺件數',s.核銷缺件數||0],['未請款',s.未完成請款數||0],['本週活動數',s.本週活動數||0]].map(x=>`<div class="kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');topFive.innerHTML=makeTopFive(d);aiTips.innerHTML=renderTips(d.AI建議||d.aiSuggestions||[])}function makeTopFive(d){let arr=[];(d.高風險案件||d.highRiskItems||[]).slice(0,2).forEach(x=>arr.push(['高風險',x.風險標題||x.title||'風險警示',x.風險說明||x.description||'請立即確認']));(d.逾期任務||[]).slice(0,2).forEach(x=>arr.push(['逾期',x.任務名稱||'任務逾期','期限：'+(x.預計完成日||'未設定')]));while(arr.length<5)arr.push(['新手引導','請建立或同步資料','AI 會依資料產生任務、缺件與戰情']);return arr.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x[1])}</b><span class="tag">${x[0]}</span><div class="small">${esc(x[2])}</div></div>`).join('')}function renderTips(tips){return(tips.length?tips:['目前尚無高風險資料，請先建立專案或同步 Dashboard。']).map(x=>`<div class="item"><b>AI 建議</b><div class="small">${esc(x)}</div></div>`).join('')}function buildModuleScreens(){projects.innerHTML=moduleHtml('專案生命週期','project',[['專案名稱','projectName'],['機關名稱','agencyName'],['契約金額','contractAmount','number'],['履約起日','startDate','date'],['履約迄日','endDate','date']]);activities.innerHTML=moduleHtml('活動執行','activity',[['活動名稱','activityName'],['活動日期','activityDate','date'],['開始時間','activityStart','time'],['結束時間','activityEnd','time'],['活動地點','activityPlace']]);tasks.innerHTML=moduleSimple('任務檢核','task');finance.innerHTML=moduleHtml('財務核銷','finance',[['金額','financeAmount','number'],['交易日期','financeDate','date'],['說明','financeDesc']]);settings.innerHTML=moduleSimple('系統設定','settings')}function moduleHtml(title,key,fields){return`<div class="panel"><h2>${title}</h2><div class="grid">${fields.map(f=>`<div><label>${f[0]}</label><input id="${f[1]}" type="${f[2]||'text'}"></div>`).join('')}</div><div class="btns"><button onclick="moduleAdd('${key}')">新增</button><button class="secondary" onclick="moduleQuery('${key}')">查詢</button></div><div id="${key}Msg" class="msg"></div></div><div class="panel"><h3>${title}清單</h3><div id="${key}List"></div></div>`}function moduleSimple(title,key){return`<div class="panel"><h2>${title}</h2><div id="${key}List"><div class="item"><b>新手引導</b><div class="small">請先新增資料或按查詢同步。</div></div></div></div>`}async function moduleAdd(key){if(key==='project')return createProject();if(key==='activity')return createActivity();if(key==='finance')return createFinance()}function moduleQuery(key){if(key==='project')return listProjects();if(key==='activity')return listActivities();if(key==='task')return listTasks();if(key==='finance')return listFinance()}async function listProjects(){try{const r=await callApi('查詢專案');state.projects=r.資料||[];projectList.innerHTML=renderCards(state.projects,'專案名稱','專案狀態')}catch(e){projectList.innerHTML=errItem(e)}}async function listActivities(){try{const r=await callApi('查詢活動');state.activities=r.資料||[];activityList.innerHTML=renderCards(state.activities,'活動名稱','活動日期')}catch(e){activityList.innerHTML=errItem(e)}}async function listTasks(){try{const r=await callApi('查詢任務');state.tasks=r.資料||[];taskList.innerHTML=renderCards(state.tasks,'任務名稱','預計完成日')}catch(e){taskList.innerHTML=errItem(e)}}async function listFinance(){try{const r=await callApi('查詢財務');state.finance=r.資料||[];financeList.innerHTML=renderCards(state.finance,'說明','金額')}catch(e){financeList.innerHTML=errItem(e)}}async function createProject(){try{await callApi('新增專案',{專案名稱:projectName.value,機關名稱:agencyName.value,契約金額:contractAmount.value,履約起日:startDate.value,履約迄日:endDate.value});await refreshAll();showPage('dashboard')}catch(e){projectMsg.textContent=e.message}}async function createActivity(){try{await callApi('新增活動',{專案ID:(state.projects[0]||{}).專案ID,活動名稱:activityName.value,活動日期:activityDate.value,開始時間:activityStart.value,結束時間:activityEnd.value,活動地點:activityPlace.value});await refreshAll();showPage('dashboard')}catch(e){activityMsg.textContent=e.message}}async function createFinance(){try{await callApi('新增財務',{專案ID:(state.projects[0]||{}).專案ID,金額:financeAmount.value,交易日期:financeDate.value,說明:financeDesc.value,類型:'支出'});await refreshAll()}catch(e){financeMsg.textContent=e.message}}function renderCards(data,titleKey,subKey){return data.length?data.map(x=>`<div class="item"><b>${esc(x[titleKey]||'未命名')}</b><span class="tag">${esc(x[subKey]||'')}</span><div class="small">${Object.keys(x).slice(0,5).map(k=>esc(k)+'：'+esc(x[k])).join('<br>')}</div></div>`).join(''):'<div class="item"><b>目前沒有資料</b><div class="small">請新增資料，這裡會自動更新。</div></div>'}function errItem(e){return`<div class="item"><b>載入失敗</b><div class="small">${esc(e.message)}</div></div>`}function showPage(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');pageTitle.textContent=(modules.find(m=>m[0]===id)||[])[1]||'GovOps AI OS'}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</script></body></html>
