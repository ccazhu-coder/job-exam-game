<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps AI OS｜SaaS 註冊登入版</title><style>:root{--panel:#0f1b2e;--line:#263852;--text:#e5edf8;--muted:#90a4bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#172554 0,#07111f 38%,#050b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.loginCard,.panel{background:rgba(15,27,46,.96);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.32)}.loginCard{max-width:520px;width:100%}h1,h2,h3{margin:0 0 10px}.sub,.small{color:var(--muted);font-size:13px;line-height:1.65}label{display:block;color:var(--muted);font-size:12px;font-weight:950;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#081424;color:var(--text);font-size:15px}input[type=checkbox]{width:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.tabs button{background:#101f35;color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:#2563eb;color:#fff}button{border:0;border-radius:14px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:950;font-size:14px;cursor:pointer}button.secondary{background:#1f2f49;color:var(--text);border:1px solid var(--line)}button.green{background:#16a34a}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.msg{white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr;gap:12px}.app{display:grid;grid-template-columns:1fr;min-height:100vh}.side{display:none;background:rgba(15,27,46,.98);border-right:1px solid var(--line);padding:18px}.brand{font-size:22px;font-weight:950}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.nav{display:grid;gap:7px;margin-top:20px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;text-align:left}.nav button.active,.nav button:hover{background:#13243d;color:var(--text);border-color:var(--line)}.main{padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#1e3a8a;color:#bfdbfe;margin:3px}.section{display:none}.section.show{display:block}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:rgba(7,17,31,.58);border:1px solid var(--line);border-radius:18px;padding:13px}.kpi .label{color:var(--muted);font-size:12px;font-weight:900}.kpi .num{font-size:30px;font-weight:950}.item{background:rgba(7,17,31,.48);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}.mobile{position:fixed;left:0;right:0;bottom:0;background:rgba(15,27,46,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}.mobile button{font-size:12px;background:#13243d;padding:10px 4px}@media(min-width:1000px){.app{grid-template-columns:270px 1fr}.side{display:block;position:sticky;top:0;height:100vh}.main{padding:24px 28px 60px}.mobile{display:none}.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}} </style></head><body><div id="loginView" class="login"><div class="loginCard"><h1>GovOps AI OS</h1><p class="sub">新公司可先註冊，系統會自動產生公司代碼並直接進入系統。</p><div class="tabs"><button id="loginTab" class="active" onclick="switchAuth('login')">登入</button><button id="registerTab" onclick="switchAuth('register')">註冊新公司</button></div><div id="loginPanel"><label>公司代碼</label><input id="loginCompany" placeholder="註冊成功後系統會自動填入"><label>Email</label><input id="loginEmail"><label>密碼</label><input id="loginPassword" type="password"><div class="btns"><button class="green" onclick="login()">登入</button><button class="secondary" onclick="testPublicApi()">測試系統連線</button></div></div><div id="registerPanel" class="hidden"><div class="grid"><div><label>公司／單位名稱</label><input id="regCompanyName" placeholder="例如：知己知途"></div><div><label>負責人姓名</label><input id="regDisplayName"></div><div><label>Email</label><input id="regEmail"></div><div><label>電話</label><input id="regPhone"></div><div><label>方案</label><select id="regPlan"><option>FREE</option><option>TRIAL</option></select></div><div><label>密碼</label><input id="regPassword" type="password"></div><div><label>確認密碼</label><input id="regConfirmPassword" type="password"></div></div><label><input id="regAgree" type="checkbox"> 我同意服務條款與資料使用規範</label><div class="small">公司代碼由系統自動產生，若重複會自動加數字重試。</div><div class="btns"><button id="registerBtn" class="green" onclick="registerTenant()">建立公司帳號</button><button class="secondary" onclick="switchAuth('login')">已有帳號登入</button></div></div><div id="loginMsg" class="msg"></div></div></div><div id="appView" class="app hidden"><aside class="side"><div class="brand">GovOps AI OS<small>政府專案 AI 營運作業系統</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">戰情中心</h1><div id="tenantLine" class="sub">Session 初始化中</div></div><div><span id="runtimeStatus" class="pill">Runtime</span><button class="secondary" onclick="logout()">登出</button></div></div><section id="dashboard" class="section show"><div class="panel"><h2>今日戰情摘要</h2><div id="kpis" class="kpis"></div></div><div class="panel"><h2>今日最急 5 件事</h2><div id="topFive"></div></div><div class="panel"><h2>AI 建議</h2><div id="aiTips"></div></div></section><section id="projects" class="section"></section><section id="activities" class="section"></section><section id="tasks" class="section"></section><section id="finance" class="section"></section><section id="settings" class="section"></section></main><nav class="mobile"><button onclick="showPage('dashboard')">戰情</button><button onclick="showPage('projects')">專案</button><button onclick="showPage('activities')">活動</button><button onclick="showPage('finance')">財務</button><button onclick="showPage('settings')">設定</button></nav></div><script>const GOVOPS_API_URL='https://script.google.com/macros/s/AKfycbzOCj5JyioBnk6KBdoWyPIxIEQc1ZXHt0Inh4_OYdIWbQCBeUjnL_w1BUL2K3gIaCt7/exec';const modules=[['dashboard','戰情中心'],['projects','專案生命週期'],['activities','活動執行'],['tasks','任務檢核'],['finance','財務核銷'],['settings','系統設定']];const state={apiUrl:GOVOPS_API_URL,token:'',user:null,projects:[],activities:[],tasks:[],finance:[]};window.addEventListener('load',boot);async function boot(){localStorage.setItem('GovOpsAI_API',GOVOPS_API_URL);buildNav();buildModuleScreens();state.token=localStorage.getItem('GovOpsAI_TOKEN')||'';if(!state.token)return showLogin();try{await loadCurrentUser();showApp();await refreshAll()}catch(e){sessionExpired(e.message)}}function switchAuth(mode){loginTab.classList.toggle('active',mode==='login');registerTab.classList.toggle('active',mode==='register');loginPanel.classList.toggle('hidden',mode!=='login');registerPanel.classList.toggle('hidden',mode!=='register');loginMsg.textContent=''}function buildNav(){nav.innerHTML=modules.map((m,i)=>`<button class="${i===0?'active':''}" onclick="showPage('${m[0]}',this)">${m[1]}</button>`).join('')}function showLogin(){loginView.classList.remove('hidden');appView.classList.add('hidden')}function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden')}async function testPublicApi(){try{loginMsg.textContent='連線正常：'+JSON.stringify(await callPublic('健康檢查'))}catch(e){loginMsg.textContent='連線失敗：'+friendly(e.message)}}async function login(){try{loginMsg.textContent='登入中...';const r=await callPublic('login',{companyCode:loginCompany.value.trim(),email:loginEmail.value.trim(),password:loginPassword.value});await acceptLoginResult(r);await loadCurrentUser();showApp();await refreshAll()}catch(e){loginMsg.textContent='登入失敗：'+friendly(e.message)}}async function registerTenant(){try{if(!regCompanyName.value.trim())throw new Error('請填公司／單位名稱');if(!regDisplayName.value.trim())throw new Error('請填負責人姓名');if(!regEmail.value.trim())throw new Error('請填 Email');if(regPassword.value.length<6)throw new Error('密碼至少 6 碼');if(regPassword.value!==regConfirmPassword.value)throw new Error('密碼不一致');if(!regAgree.checked)throw new Error('請先勾選同意服務條款');registerBtn.disabled=true;registerBtn.textContent='建立中...';let base=makeCompanyCode(regCompanyName.value,regEmail.value);let lastErr='';for(let i=0;i<3;i++){let code=i===0?base:base+(Math.floor(Math.random()*900)+100);try{const payload={companyName:regCompanyName.value.trim(),companyCode:code,displayName:regDisplayName.value.trim(),email:regEmail.value.trim(),phone:regPhone.value.trim(),password:regPassword.value,plan:regPlan.value};const r=await callPublic('registerTenant',payload);const token=extractToken(r);if(!token)throw new Error('REGISTER_NO_TOKEN');loginCompany.value=code;loginEmail.value=payload.email;loginPassword.value=payload.password;loginMsg.textContent='註冊成功，正在進入系統...';saveSessionFromAuth(r,token,code,payload);await loadCurrentUser();showApp();await refreshAll();return}catch(err){lastErr=err.message;if(String(err.message)==='REGISTER_NO_TOKEN')throw err;if(!String(err.message).includes('公司代碼'))throw err;}}throw new Error(lastErr||'公司代碼重複，系統重試後仍失敗，請稍後再試');}catch(e){loginMsg.textContent='註冊失敗：'+friendly(e.message)}finally{registerBtn.disabled=false;registerBtn.textContent='建立公司帳號'}}function extractToken(r){return r&&(r.token||r.sessionToken||(r.data&&(r.data.token||r.data.sessionToken))||(r.result&&(r.result.token||r.result.sessionToken))||(r.結果&&(r.結果.token||r.結果.sessionToken)))}function saveSessionFromAuth(r,token,code,payload){state.token=token;localStorage.setItem('GovOpsAI_TOKEN',token);localStorage.setItem('GovOpsAI_companyCode',r.companyCode||code);localStorage.setItem('GovOpsAI_tenantId',r.tenantId||'');localStorage.setItem('GovOpsAI_email',r.email||payload.email||'');localStorage.setItem('GovOpsAI_companyName',r.companyName||payload.companyName||'');localStorage.setItem('GovOpsAI_plan',r.plan||payload.plan||'');localStorage.setItem('GovOpsAI_role',r.role||'老闆')}async function acceptLoginResult(r){const token=extractToken(r);if(!token)throw new Error('LOGIN_NO_TOKEN');state.token=token;localStorage.setItem('GovOpsAI_TOKEN',token);localStorage.setItem('GovOpsAI_companyCode',r.companyCode||loginCompany.value.trim());localStorage.setItem('GovOpsAI_tenantId',r.tenantId||'');localStorage.setItem('GovOpsAI_email',r.email||loginEmail.value.trim()||'');localStorage.setItem('GovOpsAI_companyName',r.companyName||'');localStorage.setItem('GovOpsAI_plan',r.plan||'');localStorage.setItem('GovOpsAI_role',r.role||'')}function makeCompanyCode(name,email){const prefix=(email||'company').split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10);return prefix||('company'+Date.now().toString().slice(-6))}async function logout(){try{if(state.token)await callPublic('logout',{},{token:state.token})}catch(e){}localStorage.removeItem('GovOpsAI_TOKEN');state.token='';showLogin()}async function loadCurrentUser(){const r=await callApi('getCurrentUser',{},true);state.user=r;tenantLine.textContent=`${r.companyName||r.companyCode}｜${r.displayName||r.userId}｜${r.role}｜${r.plan||''}`;runtimeStatus.textContent='Session正常';return r}function sessionExpired(m){localStorage.removeItem('GovOpsAI_TOKEN');state.token='';showLogin();loginMsg.textContent='Session 已失效，請重新登入。'+(m?'\n'+friendly(m):'')}async function callPublic(action,data={},extra={}){let res;try{res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify(Object.assign({action,data},extra))})}catch(e){throw new Error('目前無法連線到系統後端，請確認 Apps Script 已部署為任何人可存取。')}const j=await res.json();if(!j.success&&!j.成功)throw new Error(j.error||j.錯誤訊息||'API錯誤');return j.result||j.結果||j}async function callApi(action,data={},allowNoToken=false){if(!state.token&&!allowNoToken)throw new Error('尚未登入');const res=await fetch(state.apiUrl,{method:'POST',body:JSON.stringify({action,data,token:state.token})});const j=await res.json();if(!j.success&&!j.成功){const m=j.error||j.錯誤訊息||'API錯誤';if(m.includes('session')||m.includes('過期'))sessionExpired(m);throw new Error(m)}return j.result||j.結果||j}function friendly(m){if(m==='REGISTER_NO_TOKEN')return'後端已建立帳號，但沒有回傳登入憑證。請將新版 GAS registerTenant 貼上並重新部署。';if(m==='LOGIN_NO_TOKEN')return'登入成功資料不完整：後端沒有回傳 token，請重新部署最新版 GAS。';if(m.includes('尚未登入或缺少 session token'))return'尚未取得登入憑證，請重新整理後再註冊一次。';if(m.includes('Failed to fetch'))return'目前無法連線到系統後端，請確認 Apps Script 已部署為任何人可存取。';if(m.includes('找不到指定的動作')||m.includes('registerTenant'))return'後端註冊功能尚未部署，請更新 Apps Script 程式碼並重新部署 Web App。';return m}async function refreshAll(){await loadDashboard();await listProjects();await listActivities();await listTasks();await listFinance()}async function loadDashboard(){try{const r=await callApi('取得Dashboard');renderDashboard(r)}catch(e){aiTips.innerHTML=errItem(e)}}function renderDashboard(d){const s=d.摘要||d.summary||{};kpis.innerHTML=[['高風險案件數',s.高風險案件數||0],['今日待辦數',(s.逾期任務數||0)+(s.今日活動數||0)],['逾期任務數',s.逾期任務數||0],['核銷缺件數',s.核銷缺件數||0],['未請款',s.未完成請款數||0],['本週活動數',s.本週活動數||0]].map(x=>`<div class="kpi"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');topFive.innerHTML=makeTopFive(d);aiTips.innerHTML=renderTips(d.AI建議||d.aiSuggestions||[])}function makeTopFive(d){let arr=[];(d.高風險案件||d.highRiskItems||[]).slice(0,2).forEach(x=>arr.push(['高風險',x.風險標題||x.title||'風險警示',x.風險說明||x.description||'請立即確認']));(d.逾期任務||[]).slice(0,2).forEach(x=>arr.push(['逾期',x.任務名稱||'任務逾期','期限：'+(x.預計完成日||'未設定')]));while(arr.length<5)arr.push(['新手引導','請建立或同步資料','AI 會依資料產生任務、缺件與戰情']);return arr.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x[1])}</b><span class="tag">${x[0]}</span><div class="small">${esc(x[2])}</div></div>`).join('')}function renderTips(tips){return(tips.length?tips:['目前尚無高風險資料，請先建立專案或同步 Dashboard。']).map(x=>`<div class="item"><b>AI 建議</b><div class="small">${esc(x)}</div></div>`).join('')}function buildModuleScreens(){projects.innerHTML=moduleHtml('專案生命週期','project',[['專案名稱','projectName'],['機關名稱','agencyName'],['契約金額','contractAmount','number'],['履約起日','startDate','date'],['履約迄日','endDate','date']]);activities.innerHTML=moduleHtml('活動執行','activity',[['活動名稱','activityName'],['活動日期','activityDate','date'],['開始時間','activityStart','time'],['結束時間','activityEnd','time'],['活動地點','activityPlace']]);tasks.innerHTML=moduleSimple('任務檢核','task');finance.innerHTML=moduleHtml('財務核銷','finance',[['金額','financeAmount','number'],['交易日期','financeDate','date'],['說明','financeDesc']]);settings.innerHTML=moduleSimple('系統設定','settings')}function moduleHtml(title,key,fields){return`<div class="panel"><h2>${title}</h2><div class="grid">${fields.map(f=>`<div><label>${f[0]}</label><input id="${f[1]}" type="${f[2]||'text'}"></div>`).join('')}</div><div class="btns"><button onclick="moduleAdd('${key}')">新增</button><button class="secondary" onclick="moduleQuery('${key}')">查詢</button></div><div id="${key}Msg" class="msg"></div></div><div class="panel"><h3>${title}清單</h3><div id="${key}List"></div></div>`}function moduleSimple(title,key){return`<div class="panel"><h2>${title}</h2><div id="${key}List"><div class="item"><b>新手引導</b><div class="small">請先新增資料或按查詢同步。</div></div></div></div>`}async function moduleAdd(key){if(key==='project')return createProject();if(key==='activity')return createActivity();if(key==='finance')return createFinance()}function moduleQuery(key){if(key==='project')return listProjects();if(key==='activity')return listActivities();if(key==='task')return listTasks();if(key==='finance')return listFinance()}async function listProjects(){try{const r=await callApi('查詢專案');state.projects=r.資料||[];projectList.innerHTML=renderCards(state.projects,'專案名稱','專案狀態')}catch(e){projectList.innerHTML=errItem(e)}}async function listActivities(){try{const r=await callApi('查詢活動');state.activities=r.資料||[];activityList.innerHTML=renderCards(state.activities,'活動名稱','活動日期')}catch(e){activityList.innerHTML=errItem(e)}}async function listTasks(){try{const r=await callApi('查詢任務');state.tasks=r.資料||[];taskList.innerHTML=renderCards(state.tasks,'任務名稱','預計完成日')}catch(e){taskList.innerHTML=errItem(e)}}async function listFinance(){try{const r=await callApi('查詢財務');state.finance=r.資料||[];financeList.innerHTML=renderCards(state.finance,'說明','金額')}catch(e){financeList.innerHTML=errItem(e)}}async function createProject(){try{await callApi('新增專案',{專案名稱:projectName.value,機關名稱:agencyName.value,契約金額:contractAmount.value,履約起日:startDate.value,履約迄日:endDate.value});await refreshAll();showPage('dashboard')}catch(e){projectMsg.textContent=e.message}}async function createActivity(){try{await callApi('新增活動',{專案ID:(state.projects[0]||{}).專案ID,活動名稱:activityName.value,活動日期:activityDate.value,開始時間:activityStart.value,結束時間:activityEnd.value,活動地點:activityPlace.value});await refreshAll();showPage('dashboard')}catch(e){activityMsg.textContent=e.message}}async function createFinance(){try{await callApi('新增財務',{專案ID:(state.projects[0]||{}).專案ID,金額:financeAmount.value,交易日期:financeDate.value,說明:financeDesc.value,類型:'支出'});await refreshAll()}catch(e){financeMsg.textContent=e.message}}function renderCards(data,titleKey,subKey){return data.length?data.map(x=>`<div class="item"><b>${esc(x[titleKey]||'未命名')}</b><span class="tag">${esc(x[subKey]||'')}</span><div class="small">${Object.keys(x).slice(0,5).map(k=>esc(k)+'：'+esc(x[k])).join('<br>')}</div></div>`).join(''):'<div class="item"><b>目前沒有資料</b><div class="small">請新增資料，這裡會自動更新。</div></div>'}function errItem(e){return`<div class="item"><b>載入失敗</b><div class="small">${esc(e.message)}</div></div>`}function showPage(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');pageTitle.textContent=(modules.find(m=>m[0]===id)||[])[1]||'GovOps AI OS'}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</script></body></html>
