<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政務營運系統｜前端驗收中心</title>
  <script src="./config.js?v=p0-api"></script>
  <script src="./saas-runtime.js"></script>
  <script src="./govops-api-client.js?v=p0-api"></script>
  <script src="./session-guard.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f6f8fb;color:#172033}.wrap{max-width:1180px;margin:0 auto;padding:20px}header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:26px 20px;border-radius:0 0 28px 28px;box-shadow:0 18px 45px rgba(15,23,42,.16)}h1{margin:0;font-size:30px}.sub{opacity:.86;margin-top:8px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{grid-column:span 6;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 34px rgba(15,23,42,.07);overflow:hidden}.card.full{grid-column:span 12}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-bottom:1px solid #e5e7eb;background:#fbfdff}.head h2{margin:0;font-size:17px}.body{padding:16px}.badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#f1f5f9;color:#334155;font-size:12px;font-weight:900}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}button,a.btn{display:inline-flex;justify-content:center;align-items:center;text-decoration:none;border:0;border-radius:14px;padding:12px 14px;background:#1d4ed8;color:#fff;font-weight:900;cursor:pointer;font-size:15px}button.secondary,a.btn.secondary{background:#334155}button.danger{background:#b91c1c}.notice{display:none;margin-top:14px;padding:13px 15px;border-radius:15px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;font-weight:800}.notice.show{display:block}.notice.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}.notice.success{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:14px}.k{color:#64748b;font-weight:800}.v{word-break:break-word}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 12px;border:1px solid #e5e7eb;border-radius:14px;background:#fff}.title{font-weight:900}.desc{font-size:13px;color:#64748b;margin-top:4px;word-break:break-word}pre{margin:0;max-height:260px;overflow:auto;padding:14px;border-radius:14px;background:#f8fafc;color:#334155;font-size:14px;white-space:pre-wrap;word-break:break-word;border:1px solid #e5e7eb}.links{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:12px;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b;background:#f8fafc}.footer{color:#64748b;font-size:13px;margin:18px 0 40px;line-height:1.7}@media(max-width:860px){.toolbar{grid-template-columns:1fr 1fr}.card{grid-column:span 12}.kv{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:14px}.toolbar{grid-template-columns:1fr}header{border-radius:0 0 22px 22px}h1{font-size:25px}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>前端驗收中心</h1>
    <div class="sub">檢查設定、資料服務、登入狀態、系統健康、產品核心、管理控制台與財務秘書。</div>
    <div class="toolbar">
      <button onclick="runAllChecks()">一鍵前端驗收</button>
      <button class="secondary" onclick="runProductCoreChecks()">驗收產品核心</button>
      <button class="secondary" onclick="createLocalTestSession()">建立本機測試登入</button>
      <button class="danger" onclick="clearLocalSession()">清除登入狀態</button>
    </div>
    <div id="notice" class="notice"></div>
  </div>
</header>
<main class="wrap">
  <section class="grid">
    <div class="card"><div class="head"><h2>前端環境</h2><span id="envBadge" class="badge">待檢查</span></div><div class="body"><div id="envBox" class="kv"></div></div></div>
    <div class="card"><div class="head"><h2>登入狀態</h2><span id="sessionBadge" class="badge">待檢查</span></div><div class="body"><div id="sessionBox" class="kv"></div></div></div>
    <div class="card full"><div class="head"><h2>頁面入口</h2><span class="badge">導覽</span></div><div class="body"><div class="links"><a class="btn secondary" href="./runtime-health.html" target="_blank">系統健康檢查</a><a class="btn secondary" href="./login.html" target="_blank">登入頁</a><a class="btn secondary" href="./admin-console.html" target="_blank">管理控制台</a><a class="btn secondary" href="./finance-secretary.html" target="_blank">財務秘書</a><a class="btn secondary" href="./dashboard.html" target="_blank">營運首頁</a></div></div></div>
    <div class="card"><div class="head"><h2>資料服務驗收結果</h2><span id="apiBadge" class="badge">待檢查</span></div><div class="body"><div id="apiResults" class="list"><div class="empty">尚未執行</div></div></div></div>
    <div class="card"><div class="head"><h2>修復建議</h2><span id="recBadge" class="badge">待檢查</span></div><div class="body"><div id="recommendations" class="list"><div class="empty">尚未執行</div></div></div></div>
    <div class="card full"><div class="head"><h2>驗收摘要</h2><span class="badge">安全摘要</span></div><div class="body"><pre id="rawBox">尚未執行</pre></div></div>
  </section>
  <div class="footer">驗收原則：此頁只顯示中文摘要，不顯示系統內部資料。</div>
</main>
<script>
var QA = { results: [], raw: {} };
document.addEventListener('DOMContentLoaded', function(){ renderEnvironment(); renderSession(); });
function safeJson(text){try{return text?JSON.parse(text):{};}catch(e){return{};}}
function getProfile(){return safeJson(localStorage.getItem('govops_profile'));}
function getAuth(){return safeJson(localStorage.getItem('govops_auth'));}
function getSession(){var p=getProfile();var a=getAuth();return Object.assign({},p,a);}
function hasSession(){var s=getSession();return !!(s.tenantId||s.userId||s.email);}
function isAdmin(){var s=getSession();var role=String(s.userRole||s.role||'').toLowerCase();return role==='owner'||role==='admin';}
function hasLocalQASession(){var a=getAuth();return String(a.sessionToken||'').indexOf('LOCAL-DEMO-QA-')===0;}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
function notice(text,type){var n=document.getElementById('notice');n.textContent=text;n.className='notice show '+(type||'');}
function setBadge(id,status){var el=document.getElementById(id);if(!el)return;var ok=status==='正常'||status==='通過';var warn=status==='待處理'||status==='需注意';el.textContent=status||'待檢查';el.className='badge '+(ok?'ok':warn?'warn':'bad');}
function kv(obj){return Object.keys(obj).map(function(k){return '<div class="k">'+esc(k)+'</div><div class="v">'+esc(obj[k])+'</div>';}).join('');}
function renderEnvironment(){var env={'設定檔':window.GOVOPS_CONFIG?'已載入':'未載入','資料服務':window.GovOpsAPI?'已載入':'未載入','產品核心':window.GovOpsAPI&&window.GovOpsAPI.ProductCore?'已載入':'未載入','登入保護':window.GovOpsSessionGuard?'已載入':'未載入','版本狀態':window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.VERSION?'已標示':'未標示'};document.getElementById('envBox').innerHTML=kv(env);setBadge('envBadge',(env['設定檔']==='已載入'&&env['資料服務']==='已載入')?'正常':'需注意');}
function renderSession(){var s=getSession();var data={'組織狀態':s.tenantId?'已綁定':'未綁定','使用者狀態':s.userId?'已建立':'未建立','角色':roleLabel(s.userRole||s.role), '方案':planLabel(s.plan), '登入狀態':hasSession()?'已登入':'未登入','管理權限':isAdmin()?'有':'無'};document.getElementById('sessionBox').innerHTML=kv(data);setBadge('sessionBadge',hasSession()?'正常':'需注意');}
function roleLabel(role){return {owner:'負責人',admin:'管理者',finance:'財務',staff:'行政／執行',viewer:'檢視'}[String(role||'').toLowerCase()]||'未設定';}
function planLabel(plan){return {enterprise:'企業版',pro:'專業版',free:'免費版'}[String(plan||'').toLowerCase()]||plan||'-';}
function sessionPayload(){var s=getSession();return {tenantId:s.tenantId||'',userId:s.userId||'',userRole:s.userRole||s.role||'',plan:s.plan||'',email:s.email||'',phone:s.phone||''};}
async function request(action, extra){if(!window.GovOpsAPI||typeof GovOpsAPI.request!=='function'){return {success:false,message:'資料服務尚未載入',data:{}};}try{return await GovOpsAPI.request(Object.assign({action:action},sessionPayload(),extra||{}));}catch(e){return {success:false,message:'資料服務呼叫失敗，請確認部署與權限。',data:{}};}}
async function runAllChecks(){QA.results=[];QA.raw={};if(!hasSession()||!hasLocalQASession())createLocalTestSession(true);notice('正在執行前端驗收...', '');renderEnvironment();renderSession();var checks=[['系統健康檢查','系統健康檢查'],['產品資料結構檢查','product.schema.health'],['正式環境自檢','runProductionSelfCheck'],['復原報告','createRecoveryReport'],['帳務摘要','getTenantBillingSummary'],['功能權限','getTenantFeatureMatrix'],['服務使用量','getAPIUsageSummary']];for(var i=0;i<checks.length;i++){await addCheck(checks[i][0],checks[i][1]);}renderAll();}
async function runProductCoreChecks(){QA.results=[];QA.raw={};if(!hasSession()||!hasLocalQASession())createLocalTestSession(true);notice('正在驗收產品核心...', '');renderEnvironment();renderSession();await addCheck('產品資料初始化','product.schema.init');await addCheck('產品資料健康','product.schema.health');await addCheck('建立測試標案','tender.create',{標案名稱:'測試標案-'+Date.now(),機關名稱:'政務營運測試',標案狀態:'新標案',是否追蹤:'否',備註:'前端驗收自動測試'});await addCheck('查詢測試標案','tender.query',{關鍵字:'測試標案'});renderAll();}
function safeMessage(msg,ok){var text=String(msg||'');if(!text)return ok?'已完成':'尚未完成，請確認服務狀態。';if(/[A-Za-z]{2,}|https?:|script\\.google|exception|stack|undefined|JSON|API|Backend|Debug/i.test(text))return ok?'已完成':'尚未完成，請確認服務狀態。';return text;}
async function addCheck(label,action,extra){var res=await request(action,extra||{});QA.results.push({label:label,success:!!res.success,message:safeMessage(res.message,!!res.success)});QA.raw[action]=res;}
function renderAll(){renderResults();renderRecommendations();var failed=QA.results.filter(function(r){return !r.success;}).length;document.getElementById('rawBox').textContent='已完成 '+QA.results.length+' 項驗收；'+(failed?'有 '+failed+' 項需要處理。':'全部主要項目通過。');notice(failed?'驗收完成，但有項目需處理。':'驗收完成，主要項目通過。',failed?'error':'success');}
function renderResults(){var failed=QA.results.filter(function(r){return !r.success;}).length;setBadge('apiBadge',failed?'需注意':'通過');document.getElementById('apiResults').innerHTML=QA.results.length?QA.results.map(function(r){return '<div class="item"><div><div class="title">'+esc(r.label)+'</div><div class="desc">'+esc(r.message||'已完成')+'</div></div><span class="badge '+(r.success?'ok':'bad')+'">'+(r.success?'通過':'未通過')+'</span></div>';}).join(''):'<div class="empty">尚未執行</div>';}
function renderRecommendations(){var rec=[];if(!window.GOVOPS_CONFIG)rec.push('設定檔尚未載入。');if(!window.GovOpsAPI)rec.push('資料服務尚未載入，前端無法呼叫正式服務。');if(!window.GovOpsSessionGuard)rec.push('登入保護尚未載入，請確認正式頁面登入保護。');if(!hasSession())rec.push('目前沒有登入狀態，請先登入或建立本機測試登入。');if(hasSession()&&!isAdmin())rec.push('目前帳號不是管理角色，管理控制台會顯示無權限。');QA.results.forEach(function(r){if(!r.success)rec.push(r.label+' 未通過：'+(r.message||'請確認功能是否已接入。'));});if(!rec.length)rec.push('前端驗收狀態良好，可進入正式頁面操作測試。');setBadge('recBadge',rec.length>1?'需注意':'正常');document.getElementById('recommendations').innerHTML=rec.map(function(x){return '<div class="item"><div><div class="title">建議</div><div class="desc">'+esc(x)+'</div></div></div>';}).join('');}
function createLocalTestSession(silent){var token='LOCAL-DEMO-QA-'+Date.now().toString(36).toUpperCase();var profile={tenantId:'QA-FRONTEND',userId:'QA-ADMIN',userRole:'owner',role:'owner',plan:'enterprise',email:'qa@govops.local',organizationName:'前端驗收測試組織',userName:'前端驗收管理者',sessionToken:token};var auth={tenantId:profile.tenantId,userId:profile.userId,userRole:'owner',role:'owner',plan:'enterprise',status:'active',email:profile.email,sessionToken:token,isLoggedIn:true};localStorage.setItem('govops_profile',JSON.stringify(profile));localStorage.setItem('govops_auth',JSON.stringify(auth));renderSession();if(!silent)notice('已建立本機測試登入。','success');}
function clearLocalSession(){localStorage.removeItem('govops_profile');localStorage.removeItem('govops_auth');localStorage.removeItem('govops_usage');renderSession();notice('已清除登入狀態。','success');}
</script>
</body>
</html>
