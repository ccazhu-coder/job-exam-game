<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜履約任務派工</title>
<script src="./config.js"></script><script src="./saas-runtime.js"></script><script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:30px 20px}.wrap{max-width:1280px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}textarea{min-height:88px}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.warn{background:#b54708}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}
</style></head>
<body><header><div class="wrap"><h1>履約任務派工工作台</h1><div class="sub">場次任務範本｜任務建立｜人員指派｜狀態追蹤｜提醒排程</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>任務總覽</h2><label>關鍵字 / 標案ID / 場次ID</label><input id="keyword"><button class="good" onclick="queryTasks()">查詢任務</button><button onclick="dashboard()">任務儀表板</button><button class="secondary" onclick="location.href='./registration-management.html'">報名管理</button><button class="secondary" onclick="location.href='./index.html'">舊版營運入口</button><div class="kpis" id="kpiBox"></div><div id="mainResult" class="status">尚未操作。</div></section>
<section class="card span-6"><h2>一鍵產生場次任務範本</h2><label>場次ID</label><input id="tplEventId"><label>標案ID</label><input id="tplTenderId"><button class="good" onclick="generateTemplate()">產生標準履約任務</button><div class="status">會自動建立：確認講師、招生頁、名單確認、課前通知、場地設備、報到簽到、拍照、滿意度、核銷、結案。</div></section>
<section class="card span-6"><h2>建立單一任務</h2><div class="grid"><div class="span-6"><label>場次ID</label><input id="taskEventId"></div><div class="span-6"><label>標案ID</label><input id="taskTenderId"></div><div class="span-6"><label>任務階段</label><select id="taskStage"><option>課前</option><option>當日</option><option>課後</option><option>核銷</option><option>結案</option></select></div><div class="span-6"><label>任務類型</label><input id="taskType"></div><div class="span-12"><label>任務名稱</label><input id="taskName"></div><div class="span-12"><label>任務內容</label><textarea id="taskContent"></textarea></div><div class="span-6"><label>負責角色</label><select id="ownerRole"><option>project_manager</option><option>admin_staff</option><option>staff</option><option>finance</option><option>lecturer</option></select></div><div class="span-6"><label>截止日</label><input id="dueDate" type="date"></div></div><button class="good" onclick="createTask()">建立任務</button></section>
<section class="card span-6"><h2>任務指派</h2><label>任務ID</label><input id="assignTaskId"><label>被指派者姓名</label><input id="assigneeName"><label>被指派者ID</label><input id="assigneeId"><label>被指派者類型</label><select id="assigneeType"><option>project_manager</option><option>admin_staff</option><option>staff</option><option>finance</option><option>lecturer</option><option>vendor</option></select><button class="good" onclick="assignTask()">指派任務</button></section>
<section class="card span-6"><h2>任務狀態 / 提醒</h2><label>任務ID</label><input id="statusTaskId"><label>任務狀態</label><select id="taskStatus"><option>待指派</option><option>待處理</option><option>執行中</option><option>待確認</option><option>已完成</option><option>逾期</option><option>取消</option></select><label>完成說明</label><textarea id="doneNote"></textarea><button class="good" onclick="updateStatus()">更新狀態</button><button class="warn" onclick="queueReminder()">建立提醒</button></section>
<section class="card span-12"><h2>任務清單</h2><div id="taskTable"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function table(rows){rows=rows||[];const box=document.getElementById('taskTable');if(!rows.length){box.innerHTML='<div class="status">無任務資料</div>';return}const keys=['任務ID','場次ID','活動名稱','任務階段','任務名稱','負責人姓名','截止日','任務狀態'];box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,300).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function renderKpi(s){s=s||{};const items=[['總任務',s.total||0],['待指派',s.pending||0],['待處理',s.assigned||0],['執行中',s.running||0],['已完成',s.done||0],['逾期',s.overdue||0]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}
async function generateTemplate(){await api({action:'execution.task.template.generate',場次ID:val('tplEventId'),標案ID:val('tplTenderId')},'mainResult');queryTasks()}
async function createTask(){await api({action:'execution.task.create',場次ID:val('taskEventId'),標案ID:val('taskTenderId'),任務階段:val('taskStage'),任務類型:val('taskType'),任務名稱:val('taskName'),任務內容:val('taskContent'),負責角色:val('ownerRole'),截止日:val('dueDate')},'mainResult');queryTasks()}
async function assignTask(){await api({action:'execution.task.assign',任務ID:val('assignTaskId'),被指派者姓名:val('assigneeName'),被指派者ID:val('assigneeId'),被指派者類型:val('assigneeType')},'mainResult');queryTasks()}
async function updateStatus(){await api({action:'execution.task.updateStatus',任務ID:val('statusTaskId'),任務狀態:val('taskStatus'),完成說明:val('doneNote')},'mainResult');queryTasks()}
async function queueReminder(){await api({action:'execution.task.reminder.queue',任務ID:val('statusTaskId')},'mainResult')}
async function queryTasks(){const r=await api({action:'execution.task.query',keyword:val('keyword')},'mainResult');renderKpi(r.data&&r.data.summary);table(r.data&&r.data.rows)}
async function dashboard(){const r=await api({action:'execution.task.dashboard',keyword:val('keyword')},'mainResult');renderKpi(r.data&&r.data.summary);table(r.data&&r.data.tasks)}
queryTasks();
</script></body></html>
