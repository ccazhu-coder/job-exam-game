<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps ERP｜一頁式營運系統</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:24px 18px}.wrap{max-width:1360px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}.side{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.main{min-width:0}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.nav button{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border:0;border-radius:12px;background:#eef4ff;color:#173a63;font-weight:900;cursor:pointer}.nav button.active{background:#1d4e89;color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}label{display:block;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:16px}textarea{min-height:88px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#1d4e89;color:#fff;font-weight:900;cursor:pointer;margin:8px 6px 0 0;touch-action:manipulation}.good{background:#12805c}.warn{background:#b54708}.secondary{background:#e8eef7;color:#1d3557}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:520px;overflow:auto}.ok{background:#ecfdf3;border-color:#12b76a}.bad{background:#fff8e6;border-color:#f2c94c}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}.panel{display:none}.panel.active{display:block}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc}.mini{font-size:13px;color:#667085;line-height:1.6}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick button{margin:0}@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:relative;max-height:none}.span-6,.span-4,.span-3{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){header h1{font-size:22px}.kpis{grid-template-columns:1fr}.btn{width:100%;margin-right:0}.quick{grid-template-columns:1fr}}</style></head><body><header><h1>GovOps ERP｜一頁式營運系統</h1><div>同一頁完成：專案、履約、招生、執行、財務、會計、報稅、結案、交付</div></header><div class="wrap"><div class="layout"><aside class="side"><h3>今日工作台</h3><div class="nav"><button class="active" onclick="tab('dashboard',this)">今天要做</button><button onclick="tab('project',this)">新增案子</button><button onclick="tab('ops',this)">開課 / 活動前</button><button onclick="tab('execution',this)">活動當天</button><button onclick="tab('finance',this)">財務 / 報稅</button><button onclick="tab('closing',this)">結案交付</button><button onclick="tab('search',this)">資料查詢</button></div><hr><label>目前專案ID</label><input id="projectId" placeholder="可先空白"><label>場次ID</label><input id="eventId" placeholder="可先空白"><label>關鍵字</label><input id="keyword" placeholder="專案/課程/機關"><button class="btn good" onclick="loadProject()">載入目前專案</button><button class="btn secondary" onclick="safeDashboard()">更新總覽</button><p class="mini">先建立或查詢專案，系統會共用目前專案ID，不必多頁跳轉。</p></aside><main class="main"><section class="card"><div class="quick"><button class="btn good" onclick="tabById('project')">新增案子</button><button class="btn" onclick="tabById('ops')">建立場次/招生</button><button class="btn" onclick="tabById('execution')">活動執行</button><button class="btn" onclick="tabById('finance')">記帳報表</button><button class="btn" onclick="tabById('closing')">結案匯出</button></div><div id="kpiBox" class="kpis" style="margin-top:12px"></div><div id="result" class="status">系統待命中。請先按「新增案子」建立專案，或輸入專案ID後按「載入目前專案」。</div></section><section id="dashboard" class="panel active card"><h2>今天要做</h2><button class="btn" onclick="safeDashboard()">更新營運總覽</button><button class="btn" onclick="health()">健康檢查</button><button class="btn" onclick="loadProject()">目前專案詳情</button><div id="dashboardBox" class="status">這裡會顯示專案、報名、任務、未收款與結案狀態。</div></section><section id="project" class="panel card"><h2>新增 / 查詢專案</h2><div class="grid"><div class="span-4"><label>案源類型</label><select id="sourceType"><option>自辦課程</option><option>政府標案</option><option>合作課程</option><option>企業委託</option><option>政府補助案</option><option>其他</option></select></div><div class="span-4"><label>專案名稱</label><input id="projectName" placeholder="例：AI工具實戰課 / 某政府標案"></div><div class="span-4"><label>專案類型</label><input id="projectType" placeholder="課程/講座/諮詢/活動"></div><div class="span-4"><label>主辦單位</label><input id="ownerOrg"></div><div class="span-4"><label>合作單位</label><input id="partnerOrg"></div><div class="span-4"><label>負責人</label><input id="ownerName"></div><div class="span-4"><label>開始日期</label><input id="startDate" type="date"></div><div class="span-4"><label>結束日期</label><input id="endDate" type="date"></div><div class="span-4"><label>預算/營收目標</label><input id="targetAmount" type="number"></div><div class="span-12"><label>備註</label><textarea id="projectNote"></textarea></div></div><button class="btn good" onclick="createProject()">建立專案</button><button class="btn" onclick="bootstrapProject()">建立專案＋場次＋招生草稿</button><button class="btn secondary" onclick="queryProjects()">查詢專案</button><div id="projectTable"></div></section><section id="ops" class="panel card"><h2>開課 / 活動前</h2><div class="grid"><div class="span-4"><label>活動名稱</label><input id="eventName"></div><div class="span-4"><label>活動日期</label><input id="eventDate" type="date"></div><div class="span-4"><label>地點</label><input id="eventLocation"></div></div><button class="btn" onclick="createEvent()">建立場次</button><button class="btn" onclick="createRegistration()">建立招生設定</button><button class="btn good" onclick="finalizeRegistration()">報名結轉：名冊＋CRM＋Email</button><button class="btn" onclick="bootstrapTasks()">建立標準任務</button><button class="btn" onclick="remindTasks()">任務提醒</button><button class="btn secondary" onclick="registrationSummary()">報名摘要</button><button class="btn secondary" onclick="taskSummary()">任務摘要</button></section><section id="execution" class="panel card"><h2>活動當天 / 課後資料</h2><h3>出席管理</h3><div class="grid"><div class="span-3"><label>應出席</label><input id="expected" type="number"></div><div class="span-3"><label>實際出席</label><input id="actual" type="number"></div><div class="span-3"><label>缺席</label><input id="absent" type="number"></div><div class="span-3"><label>備註</label><input id="attNote"></div></div><button class="btn" onclick="saveAttendance()">儲存出席</button><h3>用餐統計</h3><button class="btn" onclick="mealSummary()">用餐統計</button><button class="btn" onclick="mealList()">用餐名單</button><button class="btn" onclick="mealVendorNote()">餐飲廠商備註</button><h3>滿意度</h3><div class="grid"><div class="span-4"><label>問卷方式</label><select id="surveyType"><option>紙本問卷</option><option>Google表單</option><option>其他線上問卷</option></select></div><div class="span-4"><label>滿意度平均</label><input id="satAvg" type="number" step="0.1"></div><div class="span-4"><label>問卷連結</label><input id="surveyUrl"></div><div class="span-12"><label>意見摘要/改善建議</label><textarea id="surveyNote"></textarea></div></div><button class="btn" onclick="saveSatisfaction()">儲存滿意度</button><h3>成果與附件</h3><div class="grid"><div class="span-4"><label>附件類別</label><select id="fileType"><option>成果照片</option><option>簽到表</option><option>滿意度資料</option><option>核銷憑證</option><option>會議紀錄</option><option>其他附件</option></select></div><div class="span-4"><label>檔案名稱</label><input id="fileName"></div><div class="span-4"><label>Drive/檔案URL</label><input id="fileUrl"></div><div class="span-6"><label>納入結案</label><select id="includeClosing"><option>是</option><option>否</option></select></div><div class="span-6"><label>納入核銷</label><select id="includeReimburse"><option>否</option><option>是</option></select></div></div><button class="btn" onclick="saveFile()">新增附件</button><button class="btn" onclick="createReimburseFromFile()">新增核銷附件紀錄</button><div id="executionBox"></div></section><section id="finance" class="panel card"><h2>財務 / 報稅</h2><div class="grid"><div class="span-3"><label>交易類型</label><select id="transactionType"><option>收入</option><option>支出</option><option>應收</option><option>應付</option><option>待判斷</option></select></div><div class="span-3"><label>金額</label><input id="amount" type="number"></div><div class="span-3"><label>日期</label><input id="date" type="date"></div><div class="span-3"><label>付款/收款方式</label><select id="method"><option>銀行存款</option><option>現金</option><option>LINE Pay</option><option>其他</option></select></div><div class="span-6"><label>對象</label><input id="target"></div><div class="span-6"><label>憑證URL</label><input id="voucherUrl"></div><div class="span-12"><label>人話描述</label><textarea id="description" placeholder="例如：收到彰化縣政府款項120000元；支付講師費6000元；便當店4500元還沒付"></textarea></div></div><button class="btn" onclick="autoDetectProject()">自動找專案</button><button class="btn" onclick="autoClassify()">自動判斷會計</button><button class="btn good" onclick="autoPost()">自動入帳</button><button class="btn secondary" onclick="projectPL()">專案損益</button><button class="btn secondary" onclick="financeSummary()">專案財務摘要</button><button class="btn secondary" onclick="linkSummary()">財務對應摘要</button><button class="btn secondary" onclick="unmatchedList()">待對應清單</button><button class="btn secondary" onclick="repairLinks()">修復對應</button><h3>月季年報 / 所得稅</h3><div class="grid"><div class="span-4"><label>月份</label><input id="month" type="month"></div><div class="span-4"><label>年度</label><input id="year" type="number"></div><div class="span-4"><label>季度</label><select id="quarter"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div><button class="btn" onclick="monthlyReport()">月報</button><button class="btn" onclick="quarterlyReport()">季報</button><button class="btn" onclick="yearlyReport()">年報</button><button class="btn" onclick="incomeTax()">所得稅資料</button><button class="btn" onclick="voucherList()">缺憑證</button></section><section id="closing" class="panel card"><h2>結案交付</h2><label>檢討與建議</label><textarea id="review"></textarea><button class="btn" onclick="closingSummary()">結案摘要</button><button class="btn" onclick="closingCheck()">缺件檢查</button><button class="btn" onclick="createClosing()">建立結案主檔</button><button class="btn" onclick="createPackage()">建立交付包</button><button class="btn" onclick="closingReport()">產生結案報告</button><button class="btn" onclick="deliveryHtml()">產生HTML交付版</button><button class="btn good" onclick="exportHtmlFile()">匯出HTML檔</button><button class="btn good" onclick="exportWordFile()">匯出Word可開啟版</button><button class="btn" onclick="exportPackageIndex()">匯出交付包索引</button></section><section id="search" class="panel card"><h2>資料查詢</h2><button class="btn" onclick="searchAll()">全域搜尋</button><button class="btn" onclick="health()">健康檢查</button><button class="btn" onclick="safeDashboard()">Dashboard</button><div id="searchBox"></div></section><section class="card"><h2>資料顯示區</h2><div id="dataBox"></div></section></main></div></div><script>const CONFIG_API_URL=(window.GOVOPS_CONFIG&&(window.GOVOPS_CONFIG.API_URL||window.GOVOPS_CONFIG.apiUrl))||'';const FALLBACK_API_URL='https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';const API_URL=CONFIG_API_URL||FALLBACK_API_URL;function $(id){return document.getElementById(id)}function val(id){return($(id)||{}).value||''}function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function payload(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role,plan:u.plan,專案ID:val('projectId'),projectId:val('projectId'),場次ID:val('eventId'),eventId:val('eventId'),keyword:val('keyword'),案源類型:val('sourceType'),活動名稱:val('eventName'),description:val('description'),描述:val('description'),項目:val('description'),金額:val('amount'),amount:val('amount'),日期:val('date'),date:val('date'),付款方式:val('method'),收款方式:val('method'),憑證URL:val('voucherUrl'),檢討建議:val('review'),review:val('review')},x||{})}function show(x,cls){$('result').className='status '+(cls||'');$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function api(data,opt){opt=opt||{};if(!opt.silent)show('處理中...');try{let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}if(!opt.silent)show(res,res&&res.success?'ok':'bad');return res}catch(e){const out={success:false,message:'API呼叫失敗',data:{error:String(e),apiUrl:API_URL}};if(!opt.silent)show(out,'bad');return out}}async function apiFirst(actions,opt){let last=null;for(const action of actions){const r=await api(payload(Object.assign({},opt||{},{action:action})),{silent:true});last=r;if(r&&r.success)return r}show(last||{success:false,message:'所有相容功能都無法執行'},'bad');return last}function tab(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$(id).classList.add('active');if(btn)btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function tabById(id){const buttons=[...document.querySelectorAll('.nav button')];const map={dashboard:0,project:1,ops:2,execution:3,finance:4,closing:5,search:6};tab(id,buttons[map[id]]||buttons[0])}function kpis(d){d=d||{};const items=[['專案',d.projects||d.total||0],['政府標案',d.政府標案||0],['自辦課程',d.自辦課程||0],['報名',d.registrations||d.報名數||0],['任務',d.tasks||d.任務數||0],['未收款',d.未收總額||0]];$('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+safe(x[1])+'</div><div class="name">'+safe(x[0])+'</div></div>').join('')}async function safeDashboard(){show('正在載入營運總覽...');let r=await apiFirst(['projectops.dashboard.summary','dashboard.runtime.summary','project.dashboard']);if(r&&r.success){kpis(r.data||{});$('dashboardBox').textContent=JSON.stringify(r.data||{},null,2);show({success:true,message:'營運總覽載入完成',data:r.data},'ok')}}async function health(){await apiFirst(['projectops.health','runtime.health.full'])}async function loadProject(){const r=await apiFirst(['project.detail.get','專案詳情']);if(r&&r.success){kpis(r.data.summary||{});renderDetail(r.data.detail||{})}}async function createProject(){const r=await api(payload({action:'project.create',專案名稱:val('projectName'),projectName:val('projectName'),專案類型:val('projectType'),主辦單位:val('ownerOrg'),合作單位:val('partnerOrg'),負責人:val('ownerName'),開始日期:val('startDate'),結束日期:val('endDate'),營收目標:val('targetAmount'),預算金額:val('targetAmount'),備註:val('projectNote'),課程名稱:val('projectName')}));if(r&&r.success&&r.data&&r.data.project){$('projectId').value=r.data.project.專案ID;loadProject()}}async function bootstrapProject(){const r=await api(payload({action:'project.bootstrap',專案名稱:val('projectName'),projectName:val('projectName'),專案類型:val('projectType'),主辦單位:val('ownerOrg'),合作單位:val('partnerOrg'),負責人:val('ownerName'),開始日期:val('startDate'),結束日期:val('endDate'),營收目標:val('targetAmount'),預算金額:val('targetAmount'),課程名稱:val('projectName')}));if(r&&r.success&&r.data&&r.data.project){$('projectId').value=r.data.project.專案ID;loadProject()}}async function queryProjects(){const r=await api(payload({action:'project.query'}));if(r&&r.success)$('projectTable').innerHTML=table((r.data&&r.data.rows)||[])}async function createEvent(){await api(payload({action:'project.createEvent',活動日期:val('eventDate'),地點:val('eventLocation')}));loadProject()}async function createRegistration(){await api(payload({action:'project.createRegistration'}));loadProject()}async function finalizeRegistration(){await api(payload({action:'project.registration.finalize'}));loadProject()}async function registrationSummary(){await api(payload({action:'project.registration.summary'}))}async function bootstrapTasks(){await api(payload({action:'project.task.bootstrap'}));loadProject()}async function remindTasks(){await api(payload({action:'project.task.remind'}))}async function taskSummary(){await api(payload({action:'project.task.summary'}))}async function saveAttendance(){await api(payload({action:'execution.attendance.record',應出席人數:val('expected'),實際出席人數:val('actual'),缺席人數:val('absent'),備註:val('attNote')}));loadProject()}async function mealSummary(){const r=await api(payload({action:'project.meal.summary'}));if(r&&r.success)$('executionBox').innerHTML=table(Object.keys(r.data).map(k=>({項目:k,內容:r.data[k]})))}async function mealList(){const r=await api(payload({action:'project.meal.list'}));if(r&&r.success)$('executionBox').innerHTML=table((r.data&&r.data.rows)||[])}async function mealVendorNote(){const r=await api(payload({action:'project.meal.vendorNote'}));if(r&&r.success)$('executionBox').innerHTML='<div class="status">'+safe(r.data.note||'')+'</div>'}async function saveSatisfaction(){await api(payload({action:'execution.satisfaction.record',問卷方式:val('surveyType'),滿意度平均:val('satAvg'),問卷連結:val('surveyUrl'),意見摘要:val('surveyNote')}));loadProject()}async function saveFile(){await api(payload({action:'file.center.create',檔案類別:val('fileType'),檔案名稱:val('fileName'),DriveURL:val('fileUrl'),是否納入結案:val('includeClosing'),是否納入核銷:val('includeReimburse')}));loadProject()}async function createReimburseFromFile(){await api(payload({action:'project.finance.reimburse.record',核銷類型:val('fileType'),金額:0,憑證URL:val('fileUrl'),備註:val('fileName')}));loadProject()}async function autoDetectProject(){const r=await api(payload({action:'project.finance.link.detectProject'}));if(r&&r.success&&r.data&&r.data.matched&&r.data.project){$('projectId').value=r.data.project.專案ID}}async function autoClassify(){await api(payload({action:'project.accounting.autoClassify'}))}async function autoPost(){await autoDetectProject();const type=val('transactionType');const action=type==='支出'?'project.accounting.autoPostExpense':type==='應收'?'project.accounting.autoPostReceivable':type==='應付'?'project.accounting.autoPostPayable':'project.accounting.autoPostIncome';await api(payload({action:action}))}async function projectPL(){await api(payload({action:'project.accounting.projectPL'}))}async function financeSummary(){await api(payload({action:'project.finance.summary'}))}async function linkSummary(){await api(payload({action:'project.finance.link.summary'}))}async function unmatchedList(){const r=await api(payload({action:'project.finance.link.unmatchedList'}));if(r&&r.success)$('dataBox').innerHTML=table((r.data&&r.data.rows)||[])}async function repairLinks(){await api(payload({action:'project.finance.link.repair'}));unmatchedList()}async function monthlyReport(){await api(payload({action:'project.report.monthly',month:val('month')}))}async function quarterlyReport(){await api(payload({action:'project.report.quarterly',year:val('year'),quarter:val('quarter')}))}async function yearlyReport(){await api(payload({action:'project.report.yearly',year:val('year')}))}async function incomeTax(){await api(payload({action:'project.report.incomeTax',year:val('year')}))}async function voucherList(){await api(payload({action:'project.report.voucherList',year:val('year')}))}async function closingSummary
