<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ProjectOps ERP｜真正營運首頁</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:30px 22px}main{max-width:1280px;margin:auto;padding:20px}.sub{opacity:.92;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:24px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.menu a{display:block;background:#eef4ff;border:1px solid #dbe7ff;color:#173a63;text-decoration:none;border-radius:16px;padding:18px;font-weight:900}.menu small{display:block;margin-top:6px;color:#667085;font-weight:500;line-height:1.5}button,input{padding:12px;border-radius:12px;border:1px solid #d8e0eb;font-size:15px}button{background:#1d4e89;color:white;font-weight:900;cursor:pointer}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left}th{background:#f8fafc}@media(max-width:900px){.span-6{grid-column:span 12}.menu,.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.menu,.kpis{grid-template-columns:1fr}}</style></head><body><header><h1>ProjectOps ERP｜真正營運首頁</h1><div class="sub">政府標案 × 自辦課程 × 合作課程｜從專案建立、招生開課、任務派工、CRM、財務核銷到結案</div></header><main><section class="card"><div class="menu"><a href="./project-pool.html">專案池<small>新增政府標案、自辦課程、合作課程</small></a><a href="./registration-management.html">招生報名<small>招生設定、報名同步、錄取審核、名冊</small></a><a href="./task-assignment.html">任務派工<small>課前、當日、課後、核銷、結案任務</small></a><a href="./participant-crm-dashboard.html">學員CRM<small>學員主檔、參與歷程、回流分析</small></a><a href="./tender-execution.html">開課/履約執行<small>場次、出席、滿意度、成果附件</small></a><a href="./resource-master.html">資源主檔<small>講師、工作人員、合作廠商、場地</small></a><a href="./finance-secretary.html">財務核銷<small>收款、支出、核銷、未收款</small></a><a href="./runtime-health.html">系統健康<small>API、資料表、Queue、Email、Runtime</small></a></div></section><section class="card"><button onclick="loadDashboard()">載入今日營運總覽</button> <button onclick="loadHealth()">檢查系統健康</button><div id="kpiBox" class="kpis"></div><div id="result" class="status">尚未操作。</div></section><section class="card"><h2>全域搜尋</h2><input id="keyword" placeholder="搜尋專案、學員、場次、任務、Email" style="width:70%"> <button onclick="searchAll()">搜尋</button><div id="searchTable"></div></section></main><script>const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'';function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO'}}}function p(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId},x||{})}async function api(data){document.getElementById('result').textContent='處理中...';let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}document.getElementById('result').textContent=JSON.stringify(res,null,2);return res}function kpis(d){d=d||{};const items=[['專案',d.projects||d.total||0],['政府標案',d.政府標案||0],['自辦課程',d.自辦課程||0],['報名',d.registrations||0],['學員',d.participants||0],['任務',d.tasks||0]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}async function loadDashboard(){const a=await api(p({action:'project.dashboard'}));let d=a.data||{};try{const b=await api(p({action:'dashboard.runtime.summary'}));d=Object.assign({},b.data||{},d,{projects:d.total||0})}catch(e){}kpis(d)}async function loadHealth(){await api(p({action:'runtime.health.full'}))}async function searchAll(){const r=await api(p({action:'search.unified.query',keyword:document.getElementById('keyword').value}));const rows=(r.data&&r.data.results)||[];document.getElementById('searchTable').innerHTML=rows.length?'<table><thead><tr><th>來源</th><th>資料</th></tr></thead><tbody>'+rows.slice(0,100).map(x=>'<tr><td>'+safe(x.source)+'</td><td>'+safe(JSON.stringify(x.raw||x))+'</td></tr>').join('')+'</tbody></table>':'<div class="status">無搜尋結果</div>'}function safe(x){return String(x||'').replace(/[<>&]/g,'')}loadDashboard();</script></body></html>
