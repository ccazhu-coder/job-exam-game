<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜廠商管理</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜廠商管理</div><div class="sub">對齊：23_合作廠商主檔｜每個模組必備：新增、修改、查詢</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span6"><h2>新增合作廠商</h2><form id="createForm"><label>廠商名稱＊</label><input name="廠商名稱" required><label>廠商類型</label><select name="廠商類型"><option>場地</option><option>餐廳/餐飲</option><option>原材料/物料</option><option>印刷/設計</option><option>交通/接駁</option><option>設備租借</option><option>住宿</option><option>保險</option><option>攝影錄影</option><option>其他廠商</option></select><label>服務項目</label><input name="服務項目"><div class="row"><div><label>聯絡人</label><input name="聯絡人"></div><div><label>聯絡電話</label><input name="聯絡電話"></div></div><div class="row"><div><label>統一編號</label><input name="統一編號"></div><div><label>報價方式</label><input name="報價方式"></div></div><label>可服務地區</label><input name="可服務地區"><label>可配合文件</label><input name="可配合文件" placeholder="收據、發票、領據、報價單"><label>備註</label><textarea name="備註"></textarea><button>新增廠商</button></form><div id="createMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>修改合作廠商</h2><form id="updateForm"><label>廠商ID＊</label><input name="廠商ID" required><label>廠商名稱</label><input name="廠商名稱"><label>廠商類型</label><input name="廠商類型"><label>服務項目</label><input name="服務項目"><div class="row"><div><label>聯絡人</label><input name="聯絡人"></div><div><label>聯絡電話</label><input name="聯絡電話"></div></div><label>報價方式</label><input name="報價方式"><label>可服務地區</label><input name="可服務地區"><label>備註</label><textarea name="備註"></textarea><button class="green">修改廠商</button></form><div id="updateMsg" class="msg">尚未修改。</div></section><section class="card span12"><h2>查詢合作廠商</h2><div class="row"><input id="keyword" placeholder="廠商名稱、類型、地區、服務項目"><button onclick="queryVendors()">查詢廠商</button></div><div class="btns"><button class="secondary" onclick="queryTypes()">查詢廠商類型</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function obj(id,action){const fd=new FormData(document.getElementById(id));const o={action};fd.forEach((v,k)=>{if(v)o[k]=v});return o}document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('createForm','新增合作廠商'),'createMsg');queryVendors();});document.getElementById('updateForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('updateForm','修改合作廠商'),'updateMsg');queryVendors();});async function queryVendors(){const r=await ERPALIGNED.api({action:'查詢合作廠商',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}async function queryTypes(){const r=await ERPALIGNED.api({action:'查詢合作廠商類型'},'queryMsg');ERPALIGNED.renderTable(r,'table')}queryVendors();</script></body></html>
