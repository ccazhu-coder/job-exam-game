<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜廠商管理</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">政府標案全流程營運系統</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>廠商管理</h1>
    <p>管理合作廠商、匯款資訊與發票扣繳設定</p>
  </div>
  <div class="card">
    <div class="btns" style="margin-bottom:10px;flex-wrap:wrap">
      <button class="gold" onclick="openCreate()">＋ 新增廠商</button>
      <select id="vtype" onchange="query()" style="max-width:140px">
        <option value="">全部類型</option>
        <option>場地</option><option>餐廳/餐飲</option><option>印刷/設計</option>
        <option>交通/接駁</option><option>設備租借</option><option>攝影錄影</option><option>其他廠商</option>
      </select>
      <select id="vfav" onchange="query()" style="max-width:100px">
        <option value="">全部</option><option>是</option><option>否</option>
      </select>
      <div style="flex:1"></div>
      <input id="keyword" placeholder="名稱、電話、銀行、統編…" style="max-width:220px;margin:0" onkeydown="if(event.key==='Enter')query()">
      <button onclick="query()">查詢</button>
    </div>
    <div id="queryMsg" class="msg">載入中…</div>
    <div id="table" style="margin-top:8px"></div>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

const VEN_F = [
  {name:'名稱', label:'名稱＊'},
  {name:'類型', label:'類型', type:'select', options:['場地','餐廳/餐飲','原材料/物料','印刷/設計','交通/接駁','設備租借','住宿','保險','攝影錄影','其他廠商']},
  {name:'聯絡人', label:'聯絡人'},
  {name:'電話', label:'電話', type:'tel'},
  {name:'地址', label:'地址'},
  {name:'Email', label:'Email', type:'email'},
  {name:'支付方式', label:'支付方式', type:'select', options:['匯款','現金','LINE Pay','支票','其他']},
  {name:'預設單價', label:'預設單價（元）', type:'number'},
  {name:'銀行', label:'銀行'},
  {name:'帳號', label:'帳號'},
  {name:'戶名', label:'戶名'},
  {name:'統編/身分證', label:'統編／身分證'},
  {name:'是否開發票', label:'是否開發票', type:'select', options:['','是','否']},
  {name:'是否扣繳', label:'是否扣繳', type:'select', options:['','是','否']},
  {name:'常用', label:'常用', type:'select', options:['','是','否']},
  {name:'評價', label:'評價', type:'select', options:['','5','4','3','2','1']},
  {name:'備註', label:'備註', type:'textarea'}
];
const VEN_EDIT = [{name:'廠商編號',label:'廠商編號',readonly:true},...VEN_F];

function openCreate(){ERPALIGNED.showEditModal('新增合作廠商',VEN_F,{},'新增合作廠商',null,query);}
function openEdit(row){ERPALIGNED.showEditModal('編輯廠商：'+row['名稱'],VEN_EDIT,row,'修改合作廠商','廠商編號',query);}
async function query(){
  const r=await ERPALIGNED.api({action:'查詢合作廠商',keyword:document.getElementById('keyword').value,類型:document.getElementById('vtype').value,常用:document.getElementById('vfav').value},'queryMsg');
  ERPALIGNED.renderTableWithEdit(r,'table',openEdit,['廠商編號','名稱','類型','電話','支付方式','銀行','常用','評價']);
}
query();
</script>
</body>
</html>
