  <title>GovOps OS｜SaaS 組織登入</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#eef3ff;color:#182033}.wrap{max-width:1120px;margin:0 auto;padding:18px}.hero{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;border-radius:28px;padding:30px 22px;margin-top:18px}.brand{font-size:28px;font-weight:900}.sub{line-height:1.7;opacity:.92;margin-top:8px}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}.card{background:#fff;border:1px solid #e7edf5;border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 14px 34px rgba(16,37,66,.09)}label{display:block;margin:12px 0 6px;font-weight:900;color:#344054}input,select,textarea{width:100%;padding:13px;border:1px solid #d8e1ec;border-radius:13px;background:#fbfcff;font-size:16px}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a.btn{display:inline-block;border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:900;cursor:pointer;text-decoration:none;background:#1d4e89;color:#fff}.secondary{background:#e8eef7!important;color:#1d3557!important}.msg{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cfd8e6;white-space:pre-wrap;line-height:1.65}.hint{background:#eef6ff;border:1px solid #cfe6ff;color:#16436f;border-radius:12px;padding:10px 12px;line-height:1.65}.pill{display:inline-flex;border-radius:999px;padding:7px 10px;background:#eef6ff;color:#16436f;font-weight:900;font-size:13px;margin:4px 4px 0 0}.dark{background:#102542;color:#fff}.dark .hint{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#dbeafe}.plan{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px;margin-top:10px}.price{font-size:26px;font-weight:900;color:#93c5fd}.small{font-size:13px;color:#cbd5e1;line-height:1.65}@media(max-width:880px){.grid,.row{grid-template-columns:1fr}.btns button,.btns a{width:100%;text-align:center}}
  </style>
</head>
