<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜正式登入</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
<style>
body{min-height:100vh;background:linear-gradient(135deg,#0d2340 0%,#24566f 52%,#f7f4ef 52%,#f7f4ef 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-shell{width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:18px;align-items:stretch}
.intro,.card{border-radius:10px;box-shadow:0 18px 45px rgba(13,35,64,.22)}
.intro{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.55);padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.eyebrow{font-size:.76rem;font-weight:800;color:#7a6029;letter-spacing:.06em;text-transform:uppercase}
.intro h1{font-size:2rem;line-height:1.25;color:#0d2340;margin:10px 0 10px;letter-spacing:0}
.intro p{color:#5a5248;font-size:.94rem;margin:0;max-width:560px}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px 0}
.feature{border:1px solid #e0dbd2;border-radius:8px;padding:12px;background:#fff}
.feature strong{display:block;color:#0d2340;font-size:.86rem;margin-bottom:2px}
.feature span{color:#8a8278;font-size:.78rem}
.status-panel{border-left:4px solid #b8963e;background:#f5edd8;padding:12px 14px;border-radius:0 8px 8px 0;color:#4a453f;font-size:.84rem}
.plan-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.plan{border:1px solid #e0dbd2;background:#fff;border-radius:8px;padding:10px}
.plan b{display:block;color:#0d2340;font-size:.84rem}
.plan span{display:block;color:#7a6029;font-size:.76rem;margin-top:2px}
.card{background:#0e1e31;border:1.5px solid #1e3a5c;padding:34px 32px;color:#ccd6f6}
.brand{font-size:1.35rem;font-weight:800;color:#d4af6a;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand::before{content:'';display:block;width:5px;height:1.35em;background:#d4af6a;border-radius:3px}
.tagline{font-size:.83rem;color:#7a9bc5;margin-bottom:22px}
.saved-box{background:rgba(184,150,62,.07);border:1px solid rgba(184,150,62,.3);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.saved-box{display:none}
.saved-name{font-size:.95rem;font-weight:800;color:#fff}
.saved-sub{font-size:.78rem;color:#9fb5d1;margin:3px 0 0}
.fi{margin-bottom:14px}
.fi label{display:block;font-size:.8rem;font-weight:700;color:#9fb5d1;margin:0 0 5px}
.fi input,.fi select{width:100%;padding:10px 13px;background:#0a1628;border:1.5px solid #1e3a5c;border-radius:6px;color:#eef3ff;font-size:.9rem;font-family:inherit;box-sizing:border-box}
.fi input:focus,.fi select:focus{outline:none;border-color:#b8963e;box-shadow:0 0 0 3px rgba(184,150,62,.12)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:13px;background:#b8963e;color:#07111f;border:none;border-radius:8px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s;margin-top:6px;justify-content:center}
.btn:hover{background:#d4af6a}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid #2b4a70;color:#9fb5d1;margin-top:8px}
.btn.ghost:hover{border-color:#b8963e;color:#d4af6a;background:rgba(184,150,62,.08)}
.err{background:rgba(192,57,43,.12);color:#ff8a7d;border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:10px 14px;font-size:.83rem;margin-top:10px;display:none}
.sep{text-align:center;font-size:.78rem;color:#48627f;margin:16px 0;position:relative}
.sep::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:#1e3a5c}
.sep span{background:#0e1e31;padding:0 12px;position:relative}
@media(max-width:860px){body{align-items:flex-start;background:#f7f4ef;padding:14px}.auth-shell{grid-template-columns:1fr}.intro{min-height:auto;padding:24px}.intro h1{font-size:1.55rem}.plan-row,.feature-grid,.field-row{grid-template-columns:1fr}.card{padding:26px 22px}}
</style>
</head>
<body>
<div class="auth-shell">
  <section class="intro">
    <div>
      <div class="eyebrow">GovOps OS</div>
      <h1>政府專案長期營運 ERP SaaS</h1>
      <p>以專案與活動為核心，串接主辦單位、履約任務、報名簽到、文件缺件、領據核銷、請款收款與結案成果。</p>
      <div class="feature-grid">
        <div class="feature"><strong>專案主線</strong><span>客戶、專案、活動與履約進度集中管理。</span></div>
        <div class="feature"><strong>活動作業</strong><span>一個專案可管理多場活動與各自任務。</span></div>
        <div class="feature"><strong>核銷請款</strong><span>領據、憑證、請款與收款狀態清楚追蹤。</span></div>
        <div class="feature"><strong>AI 戰情</strong><span>提醒缺件、逾期、異動與結案風險。</span></div>
      </div>
      <div class="status-panel">正式登入會檢查帳號、角色、租戶與登入憑證。未登入或憑證失效時會自動回到登入頁。</div>
    </div>
    <div class="plan-row" aria-label="系統主軸">
      <div class="plan"><b>專案</b><span>合約、期程、缺件、成果與結案。</span></div>
      <div class="plan"><b>活動</b><span>場次、講師、場地、任務與報名。</span></div>
      <div class="plan"><b>財務</b><span>領據、核銷、請款與收款。</span></div>
    </div>
  </section>

  <main class="card">
    <div class="brand">GovOps OS</div>
    <div class="tagline">請使用正式帳號登入營運戰情中心</div>

    <div class="saved-box" id="savedBox">
      <div class="saved-name" id="savedName"></div>
      <div class="saved-sub" id="savedSub"></div>
      <button class="btn" id="quickBtn" onclick="doQuickLogin()">使用目前登入狀態進入</button>
      <button class="btn ghost" onclick="showLoginForm()">改用其他帳號登入</button>
    </div>

    <div id="loginForm">
      <div class="fi"><label>電子信箱</label><input id="l_email" type="email" placeholder="請輸入電子信箱" autocomplete="email"></div>
      <div class="fi"><label>密碼</label><input id="l_pwd" type="password" placeholder="請輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="err" id="errMsg"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">登入</button>
    </div>

    <div class="sep"><span>正式營運入口</span></div>
  </main>
</div>

<script src="./govops-api-client.js?v=p0-api"></script>
<script>function nowISO(){return new Date().toISOString();}
function addDaysISO(days){var d=new Date();d.setDate(d.getDate()+days);return d.toISOString();}
function normalizeSessionData(d){
  d=d||{};
  var role=d.role||d.userRole||'owner';
  var planId=d.planId||d.plan||'pro';
  var tenantId=d.tenantId||('TENANT-'+Date.now().toString(36).toUpperCase());
  var workspaceId=d.workspaceId||tenantId;
  return {
    sessionToken:d.sessionToken||'',
    userId:d.userId||('USR-'+Date.now().toString(36).toUpperCase()),
    tenantId:tenantId,
    workspaceId:workspaceId,
    workspaceName:d.workspaceName||d.orgName||d.organizationName||'GovOps OS',
    userName:d.userName||d.name||'使用者',
    email:d.email||'',
    role:role,
    userRole:role,
    planId:planId,
    plan:planId,
    planName:d.planName||'專業方案',
    status:d.status||'active',
    isLoggedIn:true,
    loginTime:d.loginTime||nowISO(),
    expireTime:d.expireTime||addDaysISO(14)
  };
}
function saveSession(d){
  var data=normalizeSessionData(d);
  if(!data.sessionToken)throw new Error('登入未完成，請重新登入。');
  localStorage.setItem('govops_auth',JSON.stringify(data));
  localStorage.setItem('govops_profile',JSON.stringify({
    userId:data.userId,userName:data.userName,email:data.email,role:data.role,userRole:data.userRole,
    tenantId:data.tenantId,workspaceId:data.workspaceId,orgName:data.workspaceName,plan:data.planId,
    status:data.status,isLoggedIn:true
  }));
  return data;
}
function showErr(msg){var e=document.getElementById('errMsg');e.textContent=msg;e.style.display='';}
function showLoginForm(){document.getElementById('savedBox').style.display='none';document.getElementById('loginForm').style.display='';}
function planLabel(plan){return {enterprise:'企業方案',pro:'專業方案',free:'試用方案'}[String(plan||'').toLowerCase()]||plan||'未設定';}
function getRedirectTarget(){
  var p=new URLSearchParams(location.search).get('redirect')||'';
  var target=p?decodeURIComponent(p):'dashboard.html';
  target=target.replace(/^\.\//,'');
  if(!target||target.includes('login')||target.includes('register'))return'dashboard.html';
  if(target.charAt(0)==='/')target=target.slice(1);
  try{
    var u=new URL(target,location.href);
    if(u.origin!==location.origin)return'dashboard.html';
    return u.pathname.split('/').pop() + u.search + u.hash;
  }catch(e){return'dashboard.html';}
}
async function doQuickLogin(){
  var auth=JSON.parse(localStorage.getItem('govops_auth')||'{}');
  if(!auth.sessionToken){showLoginForm();return;}
  if(String(auth.sessionToken).indexOf('LOCAL-DEMO-')===0){localStorage.removeItem('govops_auth');localStorage.removeItem('govops_profile');showLoginForm();showErr('測試登入已停用，請使用正式帳號登入。');return;}
  var r=await GovOpsAPI.post({action:'auth.me',sessionToken:auth.sessionToken});
  if(r.success){window.location.href=getRedirectTarget();}
  else{localStorage.removeItem('govops_auth');localStorage.removeItem('govops_profile');showLoginForm();showErr(r.message||'登入狀態已失效，請重新登入。');}
}
async function doLogin(){
  var email=document.getElementById('l_email').value.trim();
  var pwd=document.getElementById('l_pwd').value;
  if(!email||!pwd){showErr('請輸入 Email 與密碼。');return;}
  var btn=document.getElementById('loginBtn');
  btn.textContent='登入中...';btn.disabled=true;document.getElementById('errMsg').style.display='none';
  var r=await GovOpsAPI.post({action:'auth.login',email:email,password:pwd});
  btn.textContent='登入';btn.disabled=false;
  if(!r.success){showErr(r.message||'登入未完成，請確認帳號與密碼。');return;}
  try{saveSession(r.data);}catch(e){showErr('登入未完成，請稍後再試。');return;}
  window.location.href=getRedirectTarget();
}
(function(){
  try{
    var auth=JSON.parse(localStorage.getItem('govops_auth')||'{}');
    if(auth.sessionToken&&auth.isLoggedIn&&(auth.userName||auth.email)){
      document.getElementById('savedName').textContent=(auth.userName||'使用者')+'｜'+(auth.workspaceName||'組織');
      document.getElementById('savedSub').textContent='方案：'+(auth.planName||planLabel(auth.planId||auth.plan));
      document.getElementById('savedBox').style.display='block';
      document.getElementById('loginForm').style.display='none';
    }
  }catch(e){}
})();</script>
</body>
</html>
