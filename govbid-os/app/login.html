<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovOps OS｜使用者登錄</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f4f7fb;color:#182033}.wrap{max-width:820px;margin:0 auto;padding:18px}.hero{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;border-radius:24px;padding:28px 20px;margin-top:18px}.brand{font-size:26px;font-weight:900}.sub{line-height:1.7;opacity:.92;margin-top:8px}.card{background:#fff;border:1px solid #e7edf5;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 28px rgba(16,37,66,.08)}label{display:block;margin:12px 0 6px;font-weight:900;color:#344054}input,select,textarea{width:100%;padding:13px;border:1px solid #d8e1ec;border-radius:13px;background:#fbfcff;font-size:16px}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a.btn{display:inline-block;border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:900;cursor:pointer;text-decoration:none;background:#1d4e89;color:#fff}.secondary{background:#e8eef7!important;color:#1d3557!important}.msg{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cfd8e6;white-space:pre-wrap;line-height:1.65}.hint{background:#eef6ff;border:1px solid #cfe6ff;color:#16436f;border-radius:12px;padding:10px 12px;line-height:1.65}@media(max-width:680px){.row{grid-template-columns:1fr}.btns button,.btns a{width:100%;text-align:center}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="brand">GovOps OS｜使用者登錄</div>
      <div class="sub">第一次使用請先建立你的工作室／公司資料。系統會記住你的主辦單位、聯絡人與常用設定，之後就不用一直重複輸入。</div>
    </section>
    <section class="card">
      <div class="hint">這是 MVP 登錄版，資料會先存在你的瀏覽器與 Apps Script 後端。之後再升級正式帳號登入。</div>
      <label>使用者名稱／工作室名稱＊</label><input id="userName" placeholder="例如：珍珠老師／璞策顧問工作室">
      <div class="row"><div><label>Email</label><input id="email" type="email"></div><div><label>手機</label><input id="phone"></div></div>
      <label>主要服務單位／主辦單位</label><input id="defaultHost" placeholder="例如：彰化縣米穀商業同業公會">
      <div class="row"><div><label>常用聯絡人</label><input id="defaultContact"></div><div><label>常用電話</label><input id="defaultContactPhone"></div></div>
      <label>常用活動類型</label><select id="defaultActivityType"><option>政府課程</option><option>公會活動</option><option>職涯講座</option><option>AI課程</option><option>工作坊</option><option>其他</option></select>
      <label>備註</label><textarea id="note" placeholder="可填常用合作單位、常用場地或提醒事項"></textarea>
      <div class="btns"><button onclick="saveProfile()">儲存並進入主系統</button><a class="btn secondary" href="./index.html">先略過，直接進入</a></div>
      <div id="msg" class="msg">尚未登錄。</div>
    </section>
  </main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwNWbHwPs9lw1qpbOi6HeQhNn3kHNfs6Ap9ybTnOX_u2bssBGKwtwfygwwGpYblj-vt2Q/exec';
function show(t){document.getElementById('msg').textContent=t}
function makeUserId(){return 'USR-'+Date.now().toString(36).toUpperCase()}
function loadLocal(){const p=JSON.parse(localStorage.getItem('govops_profile')||'null');if(!p)return;userName.value=p.userName||'';email.value=p.email||'';phone.value=p.phone||'';defaultHost.value=p.defaultHost||'';defaultContact.value=p.defaultContact||'';defaultContactPhone.value=p.defaultContactPhone||'';defaultActivityType.value=p.defaultActivityType||'政府課程';note.value=p.note||''}
async function saveProfile(){if(!userName.value.trim()){show('請先填寫使用者名稱／工作室名稱。');return}const old=JSON.parse(localStorage.getItem('govops_profile')||'{}');const profile={userId:old.userId||makeUserId(),userName:userName.value.trim(),email:email.value.trim(),phone:phone.value.trim(),defaultHost:defaultHost.value.trim(),defaultContact:defaultContact.value.trim(),defaultContactPhone:defaultContactPhone.value.trim(),defaultActivityType:defaultActivityType.value,note:note.value.trim(),savedAt:new Date().toISOString()};localStorage.setItem('govops_profile',JSON.stringify(profile));show('儲存中，請稍候...');try{const params=new URLSearchParams({action:'儲存使用者設定',userId:profile.userId,使用者名稱:profile.userName,Email:profile.email,手機:profile.phone,預設主辦單位:profile.defaultHost,預設聯絡人:profile.defaultContact,預設聯絡電話:profile.defaultContactPhone,預設活動類型:profile.defaultActivityType,備註:profile.note});await fetch(API_URL+'?'+params.toString());}catch(e){}show('已儲存，正在進入主系統...');setTimeout(()=>location.href='./index.html',700)}
loadLocal();
</script>
</body>
</html>
