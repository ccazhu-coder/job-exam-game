<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜報名管理工作台</title>
<script src="./config.js"></script>
<script src="./saas-runtime.js"></script>
<script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:white;padding:30px 20px}.wrap{max-width:1280px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}textarea{min-height:88px}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.warn{background:#b54708}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{background:#eef3f8;color:#1d3557}.tab.active{background:#1d4e89;color:#fff}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>報名管理工作台</h1><div class="sub">招生設定｜手動報名｜線上報名同步｜錄取審核｜學員名冊｜學員資料庫</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>報名總覽</h2><label>關鍵字 / 標案ID / 場次ID / 招生ID</label><input id="keyword"><button class="good" onclick="queryAll()">載入報名資料</button><button class="secondary" onclick="location.href='./tender-execution.html'">履約執行</button><button class="secondary" onclick="location.href='./resource-master.html'">資源主檔</button><button class="secondary" onclick="location.href='./tender-erp.html'">回標案ERP</button><div class="kpis" id="kpiBox"></div><div id="mainResult" class="status">尚未操作。</div></section>
<section class="card span-12"><div class="tabs"><button class="tab active" onclick="showPanel('setting',this)">招生設定</button><button class="tab" onclick="showPanel('manual',this)">手動報名</button><button class="tab" onclick="showPanel('online',this)">線上同步</button><button class="tab" onclick="showPanel('review',this)">錄取審核</button><button class="tab" onclick="showPanel('roster',this)">名冊/學員庫</button></div>
<div id="setting" class="panel"><h2>建立招生設定</h2><div class="grid"><div class="span-4"><label>場次ID</label><input id="setEventId"></div><div class="span-4"><label>標案ID</label><input id="setTenderId"></div><div class="span-4"><label>活動名稱</label><input id="setEventName"></div><div class="span-4"><label>活動日期</label><input id="setEventDate"></div><div class="span-4"><label>招生對象</label><input id="target"></div><div class="span-4"><label>名額上限</label><input id="capacity"></div><div class="span-4"><label>候補名額</label><input id="waitlist"></div><div class="span-4"><label>報名開始</label><input id="startDate"></div><div class="span-4"><label>報名截止</label><input id="endDate"></div><div class="span-4"><label>是否審核</label><select id="needReview"><option>是</option><option>否</option></select></div><div class="span-4"><label>是否繳費</label><select id="needPayment"><option>否</option><option>是</option></select></div><div class="span-4"><label>是否資格文件</label><select id="needFile"><option>否</option><option>是</option></select></div></div><button class="good" onclick="createSetting()">建立招生設定</button></div>
<div id="manual" class="panel" style="display:none"><h2>手動新增報名</h2><div class="grid"><div class="span-4"><label>招生ID</label><input id="regSettingId"></div><div class="span-4"><label>場次ID</label><input id="regEventId"></div><div class="span-4"><label>姓名</label><input id="name"></div><div class="span-4"><label>電話</label><input id="phone"></div><div class="span-4"><label>Email</label><input id="email"></div><div class="span-4"><label>LINE ID</label><input id="lineId"></div><div class="span-4"><label>識別碼</label><input id="identifier"></div><div class="span-4"><label>身分類別</label><input id="identityType"></div><div class="span-4"><label>行銷同意</label><select id="marketingConsent"><option>待確認</option><option>是</option><option>否</option></select></div></div><button class="good" onclick="createManualRegistration()">新增報名</button><button class="secondary" onclick="dedupePreview()">去重預覽</button></div>
<div id="online" class="panel" style="display:none"><h2>線上報名連結同步</h2><div class="grid"><div class="span-4"><label>招生ID</label><input id="onlineSettingId"></div><div class="span-4"><label>場次ID</label><input id="onlineEventId"></div><div class="span-4"><label>線上報名連結</label><input id="onlineUrl" placeholder="Google Form 或 Google 試算表連結"></div></div><button class="good" onclick="connectOnline()">連結並同步</button><button onclick="syncOnline()">重新同步</button><button class="secondary" onclick="onlineHealth()">健康檢查</button></div>
<div id="review" class="panel" style="display:none"><h2>錄取審核</h2><div class="grid"><div class="span-4"><label>報名ID</label><input id="reviewRegId"></div><div class="span-4"><label>審核結果</label><select id="reviewResult"><option>通過</option><option>候補</option><option>不通過</option></select></div><div class="span-4"><label>審核理由</label><input id="reviewReason"></div></div><button class="good" onclick="updateReview()">更新審核</button></div>
<div id="roster" class="panel" style="display:none"><h2>名冊與學員資料庫</h2><div class="grid"><div class="span-4"><label>招生ID</label><input id="rosterSettingId"></div><div class="span-4"><label>場次ID</label><input id="rosterEventId"></div></div><button class="good" onclick="generateRoster()">產生學員名冊</button><button onclick="syncParticipantMaster()">同步學員資料庫</button><button class="secondary" onclick="queryParticipants()">查詢學員資料庫</button></div></section>
<section class="card span-12"><h2>招生設定</h2><div id="settingTable"></div></section>
<section class="card span-12"><h2>報名資料</h2><div id="registrationTable"></div></section>
<section class="card span-6"><h2>學員名冊</h2><div id="rosterTable"></div></section>
<section class="card span-6"><h2>學員資料庫</h2><div id="participantTable"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.userRole||u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function showPanel(id,btn){document.querySelectorAll('.panel').forEach(x=>x.style.display='none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).style.display='block';btn.classList.add('active')}
function table(id,rows,keys,empty){rows=rows||[];const box=document.getElementById(id);if(!rows.length){box.innerHTML='<div class="status">'+(empty||'無資料')+'</div>';return}box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,200).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function renderKpi(d){d=d||{};const reg=d.registrations||{};const p=d.participants||{};const items=[['報名',reg.total||0],['待審核',reg.pending||0],['已錄取',reg.accepted||0],['候補',reg.waitlist||0],['名冊',d.roster||0],['學員庫',p.total||0]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}
async function createSetting(){await api({action:'registration.setting.create',場次ID:val('setEventId'),標案ID:val('setTenderId'),活動名稱:val('setEventName'),活動日期:val('setEventDate'),招生對象:val('target'),名額上限:val('capacity'),候補名額:val('waitlist'),報名開始:val('startDate'),報名截止:val('endDate'),是否審核:val('needReview'),是否繳費:val('needPayment'),是否資格文件:val('needFile')},'mainResult');queryAll()}
async function createManualRegistration(){await api({action:'registration.intake.create',招生ID:val('regSettingId'),場次ID:val('regEventId'),姓名:val('name'),電話:val('phone'),Email:val('email'),LineID:val('lineId'),識別碼:val('identifier'),身分類別:val('identityType'),行銷同意:val('marketingConsent')},'mainResult');queryAll()}
async function dedupePreview(){await api({action:'participant.master.dedupePreview',姓名:val('name'),電話:val('phone'),Email:val('email'),LineID:val('lineId'),識別碼:val('identifier')},'mainResult')}
async function connectOnline(){await api({action:'registration.online.connect',招生ID:val('onlineSettingId'),場次ID:val('onlineEventId'),報名表URL:val('onlineUrl')},'mainResult');queryAll()}
async function syncOnline(){await api({action:'registration.online.sync',招生ID:val('onlineSettingId'),場次ID:val('onlineEventId')},'mainResult');queryAll()}
async function onlineHealth(){await api({action:'registration.online.health',招生ID:val('onlineSettingId'),場次ID:val('onlineEventId')},'mainResult')}
async function updateReview(){await api({action:'registration.review.update',報名ID:val('reviewRegId'),審核結果:val('reviewResult'),審核理由:val('reviewReason')},'mainResult');queryAll()}
async function generateRoster(){await api({action:'registration.roster.generate',招生ID:val('rosterSettingId'),場次ID:val('rosterEventId')},'mainResult');queryAll()}
async function syncParticipantMaster(){await api({action:'participant.master.syncRoster',招生ID:val('rosterSettingId'),場次ID:val('rosterEventId')},'mainResult');queryAll()}
async function querySettings(){const r=await api({action:'registration.setting.query',keyword:val('keyword')},'mainResult');table('settingTable',r.data&&r.data.rows,['招生ID','標案ID','場次ID','活動名稱','活動日期','招生對象','名額上限','報名開始','報名截止','招生狀態'],'無招生設定');return r.data||{}}
async function queryRegistrations(){const r=await api({action:'registration.intake.query',keyword:val('keyword')},'mainResult');table('registrationTable',r.data&&r.data.rows,['報名ID','招生ID','場次ID','姓名','電話','Email','報名狀態','審核狀態','錄取狀態','通知狀態'],'無報名資料');return r.data||{}}
async function queryRoster(){const r=await api({action:'registration.roster.query',keyword:val('keyword')},'mainResult');table('rosterTable',r.data&&r.data.rows,['名冊ID','姓名','電話','Email','活動名稱','活動日期','報到狀態','出席狀態','完訓狀態'],'無學員名冊');return r.data||{}}
async function queryParticipants(){const r=await api({action:'participant.master.query',keyword:val('keyword')},'mainResult');table('participantTable',r.data&&r.data.rows,['學員ID','姓名','電話','Email','LineID','累計報名次數','累計出席次數','累計完訓次數','最近活動名稱','CRM狀態'],'無學員資料');return r.data||{}}
async function queryAll(){const s=await querySettings();const r=await queryRegistrations();const ro=await queryRoster();const p=await queryParticipants();renderKpi({registrations:r.summary||{},roster:ro.total||0,participants:p.summary||{total:p.total||0}})}
queryAll();
</script>
</body>
</html>
