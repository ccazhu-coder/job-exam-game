<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps ERP｜結案交付中心</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:28px 22px}main{max-width:1280px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}label{display:block;font-weight:900;margin:10px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px}textarea{min-height:110px}button{border:0;border-radius:12px;padding:12px 14px;background:#1d4e89;color:#fff;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.good{background:#12805c}.secondary{background:#e8eef7;color:#1d3557}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:520px;overflow:auto}.ok{background:#ecfdf3;border-color:#12b76a}.bad{background:#fff8e6;border-color:#f2c94c}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){button{width:100%}.kpis{grid-template-columns:1fr}}</style></head><body><header><h1>GovOps ERP｜結案交付中心</h1><div>結案摘要、缺件檢查、結案主檔、交付包、結案報告與檔案匯出</div></header><main><section class="card"><div class="grid"><div class="span-6"><label>專案ID</label><input id="projectId"></div><div class="span-6"><label>關鍵字</label><input id="keyword" placeholder="可用專案名稱搜尋"></div><div class="span-12"><label>檢討與建議</label><textarea id="review" placeholder="輸入本案檢討、改善建議、後續追蹤事項"></textarea></div></div><button class="good" onclick="loadSummary()">結案摘要</button><button onclick="runCheck()">缺件檢查</button><button onclick="createClosing()">建立結案主檔</button><button onclick="createPackage()">建立交付包</button><button onclick="closingReport()">產生結案報告</button><button onclick="deliveryHtml()">產生HTML交付版</button><button class="good" onclick="exportHtmlFile()">匯出HTML檔</button><button class="good" onclick="exportWordFile()">匯出Word可開啟版</button><button onclick="exportPackageIndex()">匯出交付包索引</button><button class="secondary" onclick="location.href='./project-detail.html?projectId='+encodeURIComponent(val('projectId'))">回專案營運中心</button><button class="secondary" onclick="location.href='./projectops-home.html'">回ERP首頁</button><div id="kpiBox" class="kpis"></div><div id="result" class="status">請輸入專案ID後操作。</div></section><section class="card"><h2>結案資料總覽</h2><button onclick="loadProjectDetail()">載入專案資料</button><div id="tableBox"></div></section></main><script>const CONFIG_API_URL=(window.GOVOPS_CONFIG&&(window.GOVOPS_CONFIG.API_URL||window.GOVOPS_CONFIG.apiUrl))||'';const FALLBACK_API_URL='https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';const API_URL=CONFIG_API_URL||FALLBACK_API_URL;function $(id){return document.getElementById(id)}function val(id){return($(id)||{}).value||''}function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function base(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role,plan:u.plan,專案ID:val('projectId'),keyword:val('keyword'),檢討建議:val('review'),review:val('review')},x||{})}function show(x,cls){$('result').className='status '+(cls||'');$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function api(data,opt){opt=opt||{};if(!opt.silent)show('處理中...');try{let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}if(!opt.silent)show(res,res&&res.success?'ok':'bad');return res}catch(e){const out={success:false,message:'API呼叫失敗',data:{error:String(e)}};if(!opt.silent)show(out,'bad');return out}}function kpis(d){d=d||{};const items=[['報名',d.報名數||0],['名冊',d.名冊數||0],['出席率',d.出席率||0],['滿意度',d.滿意度平均||0],['成果附件',d.成果附件數||0],['核銷附件',d.核銷附件數||0]];$('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+safe(x[1])+'</div><div class="name">'+safe(x[0])+'</div></div>').join('')}async function loadSummary(){const r=await api(base({action:'project.closing.summary'}));if(r.success)kpis(r.data)}async function runCheck(){const r=await api(base({action:'project.closing.check'}));if(r.success){kpis(r.data.summary);renderChecks(r.data.checks)}}async function createClosing(){const r=await api(base({action:'project.closing.create'}));if(r.success)kpis(r.data.check.summary)}async function createPackage(){await api(base({action:'project.closing.package'}));loadProjectDetail()}async function closingReport(){await api(base({action:'project.document.closingReport'}))}async function deliveryHtml(){await api(base({action:'project.document.deliveryHtml'}))}async function exportHtmlFile(){await api(base({action:'project.export.closingHtmlFile'}))}async function exportWordFile(){await api(base({action:'project.export.closingWordFile'}))}async function exportPackageIndex(){await api(base({action:'project.export.deliveryPackageIndex'}))}async function loadProjectDetail(){const r=await api(base({action:'project.detail.get'}));if(r.success)renderDetail(r.data.detail)}function renderChecks(rows){$('tableBox').innerHTML='<h3>缺件檢查</h3>'+table(rows||[])}function renderDetail(d){if(!d){$('tableBox').innerHTML='';return}const groups=[['場次',d.events],['報名',d.registrations],['名冊',d.roster],['檔案',d.files],['財務',d.finance],['結案',d.closing]];$('tableBox').innerHTML=groups.map(g=>'<h3>'+g[0]+'（'+((g[1]||[]).length)+'）</h3>'+table(g[1]||[])).join('')}function table(rows){if(!rows.length)return'<div class="status">無資料</div>';const keys=Object.keys(rows[0]).filter(k=>k!=='_row').slice(0,7);return'<table><thead><tr>'+keys.map(k=>'<th>'+safe(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,50).map(r=>'<tr>'+keys.map(k=>'<td>'+safe(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function safe(x){return String(x===undefined||x===null?'':x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}const url=new URL(location.href);if(url.searchParams.get('projectId')){$('projectId').value=url.searchParams.get('projectId');loadSummary();}</script></body></html>
