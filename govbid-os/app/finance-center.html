<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps ERP｜財務會計中心</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:28px 22px}main{max-width:1280px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}label{display:block;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px}textarea{min-height:78px}button{border:0;border-radius:12px;padding:12px 14px;background:#1d4e89;color:#fff;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.good{background:#12805c}.secondary{background:#e8eef7;color:#1d3557}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:520px;overflow:auto}.ok{background:#ecfdf3;border-color:#12b76a}.bad{background:#fff8e6;border-color:#f2c94c}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#eef4ff;color:#173a63}.tab.active{background:#1d4e89;color:#fff}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc}@media(max-width:900px){.span-6,.span-4,.span-3{grid-column:span 12}}@media(max-width:520px){button{width:100%}}</style></head><body><header><h1>GovOps ERP｜財務會計中心</h1><div>人話記帳、自動會計判斷、專案對應、專案損益、月報、季報、年報與所得稅資料</div></header><main><section class="card"><div class="grid"><div class="span-4"><label>專案ID</label><input id="projectId" placeholder="可空白，系統會嘗試依描述對應"></div><div class="span-4"><label>場次ID</label><input id="eventId"></div><div class="span-4"><label>案源類型</label><select id="sourceType"><option></option><option>政府標案</option><option>自辦課程</option><option>合作課程</option><option>企業委託</option><option>其他</option></select></div></div><button class="secondary" onclick="location.href='./projectops-home.html'">回ERP首頁</button><button class="secondary" onclick="location.href='./project-detail.html?projectId='+encodeURIComponent(val('projectId'))">回專案營運中心</button><div id="result" class="status">財務中心待命中。</div></section><section class="card"><div class="tabs"><button class="tab active" onclick="showPanel('quick',this)">人話記帳</button><button class="tab" onclick="showPanel('linking',this)">專案對應</button><button class="tab" onclick="showPanel('projectFinance',this)">專案財務</button><button class="tab" onclick="showPanel('reports',this)">月季年報</button><button class="tab" onclick="showPanel('tax',this)">所得稅資料</button></div><div id="quick" class="panel"><h2>人話記帳</h2><div class="grid"><div class="span-3"><label>交易類型</label><select id="transactionType"><option>收入</option><option>支出</option><option>應收</option><option>應付</option><option>待判斷</option></select></div><div class="span-3"><label>金額</label><input id="amount" type="number"></div><div class="span-3"><label>日期</label><input id="date" type="date"></div><div class="span-3"><label>付款/收款方式</label><select id="method"><option>銀行存款</option><option>現金</option><option>LINE Pay</option><option>其他</option></select></div><div class="span-6"><label>對象</label><input id="target" placeholder="機關、學員、講師、廠商"></div><div class="span-6"><label>憑證URL</label><input id="voucherUrl"></div><div class="span-12"><label>人話描述</label><textarea id="description" placeholder="例如：收到彰化縣政府款項120000元；支付講師費6000元；便當店4500元還沒付"></textarea></div></div><button onclick="autoDetectProject()">先自動找專案</button><button onclick="autoClassify()">自動判斷會計</button><button class="good" onclick="autoPost()">自動入帳</button></div><div id="linking" class="panel" style="display:none"><h2>財務專案對應</h2><p>每筆帳都必須對應專案。找不到專案的帳會進入待對應清單，避免年度報稅與專案損益失真。</p><button onclick="autoDetectProject()">依目前描述自動對應專案</button><button onclick="linkSummary()">財務對應摘要</button><button onclick="unmatchedList()">待對應清單</button><button onclick="repairLinks()">重新比對待對應</button><div id="linkTable"></div></div><div id="projectFinance" class="panel" style="display:none"><h2>專案財務</h2><button onclick="projectPL()">專案損益</button><button onclick="financeSummary()">專案財務摘要</button></div><div id="reports" class="panel" style="display:none"><h2>月報 / 季報 / 年報</h2><div class="grid"><div class="span-4"><label>月份</label><input id="month" type="month"></div><div class="span-4"><label>年度</label><input id="year" type="number" value="2026"></div><div class="span-4"><label>季度</label><select id="quarter"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div><button onclick="monthlyReport()">產生月報</button><button onclick="quarterlyReport()">產生季報</button><button onclick="yearlyReport()">產生年報</button></div><div id="tax" class="panel" style="display:none"><h2>年度所得稅申報資料</h2><button onclick="incomeTax()">產生所得稅資料</button><button onclick="voucherList()">缺憑證檢查</button><button onclick="exportData()">報表匯出資料</button><div id="tableBox"></div></div></section></main><script>const CONFIG_API_URL=(window.GOVOPS_CONFIG&&(window.GOVOPS_CONFIG.API_URL||window.GOVOPS_CONFIG.apiUrl))||'';const FALLBACK_API_URL='https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';const API_URL=CONFIG_API_URL||FALLBACK_API_URL;function $(id){return document.getElementById(id)}function val(id){return($(id)||{}).value||''}function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function base(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role,plan:u.plan,專案ID:val('projectId'),projectId:val('projectId'),場次ID:val('eventId'),eventId:val('eventId'),案源類型:val('sourceType'),交易類型:val('transactionType'),金額:val('amount'),amount:val('amount'),日期:val('date'),date:val('date'),付款方式:val('method'),收款方式:val('method'),對象:val('target'),憑證URL:val('voucherUrl'),description:val('description'),描述:val('description'),項目:val('description'),keyword:val('description')},x||{})}function show(x,cls){$('result').className='status '+(cls||'');$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function api(data,opt){opt=opt||{};if(!opt.silent)show('處理中...');try{let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}if(!opt.silent)show(res,res&&res.success?'ok':'bad');return res}catch(e){const out={success:false,message:'API呼叫失敗',data:{error:String(e)}};if(!opt.silent)show(out,'bad');return out}}function showPanel(id,btn){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$(id).style.display='block';btn.classList.add('active')}async function autoDetectProject(){const r=await api(base({action:'project.finance.link.detectProject'}));if(r.success&&r.data&&r.data.matched&&r.data.project&&r.data.project.專案ID){$('projectId').value=r.data.project.專案ID;$('sourceType').value=r.data.project.案源類型||'';}}async function linkSummary(){await api(base({action:'project.finance.link.summary'}))}async function unmatchedList(){const r=await api(base({action:'project.finance.link.unmatchedList'}));if(r.success)$('linkTable').innerHTML='<h3>待對應清單</h3>'+table((r.data&&r.data.rows)||[])}async function repairLinks(){const r=await api(base({action:'project.finance.link.repair'}));if(r.success)unmatchedList()}async function autoClassify(){await api(base({action:'project.accounting.autoClassify'}))}async function autoPost(){await autoDetectProject();const type=val('transactionType');const action=type==='支出'?'project.accounting.autoPostExpense':type==='應收'?'project.accounting.autoPostReceivable':type==='應付'?'project.accounting.autoPostPayable':'project.accounting.autoPostIncome';await api(base({action:action}))}async function projectPL(){await api(base({action:'project.accounting.projectPL'}))}async function financeSummary(){await api(base({action:'project.finance.summary'}))}async function monthlyReport(){await api(base({action:'project.report.monthly',month:val('month')}))}async function quarterlyReport(){await api(base({action:'project.report.quarterly',year:val('year'),quarter:val('quarter')}))}async function yearlyReport(){await api(base({action:'project.report.yearly',year:val('year')}))}async function incomeTax(){const r=await api(base({action:'project.report.incomeTax',year:val('year')}));renderTax(r.data)}async function voucherList(){const r=await api(base({action:'project.report.voucherList',year:val('year')}));renderTax(r.data)}async function exportData(){await api(base({action:'project.report.exportData',year:val('year'),month:val('month')}))}function renderTax(d){if(!d){$('tableBox').innerHTML='';return}let html='';Object.keys(d).forEach(k=>{if(Array.isArray(d[k]))html+='<h3>'+safe(k)+'（'+d[k].length+'）</h3>'+table(d[k]);});$('tableBox').innerHTML=html}function table(rows){if(!rows.length)return'<div class="status">無資料</div>';const keys=Object.keys(rows[0]).filter(k=>k!=='_row').slice(0,7);return'<table><thead><tr>'+keys.map(k=>'<th>'+safe(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,50).map(r=>'<tr>'+keys.map(k=>'<td>'+safe(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function safe(x){return String(x===undefined||x===null?'':x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}const url=new URL(location.href);if(url.searchParams.get('projectId'))$('projectId').value=url.searchParams.get('projectId');$('year').value=new Date().getFullYear();$('month').value=new Date().toISOString().slice(0,7);</script></body></html>
