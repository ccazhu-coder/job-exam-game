<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜系統設定</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
<style>
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.settings-grid{grid-template-columns:1fr}}
.settings-card{background:var(--white);border:1.5px solid var(--gray-100);border-radius:12px;padding:18px 20px}
.settings-card h3{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}
.fi{margin-bottom:10px}.fi label{display:block;font-size:.76rem;font-weight:600;color:var(--navy-mid);margin-bottom:3px}
.fi input,.fi select,.fi textarea{width:100%;padding:8px 11px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:.86rem;font-family:var(--font);box-sizing:border-box}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--navy-mid)}
.fi textarea{min-height:60px;resize:vertical}
.save-btn{margin-top:10px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--gray-100);font-size:.84rem}
.info-row .ik{color:var(--gray-500)}
.info-row .iv{color:var(--navy);font-weight:600}
.danger-zone{background:#fff5f5;border:1.5px solid #fca5a5;border-radius:12px;padding:16px 20px;margin-top:16px}
.danger-zone h3{font-size:.88rem;font-weight:700;color:var(--danger);margin-bottom:8px}
.version-badge{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:3px 10px;font-size:.76rem;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">系統設定</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>系統設定</h1>
    <p style="color:var(--gray-500);font-size:.84rem;margin:0">設定組織資訊、API 連線、系統版本資訊</p>
  </div>

  <div class="settings-grid">
    <!-- 組織設定 -->
    <div class="settings-card">
      <h3>組織基本設定</h3>
      <div class="fi"><label>組織 / 工作室名稱</label><input id="s_orgName" placeholder="例：璞策顧問工作室"></div>
      <div class="fi"><label>預設主辦單位</label><input id="s_hostOrg" placeholder="例：彰化縣米穀商業同業公會"></div>
      <div class="fi"><label>承辦窗口</label><input id="s_contact" placeholder="負責人姓名"></div>
      <div class="fi"><label>聯絡電話</label><input id="s_phone" placeholder="04-XXXXXXXX"></div>
      <div class="fi"><label>Email</label><input id="s_email" type="email" placeholder="contact@example.com"></div>
      <div class="fi"><label>統一編號 / 身分證</label><input id="s_taxId" placeholder="用於領據抬頭"></div>
      <div class="fi"><label>地址</label><input id="s_address" placeholder="公司/工作室地址"></div>
      <button class="gold save-btn" onclick="saveOrgSettings()">儲存組織設定</button>
    </div>

    <!-- 系統連線設定 -->
    <div class="settings-card">
      <h3>系統連線設定</h3>
      <div class="fi"><label>Apps Script API URL</label>
        <input id="s_apiUrl" placeholder="https://script.google.com/macros/s/…/exec">
        <div style="font-size:.72rem;color:var(--gray-400);margin-top:3px">目前已在 config.js 設定，此欄可覆寫</div>
      </div>
      <div class="fi"><label>Google Sheets DB ID</label>
        <input id="s_sheetId" placeholder="Google Sheets 試算表 ID">
        <div style="font-size:.72rem;color:var(--gray-400);margin-top:3px">位於試算表網址 /d/XXX/ 的部分</div>
      </div>
      <div class="fi"><label>Google Drive 根資料夾 ID</label>
        <input id="s_driveFolder" placeholder="案件資料夾的父資料夾 ID（Drive 網址 /folders/XXX 的 XXX）">
        <div style="font-size:.72rem;color:var(--gray-400);margin-top:3px">設定後，建立案件資料夾時會在此資料夾下新增子資料夾</div>
      </div>
      <button class="secondary save-btn" onclick="saveDriveSettings()">儲存連線設定</button>
      <button class="secondary save-btn" onclick="testConnection()">測試 API 連線</button>
      <div id="connTest" style="margin-top:8px;font-size:.82rem"></div>
    </div>

    <!-- 帳號資訊 -->
    <div class="settings-card">
      <h3>目前帳號資訊</h3>
      <div id="profileInfo"><div style="color:var(--gray-400)">載入中…</div></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="secondary" onclick="editProfile()">修改帳號</button>
        <button class="secondary" style="color:var(--danger)" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 系統資訊 -->
    <div class="settings-card">
      <h3>系統資訊 <span class="version-badge">v0.1</span></h3>
      <div class="info-row"><span class="ik">系統名稱</span><span class="iv">GovOps OS Core v0.1</span></div>
      <div class="info-row"><span class="ik">定位</span><span class="iv">政府標案全流程營運系統</span></div>
      <div class="info-row"><span class="ik">後端</span><span class="iv">Google Apps Script</span></div>
      <div class="info-row"><span class="ik">前端</span><span class="iv">GitHub Pages</span></div>
      <div class="info-row"><span class="ik">資料庫</span><span class="iv">Google Sheets</span></div>
      <div class="info-row"><span class="ik">後端版本</span><span class="iv" id="backendVer">—</span></div>
      <div class="info-row"><span class="ik">API 狀態</span><span class="iv" id="apiStatus">—</span></div>
      <button class="secondary save-btn" style="font-size:.78rem" onclick="checkHealth()">健康檢查</button>
    </div>
  </div>

  <!-- 危險區域 -->
  <div class="danger-zone">
    <h3>⚠️ 危險操作</h3>
    <p style="font-size:.82rem;color:var(--danger);margin-bottom:10px">以下操作不可恢復，請謹慎使用。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="secondary" style="color:var(--danger);border-color:#fca5a5" onclick="initV01()">初始化 v0.1 資料表結構</button>
      <button class="secondary" style="color:var(--gray-500)" onclick="clearCache()">清除本機快取</button>
    </div>
    <div id="dangerResult" style="margin-top:8px;font-size:.82rem"></div>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
function safeJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function esc(v){return ERPALIGNED.esc(v);}
function init(){
  var _auth=safeJSON('govops_auth');if (!_auth || !_auth.sessionToken) { location.href = './login.html'; return; }
  document.getElementById('nav').innerHTML=ERPALIGNED.nav();ERPALIGNED.appendUserChip('header .wrap');
  loadProfile(p);loadOrgSettings();checkHealth();
}
function loadProfile(p){
  var el=document.getElementById('profileInfo');
  if(!p){el.innerHTML='<div style="color:var(--gray-400)">未登入</div>';return;}
  el.innerHTML=[
    ['使用者姓名', p.userName||'—'],['組織名稱', p.orgName||'—'],['Email', p.email||'—'],
    ['角色', p.roleLabel||p.role||'—'],['TenantID', (p.tenantId||'').substring(0,16)+'…']
  ].map(function(r){return '<div class="info-row"><span class="ik">'+esc(r[0])+'</span><span class="iv">'+esc(r[1])+'</span></div>';}).join('');
}
function loadOrgSettings(){
  var s=safeJSON('govops_org_settings')||{};
  ['s_orgName','s_hostOrg','s_contact','s_phone','s_email','s_taxId','s_address'].forEach(function(id){
    var key=id.replace('s_','');var el=document.getElementById(id);
    if(el&&s[key])el.value=s[key];
  });
  var conn=safeJSON('govops_conn_settings')||{};
  if(conn.apiUrl){var el=document.getElementById('s_apiUrl');if(el)el.value=conn.apiUrl;}
  if(conn.sheetId){var el=document.getElementById('s_sheetId');if(el)el.value=conn.sheetId;}
  if(conn.driveFolder){var el=document.getElementById('s_driveFolder');if(el)el.value=conn.driveFolder;}
}
function saveDriveSettings(){
  var conn={
    apiUrl:document.getElementById('s_apiUrl').value,
    sheetId:document.getElementById('s_sheetId').value,
    driveFolder:document.getElementById('s_driveFolder').value
  };
  localStorage.setItem('govops_conn_settings',JSON.stringify(conn));
  // Also save driveFolder to backend
  if(conn.driveFolder){
    ERPALIGNED.api({action:'saveSetting',key:'driveFolderId',value:conn.driveFolder}).then(function(r){
      if(r.success)alert('✅ 連線設定已儲存，Drive 資料夾 ID 已同步到後端');
      else alert('✅ 連線設定已儲存（本機），後端同步失敗：'+r.message);
    });
  } else {
    alert('✅ 連線設定已儲存');
  }
}
function saveOrgSettings(){
  var s={};
  ['s_orgName','s_hostOrg','s_contact','s_phone','s_email','s_taxId','s_address'].forEach(function(id){
    var key=id.replace('s_','');s[key]=document.getElementById(id).value;
  });
  localStorage.setItem('govops_org_settings',JSON.stringify(s));
  alert('✅ 組織設定已儲存');
}
async function testConnection(){
  document.getElementById('connTest').textContent='測試中…';
  var r=await ERPALIGNED.api({action:'系統健康檢查'});
  document.getElementById('connTest').textContent=r.success?'✅ API 連線正常':'❌ 連線失敗：'+(r.message||r.error||'未知錯誤');
}
async function checkHealth(){
  var r=await ERPALIGNED.api({action:'系統健康檢查'});
  document.getElementById('apiStatus').textContent=r.success?'✅ 正常':'❌ 異常';
  document.getElementById('backendVer').textContent=r.data&&r.data.version?'@'+r.data.version:'—';
}
function editProfile(){
  ['govops_profile','govops_auth'].forEach(function(k){localStorage.removeItem(k);});
  location.href='./dashboard.html';
}
function logout(){
  ['govops_profile','govops_auth'].forEach(function(k){localStorage.removeItem(k);});
  location.href='./dashboard.html';
}
async function initV01(){
  if(!confirm('確定要初始化 v0.1 資料表結構？\n\n這將在 Google Sheets 中建立新的工作表，不會刪除現有資料。'))return;
  var r=await ERPALIGNED.api({action:'正式平台初始化v01'});
  document.getElementById('dangerResult').innerHTML=r.success?'<span style="color:#166534">✅ 初始化完成：'+esc(r.message)+'</span>':'<span style="color:var(--danger)">❌ 失敗：'+esc(r.message)+'</span>';
}
function clearCache(){
  var keys=['govops_cases_cache','govops_sessions_cache'];
  keys.forEach(function(k){localStorage.removeItem(k);});
  document.getElementById('dangerResult').innerHTML='<span style="color:#166534">✅ 快取已清除</span>';
}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
