<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜CRM 學員管理</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜CRM 學員管理</div><div class="sub">對齊：04_學員CRM／03_報名資料｜每個模組必備：新增、修改、查詢</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span6"><h2>新增學員／報名資料</h2><form id="createForm"><label>活動ID＊</label><input name="活動ID" required><label>姓名＊</label><input name="姓名" required><div class="row"><div><label>電話＊</label><input name="電話" required></div><div><label>Email</label><input name="Email" type="email"></div></div><div class="row"><div><label>身分別</label><input name="身分別"></div><div><label>服務單位</label><input name="服務單位"></div></div><label>來源渠道</label><input name="來源渠道" placeholder="表單、LINE、電話、現場"><label>備註</label><textarea name="備註"></textarea><button>新增報名／同步CRM</button></form><div id="createMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>修改學員資料</h2><form id="updateForm"><label>學員ID／CRM ID</label><input name="crmPersonId"><label>姓名</label><input name="姓名"><div class="row"><div><label>電話</label><input name="電話"></div><div><label>Email</label><input name="Email" type="email"></div></div><label>服務單位</label><input name="服務單位"><label>標籤</label><input name="tags" placeholder="例如：米穀會員,講座學員"><label>備註</label><textarea name="備註"></textarea><button class="green">修改學員</button></form><div id="updateMsg" class="msg">尚未修改。</div></section><section class="card span12"><h2>查詢學員 CRM</h2><div class="hint">可查姓名、電話、Email、服務單位、標籤、來源。</div><div class="row"><input id="keyword" placeholder="關鍵字"><button onclick="queryCRM()">查詢學員</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function obj(id,action){const fd=new FormData(document.getElementById(id));const o={action};fd.forEach((v,k)=>{if(v)o[k]=v});return o}document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('createForm','新增報名'),'createMsg');queryCRM();});document.getElementById('updateForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('updateForm','修改學員CRM'),'updateMsg');queryCRM();});async function queryCRM(){const r=await ERPALIGNED.api({action:'查詢學員CRM',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}queryCRM();</script></body></html>
