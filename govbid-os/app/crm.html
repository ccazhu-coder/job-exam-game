<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜CRM 學員管理</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">對齊：04_學員CRM／03_報名資料</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>CRM 學員管理</h1>
    <p>報名資料自動同步 CRM；查詢結果點「編輯」修改學員資料</p>
  </div>
  <div class="grid">
    <section class="card span4">
      <h2>新增報名／同步 CRM</h2>
      <div class="hint">新增後自動去重寫入 CRM，同一電話不重複建立</div>
      <form id="createForm">
        <div class="form-row">
          <div class="field"><label>活動ID＊</label><input name="活動ID" required placeholder="ACT-…"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>姓名＊</label><input name="姓名" required></div>
          <div class="field"><label>電話＊</label><input name="電話" required type="tel"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Email</label><input name="Email" type="email"></div>
          <div class="field"><label>身分別</label><input name="身分別" placeholder="就業者、在職者…"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>服務單位</label><input name="服務單位"></div>
          <div class="field"><label>來源渠道</label><input name="來源渠道" placeholder="表單、LINE、電話…"></div>
        </div>
        <label>備註</label><textarea name="備註" rows="2"></textarea>
        <div class="btns"><button type="submit">新增報名／同步 CRM</button></div>
      </form>
      <div id="createMsg" class="msg" style="margin-top:8px">尚未新增。</div>
    </section>

    <section class="card span8">
      <h2>查詢學員 CRM</h2>
      <div class="form-row">
        <div class="field"><input id="keyword" placeholder="姓名、電話、Email、服務單位、來源" onkeydown="if(event.key==='Enter')queryCRM()"></div>
        <div class="field" style="max-width:110px"><button onclick="queryCRM()">查詢</button></div>
      </div>
      <div id="queryMsg" class="msg">尚未查詢。</div>
      <div id="table" style="margin-top:8px"></div>
    </section>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const o = {action:'新增報名'}; fd.forEach((v,k)=>{if(v)o[k]=v;});
  const r = await ERPALIGNED.api(o, 'createMsg');
  if (r && r.success) { e.target.reset(); queryCRM(); }
});

const CRM_EDIT_FIELDS = [
  {name:'CRM_ID', label:'CRM ID', readonly:true},
  {name:'姓名', label:'姓名'},
  {name:'電話', label:'電話', type:'tel'},
  {name:'Email', label:'Email', type:'email'},
  {name:'身分別', label:'身分別'},
  {name:'服務單位', label:'服務單位'},
  {name:'來源渠道', label:'來源渠道'},
  {name:'tags', label:'標籤', type:'textarea'},
  {name:'備註', label:'備註', type:'textarea'}
];

function openCrmEdit(row) {
  ERPALIGNED.showEditModal('編輯學員：' + (row['姓名']||''), CRM_EDIT_FIELDS, row, '修改學員CRM', 'CRM_ID', queryCRM);
}

async function queryCRM() {
  const r = await ERPALIGNED.api({action:'查詢學員CRM', keyword: document.getElementById('keyword').value}, 'queryMsg');
  ERPALIGNED.renderTableWithEdit(r, 'table', openCrmEdit,
    ['CRM_ID','姓名','電話','Email','服務單位','來源渠道','建立時間']);
}

queryCRM();
</script>
</body>
</html>
