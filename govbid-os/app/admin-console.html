<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政務營運系統｜管理控制台</title>
  <script src="./config.js?v=p0-api"></script>
  <script src="./saas-runtime.js"></script>
  <script src="./govops-api-client.js?v=p0-api"></script>
  <script src="./session-guard.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #047857;
      --warning: #b45309;
      --danger: #b91c1c;
      --radius: 18px;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top left, #eef4ff 0, #f6f7fb 32%, #f8fafc 100%);
      color: var(--text);
      line-height: 1.55;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding: 24px;
      border-radius: 26px;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
    }

    .profile {
      min-width: 220px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 14px;
    }

    .profile div { margin: 4px 0; }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.18);
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 14px 24px rgba(29, 78, 216, 0.22); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    button.secondary { background: #334155; box-shadow: 0 10px 20px rgba(51, 65, 85, 0.12); }
    button.danger { background: #b91c1c; box-shadow: 0 10px 20px rgba(185, 28, 28, 0.12); }

    .notice {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--primary-soft);
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      font-weight: 650;
    }

    .notice.show { display: block; }
    .notice.error { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
    .notice.success { background: #ecfdf5; color: var(--success); border-color: #bbf7d0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .card {
      grid-column: span 6;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card.full { grid-column: span 12; }
    .card.third { grid-column: span 4; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .card-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #f1f5f9;
      color: #334155;
      white-space: nowrap;
    }

    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.risk { background: #fee2e2; color: #991b1b; }

    .card-body { padding: 16px 18px; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kpi {
      padding: 14px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .kpi .label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .kpi .value { font-size: 24px; font-weight: 900; margin-top: 4px; }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
    }

    .row-title { font-weight: 800; }
    .row-sub { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-word; }

    pre {
      margin: 0;
      padding: 14px;
      max-height: 360px;
      overflow: auto;
      border-radius: 14px;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      color: var(--muted);
      padding: 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
    }

    .deny {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .deny-card {
      max-width: 520px;
      width: 100%;
      padding: 28px;
      border-radius: 24px;
      background: white;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      text-align: center;
    }

    .deny-card h1 { margin: 0 0 10px; }
    .deny-card p { color: var(--muted); }

    @media (max-width: 980px) {
      .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card, .card.third { grid-column: span 12; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .hero { flex-direction: column; }
      .profile { width: 100%; }
    }

    @media (max-width: 560px) {
      .app { padding: 14px; }
      .toolbar { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: 1fr; }
      .hero { padding: 20px; border-radius: 22px; }
      .card-header { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app" style="display:none;">
    <section class="hero">
      <div>
        <h1>管理控制台</h1>
        <p>正式商用營運控制中心｜系統健康、復原、組織、帳務、功能與使用量統一管理</p>
      </div>
      <div class="profile" id="profileBox">
        <div>登入狀態檢查中...</div>
      </div>
    </section>

    <div id="notice" class="notice"></div>

    <section class="toolbar">
      <button onclick="runSelfCheck()">執行正式環境自檢</button>
      <button onclick="runRecovery()">執行系統復原檢查</button>
      <button onclick="loadTenantStatus()">查詢租戶狀態</button>
      <button onclick="loadBillingSummary()">查詢帳單狀態</button>
      <button onclick="loadFeatureMatrix()">查詢功能權限</button>
      <button onclick="loadApiUsage()">查詢服務使用量</button>
      <button class="danger" onclick="logout()">登出</button>
    </section>

    <section class="grid">
      <div class="card full">
        <div class="card-header">
          <h2>系統狀態</h2>
          <span id="systemBadge" class="badge">尚未檢查</span>
        </div>
        <div class="card-body">
          <div class="kpis" id="kpiBox"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h2>系統依賴狀態</h2><span id="runtimeBadge" class="badge">待檢查</span></div>
        <div class="card-body"><div id="runtimeDependencies" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>正式環境健康摘要</h2><span class="badge">摘要</span></div>
        <div class="card-body"><div id="snapshotBox" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>組織營運狀態</h2><span class="badge">組織</span></div>
        <div class="card-body"><div id="tenantStatus" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>錯誤分析</h2><span id="errorBadge" class="badge">錯誤</span></div>
        <div class="card-body"><div id="errorAnalytics" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>復原報告</h2><span id="recoveryBadge" class="badge">復原</span></div>
        <div class="card-body"><div id="recoveryReport" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>帳務摘要</h2><span id="billingBadge" class="badge">帳務</span></div>
        <div class="card-body"><div id="billingSummary" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>功能權限</h2><span class="badge">功能</span></div>
        <div class="card-body"><div id="featureMatrix" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>服務使用量摘要</h2><span class="badge">使用量</span></div>
        <div class="card-body"><div id="apiUsage" class="list"><div class="empty">尚未載入資料</div></div></div>
      </div>

      <div class="card full">
        <div class="card-header"><h2>操作摘要</h2><span class="badge">安全摘要</span></div>
        <div class="card-body"><pre id="rawBox">尚未執行操作</pre></div>
      </div>
    </section>
  </div>

  <div id="deny" class="deny" style="display:none;">
    <div class="deny-card">
      <h1>你沒有系統管理權限</h1>
      <p>此頁面僅允許負責人或管理者使用。</p>
      <button onclick="logout()">返回登入</button>
    </div>
  </div>

  <script>
    var state = {
      session: null,
      profile: null,
      auth: null,
      dashboard: null
    };

    document.addEventListener('DOMContentLoaded', function() {
      boot();
    });

    async function boot() {
      try {
        state.session = readSession();
        if (!isLocalDemoSession() && window.GovOpsSessionGuard && typeof GovOpsSessionGuard.verify === 'function') {
          await GovOpsSessionGuard.verify();
          state.session = readSession();
        }
        if (!isAdmin(state.session)) {
          showDeny();
          return;
        }
        document.getElementById('app').style.display = 'block';
        renderProfile();
        if (isLocalDemoSession() || isLocalDevHost()) {
          loadLocalDemoDashboard();
          return;
        }
        await loadDashboard();
      } catch (err) {
        state.session = state.session || readSession();
        if (isAdmin(state.session)) {
          document.getElementById('app').style.display = 'block';
          document.getElementById('deny').style.display = 'none';
          renderProfile();
          loadLocalDemoDashboard();
          return;
        }
        showNotice('登入狀態驗證失敗，請重新登入。', 'error');
        setTimeout(function() { location.href = './login.html'; }, 900);
      }
    }

    function readSession() {
      var profile = safeJson(localStorage.getItem('govops_profile')) || {};
      var auth = safeJson(localStorage.getItem('govops_auth')) || {};
      state.profile = profile;
      state.auth = auth;
      return Object.assign({}, profile, auth);
    }

    function isAdmin(session) {
      var role = String((session && (session.userRole || session.role || session['使用者角色'])) || '').toLowerCase();
      return role === 'owner' || role === 'admin';
    }

    function isLocalDemoSession() {
      var auth = state.auth || {};
      var session = state.session || {};
      var token = String(auth.sessionToken || auth.token || session.sessionToken || session.token || '');
      var email = String(auth.email || session.email || '').toLowerCase();
      return token.indexOf('LOCAL-DEMO-') === 0 || email === 'demo@govops.local' || email === 'test@example.local';
    }

    function isLocalDevHost() {
      return /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    }

    function loadLocalDemoDashboard() {
      var s = state.session || {};
      var data = {
        runtimeDependencies: {
          ok: 3,
          total: 3,
          dependencies: [
            { runtimeName: '登入狀態', status: '正常', description: '本機測試登入' },
            { runtimeName: '營運首頁', status: '正常', description: '前台路由已驗證' },
            { runtimeName: '資料服務', status: '測試', description: '本機測試不呼叫正式資料服務' }
          ]
        },
        latestSnapshot: { systemStatus: '測試', tenantCount: 1, errorCount: 0 },
        tenantStatus: { tenants: [{ tenantId: s.tenantId || 'TENANT-DEMO', organizationName: s.workspaceName || s.orgName || '測試工作區', status: 'ACTIVE', plan: s.planId || s.plan || 'pro' }] },
        errorAnalytics: { errorCount: 0, latest: [] },
        recommendations: ['測試模式未呼叫正式資料服務。'],
        warnings: []
      };
      renderDashboard(data);
      renderRaw({ success: true, message: '本機測試管理控制台已載入', data: data });
      showNotice('本機測試管理控制台已載入。', 'success');
      setBusy(false);
    }

    function showDeny() {
      document.getElementById('app').style.display = 'none';
      document.getElementById('deny').style.display = 'flex';
    }

    function renderProfile() {
      var s = state.session || {};
      var html = '';
      html += '<div><strong>' + escapeHtml(s.organizationName || s['組織名稱'] || '政務營運系統') + '</strong></div>';
      html += '<div>使用者：' + escapeHtml(s.ownerName || s.userName || s.name || '管理者') + '</div>';
      html += '<div>角色：' + escapeHtml(displayStatus(s.userRole || s.role || 'owner')) + '</div>';
      html += '<div>方案：' + escapeHtml(displayStatus(s.plan || 'free')) + '</div>';
      html += '<div>組織狀態：' + escapeHtml(s.tenantId ? '已綁定' : '未綁定') + '</div>';
      document.getElementById('profileBox').innerHTML = html;
    }

    function sessionPayload(extra) {
      var s = state.session || readSession() || {};
      return Object.assign({
        tenantId: s.tenantId || '',
        userId: s.userId || '',
        userRole: s.userRole || s.role || '',
        plan: s.plan || '',
        email: s.email || '',
        phone: s.phone || ''
      }, extra || {});
    }

    async function request(action, payload) {
      if (!window.GovOpsAPI || typeof GovOpsAPI.request !== 'function') {
        return { success: false, message: '資料服務尚未載入。', data: {} };
      }
      try {
        return await GovOpsAPI.request(Object.assign({ action: action }, sessionPayload(payload)));
      } catch (err) {
        return { success: false, message: '系統暫時無法完成操作，請稍後再試。', data: {} };
      }
    }

    async function loadDashboard() {
      setBusy(true);
      showNotice('正在載入管理控制台...', '');
      var res = await request('getProductionHealthDashboard');
      state.dashboard = res;
      renderRaw(res);
      if (!res.success) {
        showNotice(res.message || '管理控制台載入失敗。', 'error');
        setBusy(false);
        return;
      }
      renderDashboard(res.data || {});
      showNotice('管理控制台已載入。', 'success');
      setBusy(false);
    }

    async function runSelfCheck() {
      setBusy(true);
      var res = await request('runProductionSelfCheck');
      renderRaw(res);
      if (res.success) {
        showNotice('正式環境自檢已完成。', 'success');
        await loadDashboard();
      } else showNotice(res.message || '正式環境自檢失敗。', 'error');
      setBusy(false);
    }

    async function runRecovery() {
      setBusy(true);
      var repair = await request('repairRuntimeHealth');
      var report = await request('createRecoveryReport');
      renderRaw({ repair: repair, report: report });
      renderRecovery(report.data || {});
      showNotice(repair.success ? '系統復原檢查已完成。' : (repair.message || '系統復原檢查失敗。'), repair.success ? 'success' : 'error');
      setBusy(false);
    }

    async function loadTenantStatus() {
      setBusy(true);
      var res = await request('getTenantLifecycleState');
      if (!res.success) res = await request('檢查租戶狀態');
      renderRaw(res);
      renderTenantStatus(res.data && (res.data.tenants || res.data.租戶) ? res.data : { tenants: [res.data || {}] });
      showNotice(res.success ? '租戶狀態已更新。' : (res.message || '租戶狀態查詢失敗。'), res.success ? 'success' : 'error');
      setBusy(false);
    }

    async function loadBillingSummary() {
      setBusy(true);
      var res = await request('getTenantBillingSummary');
      renderRaw(res);
      renderBilling(res.data || {});
      showNotice(res.success ? '帳單狀態已更新。' : (res.message || '帳單狀態查詢失敗。'), res.success ? 'success' : 'error');
      setBusy(false);
    }

    async function loadFeatureMatrix() {
      setBusy(true);
      var res = await request('getTenantFeatureMatrix');
      renderRaw(res);
      renderFeatures(res.data || {});
      showNotice(res.success ? '功能權限已更新。' : (res.message || '功能權限查詢失敗。'), res.success ? 'success' : 'error');
      setBusy(false);
    }

    async function loadApiUsage() {
      setBusy(true);
      var res = await request('getAPIUsageSummary');
      renderRaw(res);
      renderApiUsage(res.data || {});
      showNotice(res.success ? '服務使用量已更新。' : (res.message || '服務使用量查詢失敗。'), res.success ? 'success' : 'error');
      setBusy(false);
    }

    function renderDashboard(data) {
      renderKpis(data);
      renderDependencies(data.runtimeDependencies || {});
      renderSnapshot(data.latestSnapshot || {});
      renderTenantStatus(data.tenantStatus || {});
      renderErrors(data.errorAnalytics || {});
      renderRecovery({ recommendations: data.recommendations || [], warnings: data.warnings || [], status: (data.warnings || []).length ? 'WARNING' : 'OK' });
      if (data.warnings && data.warnings.length) showNotice('系統有項目需要管理者確認。', 'error');
    }

    function renderKpis(data) {
      var dep = data.runtimeDependencies || {};
      var err = data.errorAnalytics || {};
      var tenants = data.tenantStatus && data.tenantStatus.tenants ? data.tenantStatus.tenants : [];
      var snap = data.latestSnapshot || {};
      var cards = [
        ['系統狀態', snap['系統狀態'] || '待檢查'],
        ['系統依賴正常', (dep.ok || 0) + '/' + (dep.total || 0)],
        ['租戶數', tenants.length || snap['tenant數'] || 0],
        ['錯誤數', err.errorCount || snap.errorCount || 0]
      ];
      document.getElementById('kpiBox').innerHTML = cards.map(function(c) {
        return '<div class="kpi"><div class="label">' + escapeHtml(c[0]) + '</div><div class="value">' + escapeHtml(c[1]) + '</div></div>';
      }).join('');
      setBadge('systemBadge', snap['系統狀態'] || 'UNKNOWN');
    }

    function renderDependencies(data) {
      var list = data.dependencies || [];
      setBadge('runtimeBadge', data.missing ? 'WARNING' : 'OK');
      document.getElementById('runtimeDependencies').innerHTML = list.length ? list.map(function(r) {
        return row('系統依賴', displayStatus(r['狀態'] || r.status || '-'), safeText(r['錯誤訊息'] || r.message || ''));
      }).join('') : empty('尚無系統依賴資料');
    }

    function renderSnapshot(data) {
      document.getElementById('snapshotBox').innerHTML = Object.keys(data || {}).length ? [
        row('系統狀態', displayStatus(data['系統狀態'] || data.status || data.health || '-'), ''),
        row('租戶數', data['tenant數'] || data.tenantCount || data.tenants || 0, ''),
        row('錯誤數', data.errorCount || data['錯誤數'] || 0, '')
      ].join('') : empty('尚無健康摘要');
    }

    function renderTenantStatus(data) {
      var tenants = Array.isArray(data.tenants) ? data.tenants : [];
      if (!tenants.length && data.租戶) tenants = [data.租戶];
      document.getElementById('tenantStatus').innerHTML = tenants.length ? tenants.map(function(t) {
        return row(safeText(t['組織名稱'] || t.organizationName || '組織'), '狀態：' + displayStatus(t['狀態'] || t.status || t.tenantStatus || '-'), '方案：' + displayStatus(t.plan || '-') + '｜帳務：' + displayStatus(t.billingState || '-'));
      }).join('') : empty('尚無租戶狀態資料');
    }

    function renderErrors(data) {
      setBadge('errorBadge', Number(data.errorCount || 0) > 0 ? 'RISK' : 'OK');
      var latest = data.latest || [];
      document.getElementById('errorAnalytics').innerHTML = latest.length ? latest.map(function(e) {
        return row('待處理項目', safeText(e['錯誤訊息'] || e.message || '需要管理者確認'), '');
      }).join('') : empty('目前沒有錯誤分析資料');
    }

    function renderRecovery(data) {
      setBadge('recoveryBadge', data.status || 'UNKNOWN');
      var items = [];
      (data.warnings || []).forEach(function(x) { items.push(row('警示', safeText(x), '')); });
      (data.recommendations || []).forEach(function(x) { items.push(row('建議', safeText(x), '')); });
      if (data.missingTables && data.missingTables.length) items.push(row('缺少資料表', data.missingTables.length + ' 項', ''));
      if (data.missingFunctions && data.missingFunctions.length) items.push(row('缺少功能', data.missingFunctions.length + ' 項', ''));
      document.getElementById('recoveryReport').innerHTML = items.length ? items.join('') : empty('尚無復原報告');
    }

    function renderBilling(data) {
      setBadge('billingBadge', data.billingState || 'UNKNOWN');
      document.getElementById('billingSummary').innerHTML = Object.keys(data || {}).length ? [
        row('方案', displayStatus(data.plan || '-'), '組織狀態：' + (data.tenantId ? '已綁定' : '未綁定')),
        row('帳務狀態', displayStatus(data.billingState || '-'), '下次帳單日：' + (data.nextBillingDate || '-')),
        row('帳單統計', '未付：' + (data.unpaidInvoices || 0) + '｜已付：' + (data.paidInvoices || 0) + '｜逾期：' + (data.overdueInvoices || 0), '總收入：' + (data.totalRevenue || 0))
      ].join('') : empty('尚無帳單狀態資料');
    }

    function renderFeatures(data) {
      var features = data.features || [];
      document.getElementById('featureMatrix').innerHTML = features.length ? features.map(function(f) {
        return row(safeText(f.featureName || '功能項目'), f.enabled ? '已啟用' : '未啟用', '方案：' + displayStatus(f.currentPlan || '-') + ' / 最低：' + displayStatus(f.minPlan || '-') + '｜來源：' + displayStatus(f.source || '-'));
      }).join('') : empty('尚無功能權限資料');
    }

    function renderApiUsage(data) {
      document.getElementById('apiUsage').innerHTML = Object.keys(data || {}).length ? [
        row('服務呼叫總數', data.total || 0, '成功：' + (data.success || 0) + '｜失敗：' + (data.failed || 0)),
        row('平均回應時間', (data.avgLatency || 0) + ' 毫秒', '組織狀態：' + (data.tenantId ? '已綁定' : '未綁定'))
      ].join('') : empty('尚無服務使用量資料');
    }

    function setBadge(id, status) {
      var el = document.getElementById(id);
      if (!el) return;
      var s = String(status || 'UNKNOWN').toUpperCase();
      el.textContent = s;
      el.className = 'badge';
      el.textContent = displayStatus(s);
      if (['OK','HEALTHY','GOOD_STANDING','ACTIVE','ENABLED'].indexOf(s) >= 0) el.classList.add('ok');
      else if (['WARNING','MISSING_DEPENDENCIES','PAST_DUE','UNKNOWN'].indexOf(s) >= 0) el.classList.add('warn');
      else el.classList.add('risk');
    }

    function row(title, value, sub) {
      return '<div class="row"><div><div class="row-title">' + escapeHtml(title) + '</div><div class="row-sub">' + escapeHtml(value) + '</div>' + (sub ? '<div class="row-sub">' + escapeHtml(sub) + '</div>' : '') + '</div></div>';
    }

    function displayStatus(value) {
      var map = {
        OK: '正常',
        HEALTHY: '健康',
        GOOD_STANDING: '正常',
        ACTIVE: '啟用中',
        ENABLED: '已啟用',
        WARNING: '需注意',
        MISSING_DEPENDENCIES: '缺少依賴',
        PAST_DUE: '逾期',
        UNKNOWN: '尚未確認',
        RISK: '風險',
        DEMO: '測試',
        ENTERPRISE: '企業版',
        PRO: '專業版',
        FREE: '免費版',
        OWNER: '負責人',
        ADMIN: '管理者',
        FINANCE: '財務',
        STAFF: '作業人員',
        VIEWER: '唯讀'
      };
      var key = String(value === undefined || value === null ? '' : value).toUpperCase();
      return map[key] || safeText(value) || '-';
    }

    function safeText(value) {
      var text = String(value === undefined || value === null ? '' : value);
      if (!text) return '';
      if (/[A-Za-z]{2,}|https?:|script\.google|exception|stack|undefined|JSON|API|Backend|Debug/i.test(text)) return '已隱藏系統細節';
      return text;
    }

    function empty(text) {
      return '<div class="empty">' + escapeHtml(text) + '</div>';
    }

    function renderRaw(data) {
      var ok = data && data.success !== false;
      document.getElementById('rawBox').textContent = (ok ? '操作已完成。' : '操作未完成。') + '\n' + safeText(data && data.message ? data.message : '已隱藏系統原始回應資料。');
    }

    function showNotice(text, type) {
      var el = document.getElementById('notice');
      el.textContent = safeText(text || '');
      el.className = 'notice show';
      if (type) el.classList.add(type);
    }

    function setBusy(busy) {
      Array.prototype.forEach.call(document.querySelectorAll('button'), function(btn) {
        btn.disabled = !!busy;
      });
    }

    function logout() {
      if (window.GovOpsSessionGuard && typeof GovOpsSessionGuard.logout === 'function') {
        GovOpsSessionGuard.logout();
        return;
      }
      localStorage.removeItem('govops_profile');
      localStorage.removeItem('govops_auth');
      localStorage.removeItem('govops_usage');
      location.href = './login.html';
    }

    function safeJson(text) {
      try { return text ? JSON.parse(text) : {}; } catch (err) { return {}; }
    }

    function escapeHtml(v) {
      return String(v === undefined || v === null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
