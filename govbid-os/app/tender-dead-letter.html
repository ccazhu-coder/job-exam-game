<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜標案死信佇列監控台</title>
<script src="./config.js"></script>
<script src="./saas-runtime.js"></script>
<script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#3b0a0a,#9b1c1c);color:white;padding:30px 20px}.wrap{max-width:1180px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}label{display:block;font-weight:900;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}textarea{min-height:100px}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#9b1c1c;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}@media(max-width:900px){.span-6{grid-column:span 12}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>標案死信佇列監控台</h1><div class="sub">Dead Letter Queue｜處理壞檔、權限錯誤、重試失敗與人工修復。</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>死信佇列總覽</h2><label>關鍵字 / 標案ID</label><input id="keyword"><button onclick="queryDeadLetter()">查詢死信</button><button onclick="sweepDeadLetter()">掃描失敗轉死信</button><button class="secondary" onclick="location.href='./tender-queue-monitor.html'">回 Queue 監控台</button><button class="secondary" onclick="location.href='./tender-erp.html'">回標案 ERP</button><div id="queryResult" class="status">尚未查詢。</div></section>
<section class="card span-6"><h2>人工處理</h2><label>死信ID</label><input id="deadId"><label>處理狀態</label><select id="resolveStatus"><option>已處理</option><option>不處理</option><option>等待補檔</option><option>已重新上傳</option></select><label>人工處理結果</label><textarea id="resolveResult"></textarea><button class="good" onclick="resolveDeadLetter()">標記已處理</button><button onclick="requeueDeadLetter()">重新排入 Queue</button><div id="resolveBox" class="status">尚未操作。</div></section>
<section class="card span-6"><h2>修復建議</h2><div class="status">常見處理方式：
1. Drive 權限錯誤：確認檔案分享權限。
2. 檔案損毀：請重新上傳。
3. 掃描檔不清楚：改上傳清晰 PDF。
4. 文件類型錯誤：更新文件類型後重新排入。
5. 重複檔案：標記不處理。
</div></section>
<section class="card span-12"><h2>死信明細</h2><div id="tableBox"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.userRole||u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function render(rows){rows=rows||[];const box=document.getElementById('tableBox');if(!rows.length){box.innerHTML='<div class="status">無死信資料</div>';return}const keys=['死信ID','標案ID','標案名稱','文件類型','檔案名稱','失敗階段','失敗原因','重試次數','處理狀態','人工處理結果'];box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function queryDeadLetter(){const r=await api({action:'tender.queue.deadLetter.query',keyword:val('keyword')},'queryResult');render(r.data&&r.data.rows)}
async function sweepDeadLetter(){await api({action:'tender.queue.deadLetter.sweep',maxRetry:3},'queryResult');queryDeadLetter()}
async function resolveDeadLetter(){await api({action:'tender.queue.deadLetter.resolve',死信ID:val('deadId'),處理狀態:val('resolveStatus'),人工處理結果:val('resolveResult')},'resolveBox');queryDeadLetter()}
async function requeueDeadLetter(){await api({action:'tender.queue.deadLetter.requeue',死信ID:val('deadId')},'resolveBox');queryDeadLetter()}
queryDeadLetter();
</script>
</body>
</html>
