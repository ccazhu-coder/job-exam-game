<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜結案交付包工作台</title>
<script src="./config.js"></script>
<script src="./saas-runtime.js"></script>
<script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:white;padding:30px 20px}.wrap{max-width:1180px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}a{color:#1d4e89;font-weight:800}@media(max-width:900px){.span-6{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>結案交付包工作台</h1><div class="sub">Closing Package｜Word、PDF、成果照片、簽到表、核銷附件、驗收資料與缺件狀態。</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>交付包產生與查詢</h2><label>標案ID / 關鍵字</label><input id="keyword"><label>標案名稱</label><input id="tenderName"><label>Drive資料夾URL</label><input id="folderUrl" placeholder="可貼上結案資料夾連結"><button class="good" onclick="generatePackage()">產生結案交付包</button><button onclick="queryPackage()">查詢交付包</button><button class="secondary" onclick="statusPackage()">檢查交付狀態</button><button class="secondary" onclick="location.href='./tender-closing-report.html'">結案報告</button><button class="secondary" onclick="location.href='./tender-erp.html'">回標案 ERP</button><div class="kpis" id="kpiBox"></div><div id="mainResult" class="status">尚未操作。</div></section>
<section class="card span-6"><h2>交付包原則</h2><div class="status">送件前需要確認：
1. Word 可編輯檔是否完成。
2. PDF 正式送件版是否完成。
3. 成果照片是否完整。
4. 簽到表/名冊是否完整。
5. 滿意度與KPI是否整理。
6. 發票、收據、支出明細是否齊全。
7. 驗收對照表是否完成。
8. 必要附件是否已放入資料夾。</div></section>
<section class="card span-6"><h2>交付狀態</h2><div id="statusBox" class="status">尚未檢查。</div></section>
<section class="card span-12"><h2>交付包列表</h2><div id="packageTable"></div></section>
<section class="card span-12"><h2>交付項目明細</h2><div id="itemTable"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.userRole||u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function link(v){return v?'<a href="'+v+'" target="_blank">開啟</a>':''}
function renderKpis(d){d=d||{};const items=[['總項目',d.total||0],['已完成',d.done||0],['缺件',d.missing||0],['非必要',d.optional||0],['狀態',d.status||'-']];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}
function table(id,rows,keys,empty){rows=rows||[];const box=document.getElementById(id);if(!rows.length){box.innerHTML='<div class="status">'+(empty||'無資料')+'</div>';return}box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,200).map(r=>'<tr>'+keys.map(k=>'<td>'+((k.indexOf('連結')>=0||k==='檔案連結')?link(r[k]):(r[k]||''))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function generatePackage(){await api({action:'tender.closingPackage.generate',keyword:val('keyword'),標案ID:val('keyword'),標案名稱:val('tenderName'),folderUrl:val('folderUrl')},'mainResult');queryPackage();statusPackage()}
async function queryPackage(){const r=await api({action:'tender.closingPackage.query',keyword:val('keyword')},'mainResult');const d=r.data||{};table('packageTable',d.packages||[],['交付包ID','標案ID','標案名稱','交付包狀態','Word連結','PDF連結','Drive資料夾','總項目數','已完成數','缺件數'],'無交付包');table('itemTable',d.items||[],['資料類型','交付項目','必要性','資料狀態','檔案連結','缺件風險'],'無交付項目')}
async function statusPackage(){const r=await api({action:'tender.closingPackage.status',keyword:val('keyword')},'statusBox');renderKpis(r.data||{})}
queryPackage();statusPackage();
</script>
</body>
</html>
