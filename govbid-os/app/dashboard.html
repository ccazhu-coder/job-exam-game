<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜營運儀表板</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜營運儀表板</div><div class="sub">對齊：營運儀表板／應收帳款／收款紀錄／專案損益</div><nav id="nav"></nav></div></header><main class="wrap"><section class="card span12"><h2>整體營運查詢</h2><div class="hint">正式上線版：儀表板也要可查詢，不只顯示數字。</div><div class="btns"><button onclick="loadDashboard()">查詢營運儀表板</button><button class="secondary" onclick="loadProjectOverview()">查詢專案總覽</button><button class="secondary" onclick="loadRisk()">查詢風險報告</button></div><div id="msg" class="msg">尚未查詢。</div><div id="kpis" class="kpis" style="margin-top:12px"></div><div id="table"></div></section></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();async function loadDashboard(){const r=await ERPALIGNED.api({action:'取得ERP儀表板'},'msg');const d=r.data||{};document.getElementById('kpis').innerHTML=['專案總數','活動總數','今日待辦','未收款金額','已收收入','支出總額','損益','核銷缺件'].map(k=>'<div class="kpi"><div class="num">'+(d[k]??0)+'</div><div class="name">'+k+'</div></div>').join('');ERPALIGNED.renderTable({data:{rows:d.未收款||d.今日任務||d.核銷缺件明細||[]}},'table')}async function loadProjectOverview(){const r=await ERPALIGNED.api({action:'ERP專案總覽'},'msg');ERPALIGNED.renderTable(r,'table')}async function loadRisk(){const r=await ERPALIGNED.api({action:'ERP風險報告'},'msg');ERPALIGNED.renderTable({data:{rows:[...(r.data?.逾期任務||[]),...(r.data?.未收款||[]),...(r.data?.核銷缺件||[])]}},'table')}loadDashboard();</script></body></html>
