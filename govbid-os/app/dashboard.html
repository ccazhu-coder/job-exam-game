<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜登入 / 儀表板</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
<style>
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,#1a3a6c 100%);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.login-card{background:var(--white);border-radius:16px;padding:36px 32px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.login-logo::before{content:'';display:block;width:5px;height:1.3em;background:var(--gold);border-radius:3px}
.login-tagline{font-size:.84rem;color:var(--gray-500);margin-bottom:24px}
.login-card label{font-size:.82rem;font-weight:600;color:var(--navy-mid);display:block;margin:12px 0 4px}
.login-card input,.login-card select{width:100%;padding:10px 13px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:.9rem;font-family:var(--font);background:var(--white)}
.login-card input:focus,.login-card select:focus{outline:none;border-color:var(--navy-mid);box-shadow:0 0 0 3px rgba(26,58,92,.1)}
.login-btn{width:100%;margin-top:20px;padding:12px;background:var(--navy);color:var(--white);border:none;border-radius:var(--radius);font-size:.95rem;font-weight:700;cursor:pointer;font-family:var(--font)}
.login-btn:hover{background:var(--navy-mid)}
.login-btn.gold-btn{background:var(--gold);color:var(--navy)}
.login-btn.gold-btn:hover{background:var(--gold-light)}
.login-divider{text-align:center;font-size:.78rem;color:var(--gray-300);margin:16px 0;position:relative}
.login-divider::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--gray-200)}
.login-divider span{background:var(--white);padding:0 12px;position:relative}
.login-saved{background:var(--gold-pale);border:1px solid var(--gold);border-radius:var(--radius);padding:12px 14px;font-size:.85rem;color:var(--navy);margin-bottom:12px}
.login-saved strong{display:block;font-size:.95rem;margin-bottom:2px}
.login-err{background:rgba(192,57,43,.1);color:var(--danger);border:1px solid rgba(192,57,43,.2);border-radius:var(--radius);padding:10px 14px;font-size:.84rem;margin-top:12px;display:none}
.switch-link{display:block;text-align:center;margin-top:10px;font-size:.8rem;color:var(--gray-500);cursor:pointer;text-decoration:underline}
.switch-link:hover{color:var(--navy)}
</style>
</head>
<body>

<!-- ══ 登入畫面 ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">GovOps OS</div>
    <div class="login-tagline">政府標案全流程營運系統 — 內部使用</div>

    <!-- 已有帳號：快速進入 -->
    <div id="savedSection" style="display:none">
      <div id="savedInfo" class="login-saved"></div>
      <button class="login-btn gold-btn" onclick="doQuickLogin()">進入系統</button>
      <a class="switch-link" onclick="showRegister()">不是這個帳號？切換 / 重新建立</a>
    </div>

    <!-- 新帳號：注冊 -->
    <div id="regSection">
      <div class="form-row">
        <div class="field"><label>工作室／公司名稱＊</label><input id="lOrgName" placeholder="例如：璞策顧問工作室"></div>
        <div class="field"><label>使用者姓名＊</label><input id="lUserName" placeholder="您的姓名"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Email</label><input id="lEmail" type="email" placeholder="example@mail.com"></div>
        <div class="field"><label>角色</label>
          <select id="lRole">
            <option value="owner">負責人</option>
            <option value="admin">管理者</option>
            <option value="finance">財務人員</option>
            <option value="staff">行政人員</option>
            <option value="viewer">檢視者</option>
          </select>
        </div>
      </div>
      <label>預設主辦單位</label>
      <input id="lHost" placeholder="例如：彰化縣米穀商業同業公會">
      <button class="login-btn" onclick="doRegister()">建立帳號並進入系統</button>
    </div>

    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- ══ 主系統畫面 ══ -->
<div id="appScreen" style="display:none">
  <header><div class="wrap">
    <div class="brand">GovOps OS</div>
    <div class="sub" id="dashSub">政府標案全流程營運系統</div>
    <nav id="nav"></nav>
    <!-- userChip 由 ERPALIGNED.appendUserChip() 動態插入 -->
  </div></header>

  <main class="wrap">
    <div class="page-title">
      <h1>營運儀表板</h1>
      <p id="dashSubtitle">—</p>
    </div>

    <div id="kpis" class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="num">—</div><div class="name">載入中</div></div>
    </div>

    <div class="grid">
      <section class="card span8">
        <h2>業務案件總覽</h2>
        <div id="caseKpiRow" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px">
          <div class="kpi"><div class="num" id="dk_total">—</div><div class="name">全部案件</div></div>
          <div class="kpi"><div class="num" id="dk_active">—</div><div class="name">進行中</div></div>
          <div class="kpi warn"><div class="num" id="dk_urgent">—</div><div class="name">需行動</div></div>
          <div class="kpi ok"><div class="num" id="dk_closed">—</div><div class="name">已結案</div></div>
        </div>
        <div class="btns" style="margin-bottom:10px">
          <button onclick="loadCaseStats()">刷新案件統計</button>
          <button class="secondary" onclick="loadSchedule()">近期行程</button>
          <button class="secondary" onclick="loadOverview()">舊版專案總覽</button>
          <button class="secondary" onclick="loadMarketing()">行銷名單</button>
        </div>
        <div id="dashMsg" class="msg" style="margin-top:8px">—</div>
        <div id="table" style="margin-top:10px"></div>
      </section>

      <!-- 圖表列 -->
      <section class="card span8" style="padding:16px 20px">
        <h2 style="margin-bottom:12px">案件狀態分布</h2>
        <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
          <canvas id="caseDonut" width="160" height="160"></canvas>
          <div id="caseDonutLegend" style="font-size:.82rem;line-height:2;color:var(--text-main,#ccd6f6)"></div>
        </div>
      </section>

      <section class="card span4" style="padding:16px 20px">
        <h2 style="margin-bottom:12px">財務摘要</h2>
        <div id="finBarChart" style="font-size:.82rem"></div>
      </section>

      <section class="card span4">
        <h2>快速操作</h2>
        <div class="btns" style="flex-direction:column;align-items:stretch;gap:6px">
          <button class="gold" onclick="location.href='./cases.html'">＋ 新增業務案件</button>
          <button class="secondary" onclick="location.href='./sessions.html'">場次管理</button>
          <button class="secondary" onclick="location.href='./registrations.html'">報名管理</button>
          <button class="secondary" onclick="location.href='./documents.html'">文件產生</button>
          <button class="secondary" onclick="location.href='./calendar.html'">日曆管理</button>
          <button class="secondary" onclick="location.href='./finance.html'">財務收支</button>
          <button class="secondary" onclick="location.href='./closing.html'">結案管理</button>
          <button class="secondary" onclick="location.href='./vendors.html'">廠商</button>
          <button class="ghost" onclick="location.href='./crm.html'">學員 CRM</button>
        </div>
        <div class="section-sep" style="margin-top:16px"><span>系統狀態</span></div>
        <div id="healthMsg" class="msg" style="font-size:.78rem;min-height:40px">—</div>
        <div class="btns" style="margin-top:8px">
          <button class="secondary" onclick="healthCheck()" style="font-size:.78rem;padding:6px 12px">健康檢查</button>
          <button class="secondary" onclick="location.href='./pre-launch-qa.html'" style="font-size:.78rem;padding:6px 12px">驗收頁面</button>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
const ROLE_LABELS = {owner:'負責人',admin:'管理者',finance:'財務人員',staff:'行政人員',viewer:'檢視者'};
function makeId(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.floor(Math.random()*1000);}
function safeJSON(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}

// ── 啟動 ──────────────────────────────────────────────
function checkAuth(){
  const profile = safeJSON('govops_profile');
  if(profile && profile.userId && profile.orgName){
    enterApp(profile);
  } else {
    showLoginScreen(profile);
  }
}

function showLoginScreen(saved){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appScreen').style.display='none';
  if(saved && saved.userId){
    // 有舊 session 但可能資料不完整，讓使用者確認進入或重建
    document.getElementById('savedSection').style.display='';
    document.getElementById('regSection').style.display='none';
    const name = saved.userName||saved.orgName||saved.email||'使用者';
    const role = ROLE_LABELS[saved.role||saved.userRole]||'';
    document.getElementById('savedInfo').innerHTML =
      '<strong>'+ERPALIGNED.esc(name)+'</strong>' +
      (role?'<span style="color:var(--gray-500)">'+ERPALIGNED.esc(role)+'</span>':'') +
      (saved.email?'<div style="font-size:.8rem;color:var(--gray-500);margin-top:2px">'+ERPALIGNED.esc(saved.email)+'</div>':'');
  } else {
    document.getElementById('savedSection').style.display='none';
    document.getElementById('regSection').style.display='';
  }
}

function showRegister(){
  ['govops_profile','govops_auth'].forEach(k=>localStorage.removeItem(k));
  document.getElementById('savedSection').style.display='none';
  document.getElementById('regSection').style.display='';
}

function enterApp(profile){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='';
  document.getElementById('nav').innerHTML = ERPALIGNED.nav();
  const name = profile.userName||profile.orgName||profile.email||'使用者';
  const role = ROLE_LABELS[profile.role||profile.userRole]||'';
  document.getElementById('dashSubtitle').textContent =
    (profile.orgName||name) + (role?'　角色：'+role:'');
  // 插入 userChip（只插一次）
  ERPALIGNED.appendUserChip('#appScreen header .wrap');
  loadDashboard();
  healthCheck();
  // v0.1: 預載案件統計
}

// ── 登錄 ──────────────────────────────────────────────
function doRegister(){
  const orgName = document.getElementById('lOrgName').value.trim();
  const userName = document.getElementById('lUserName').value.trim();
  if(!orgName||!userName){ showErr('請填寫工作室名稱和使用者姓名。'); return; }
  const role = document.getElementById('lRole').value;
  const profile = {
    tenantId: makeId('TENANT'),
    userId: makeId('USR'),
    orgName, userName,
    email: document.getElementById('lEmail').value.trim(),
    role, userRole: role,
    roleLabel: ROLE_LABELS[role]||role,
    plan: 'enterprise',
    defaultHost: document.getElementById('lHost').value.trim(),
    status: 'active',
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('govops_profile', JSON.stringify(profile));
  localStorage.setItem('govops_auth', JSON.stringify({tenantId:profile.tenantId,userId:profile.userId,userRole:role,plan:'enterprise',status:'active'}));
  enterApp(profile);
}

function doQuickLogin(){
  const profile = safeJSON('govops_profile');
  if(profile && profile.userId) enterApp(profile);
  else showRegister();
}

function doLogout(){
  ['govops_profile','govops_auth'].forEach(k=>localStorage.removeItem(k));
  const chip = document.getElementById('_erpChip');
  if(chip) chip.remove();
  checkAuth();
}

function showErr(msg){
  const el=document.getElementById('loginErr');
  el.textContent=msg; el.style.display='';
}

// ── 儀表板 ────────────────────────────────────────────
async function loadDashboard(){
  loadCaseStats();
  loadFinanceSummary();
  loadSchedule();
}

// ── 純 Canvas 圓餅圖 ─────────────────────────────────
function drawDonut(canvasId, segments) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var cx = canvas.width / 2, cy = canvas.height / 2, r = 62, ir = 38;
  var total = segments.reduce(function(s, seg) { return s + (seg.value || 0); }, 0);
  if (!total) { ctx.fillStyle = '#2a4060'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); return; }
  var angle = -Math.PI / 2;
  segments.forEach(function(seg) {
    var slice = (seg.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle, angle + slice);
    ctx.fillStyle = seg.color;
    ctx.fill();
    angle += slice;
  });
  ctx.beginPath(); ctx.arc(cx, cy, ir, 0, Math.PI*2); ctx.fillStyle = '#0e1e31'; ctx.fill();
  ctx.fillStyle = '#b8963e'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(total, cx, cy - 8);
  ctx.fillStyle = '#7a9bc5'; ctx.font = '11px sans-serif';
  ctx.fillText('案件', cx, cy + 12);
}

// ── 財務水平條形圖 ────────────────────────────────────
function renderFinBar(income, expense) {
  var el = document.getElementById('finBarChart');
  if (!el) return;
  var max = Math.max(income, expense, 1);
  var fmt = function(n) { return (n || 0).toLocaleString(); };
  var bar = function(v, color, label) {
    var pct = Math.round((v / max) * 100);
    return '<div style="margin-bottom:10px">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
      + '<span style="color:#aac">' + label + '</span><span style="color:' + color + ';font-weight:700">NT$' + fmt(v) + '</span></div>'
      + '<div style="background:#162035;border-radius:4px;height:12px"><div style="width:' + pct + '%;background:' + color + ';height:12px;border-radius:4px;transition:width .5s"></div></div>'
      + '</div>';
  };
  var profit = income - expense;
  el.innerHTML = bar(income, '#22c55e', '總收入') + bar(expense, '#ef4444', '總支出')
    + '<div style="border-top:1px solid #2a4060;padding-top:8px;margin-top:4px;display:flex;justify-content:space-between">'
    + '<span style="color:#aac">損益</span><span style="color:' + (profit >= 0 ? '#22c55e' : '#ef4444') + ';font-weight:700">NT$' + fmt(profit) + '</span></div>';
}

async function loadCaseStats(){
  const r=await ERPALIGNED.api({action:'getCaseStats'});
  if(!r.success) return;
  const d=r.data||{};
  const bs=d.byStatus||{};
  // 更新頂部 KPI
  const kpiDefs=[
    ['進行中案件', d.active||0, ''],
    ['待請款', bs['待請款']||0, 'warn'],
    ['待收款', bs['待收款']||0, 'warn'],
    ['待結案', bs['待結案']||0, 'warn'],
    ['已結案', bs['已結案']||0, 'ok'],
    ['草稿中', bs['草稿']||0, ''],
    ['全部案件', d.total||0, ''],
    ['封存', d.archived||0, '']
  ];
  document.getElementById('kpis').innerHTML=kpiDefs.map(([k,v,cls])=>'<div class="kpi'+(cls?' '+cls:'')+'"><div class="num">'+v+'</div><div class="name">'+k+'</div></div>').join('');
  // 更新案件卡片內小 KPI
  const el=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  el('dk_total',d.total||0); el('dk_active',d.active||0); el('dk_urgent',d.urgent||0); el('dk_closed',bs['已結案']||0);
  // 圓餅圖
  var segments=[
    {label:'進行中', value:(bs['執行中']||0)+(bs['已簽約']||0)+(bs['洽談中']||0)+(bs['提案中']||0), color:'#2563eb'},
    {label:'待處理', value:(bs['待請款']||0)+(bs['待收款']||0)+(bs['待結案']||0), color:'#b8963e'},
    {label:'已結案', value:bs['已結案']||0, color:'#22c55e'},
    {label:'草稿',   value:bs['草稿']||0,   color:'#64748b'},
    {label:'暫停/取消', value:(bs['暫停']||0)+(bs['取消']||0), color:'#ef4444'}
  ].filter(function(s){return s.value>0;});
  drawDonut('caseDonut', segments);
  var legend=document.getElementById('caseDonutLegend');
  if(legend) legend.innerHTML=segments.map(function(s){
    return '<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+s.color+';margin-right:6px"></span>'+s.label+'<span style="color:#b8963e;font-weight:700;margin-left:8px">'+s.value+'</span></div>';
  }).join('');
  // 顯示需行動案件清單
  const urgentList=['待請款','待收款','待結案'];
  const r2=await ERPALIGNED.api({action:'getCases',status:''});
  if(!r2.success) return;
  const urgent=(r2.data||[]).filter(c=>urgentList.includes(c['狀態']));
  if(urgent.length){
    const msg=document.getElementById('dashMsg');
    msg.textContent='';
    ERPALIGNED.renderTable({data:{rows:urgent.map(c=>({'案件':c['專案計畫名稱'],'客戶':c['主辦單位']||'—','狀態':c['狀態'],'預估收入':c['契約金額']||'—'}))}}, 'table');
  } else {
    document.getElementById('dashMsg').textContent='目前無需行動案件';
    document.getElementById('table').innerHTML='';
  }
}

async function loadFinanceSummary(){
  const r=await ERPALIGNED.api({action:'getFinanceSummary'});
  if(!r||!r.success) return;
  const d=r.data||{};
  renderFinBar(d.totalIncome||0, d.totalExpense||0);
}

async function loadSchedule(){
  const msg=document.getElementById('dashMsg');
  msg.textContent='查詢近期行程…';
  const r=await ERPALIGNED.api({action:'getUpcomingSchedule',days:'14'});
  msg.textContent='';
  if(!r.success||!r.data||!r.data.length){document.getElementById('table').innerHTML='<div class="empty">近14天無排定場次</div>';return;}
  const today=new Date().toISOString().substring(0,10);
  ERPALIGNED.renderTable({data:{rows:r.data.map(e=>({'日期':e['日期'],'場次名稱':e['名稱'],'時間':e['時間'],'地點':e['地點']||'—','狀態':e['狀態']}))}}, 'table');
}

async function loadOverview(){const r=await ERPALIGNED.api({action:'getCases'},'dashMsg');ERPALIGNED.renderTable(r,'table')}
async function loadMarketing(){const r=await ERPALIGNED.api({action:'行銷名單'},'dashMsg');ERPALIGNED.renderTable(r,'table')}
async function loadReturn(){const r=await ERPALIGNED.api({action:'回流學員分析'},'dashMsg');ERPALIGNED.renderTable(r,'table')}
async function healthCheck(){await ERPALIGNED.api({action:'正式平台健康檢查'},'healthMsg')}

checkAuth();
</script>
</body>
</html>
