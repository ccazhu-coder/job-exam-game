<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>政務營運系統｜財務秘書</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js?v=p0-api"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">政務營運系統</div>
  <div class="sub">應收帳款 / 收款沖帳 / 支出登錄 / 損益報表</div>
  <nav id="nav"></nav>
</div></header>

<section id="financeDenied" class="wrap" style="display:none">
  <div class="card">
    <h2>沒有財務操作權限</h2>
    <p class="hint">你沒有財務操作權限，請聯繫系統管理員。</p>
    <div class="btns"><button class="secondary" onclick="location.href='./dashboard.html'">返回營運首頁</button></div>
  </div>
</section>

<main class="wrap" id="financeApp">
  <div class="page-title">
    <h1>財務秘書</h1>
    <p>管理應收帳款、登錄收款、支出明細，即時查看損益</p>
  </div>

  <!-- Tab 切換 -->
  <div class="btns" style="margin-bottom:16px">
    <button id="tabAR" class="gold" onclick="switchTab('ar')">應收帳款</button>
    <button id="tabPay" class="secondary" onclick="switchTab('pay')">收款紀錄</button>
    <button id="tabExp" class="secondary" onclick="switchTab('exp')">支出明細</button>
    <button id="tabPL" class="secondary" onclick="switchTab('pl')">損益報表</button>
  </div>

  <!-- ══ 應收帳款 ══ -->
  <div id="secAR">
    <div class="grid">
      <section class="card span4">
        <h2>建立應收帳款</h2>
        <div class="hint">活動完成或確認請款後建立，收到款後用「收款沖帳」結清。</div>
        <form id="arForm">
          <div class="form-row">
            <div class="field"><label>活動編號</label>
              <div style="display:flex;gap:6px">
                <input name="活動ID" placeholder="活動編號" style="flex:1">
                <button type="button" class="secondary" onclick="pickActForFinance('活動ID','arForm')" style="flex:0 0 60px">選取</button>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>對象名稱</label><input name="對象名稱" placeholder="主辦單位或付款單位"></div>
            <div class="field"><label>應收項目</label><input name="應收項目" value="活動費用"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>應收金額＊</label><input name="應收金額" type="number" min="0" required></div>
            <div class="field"><label>預計收款日</label><input name="預計收款日" type="date"></div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit">建立應收帳款</button></div>
        </form>
        <div id="arMsg" class="msg" style="margin-top:8px">尚未建立。</div>
      </section>

      <section class="card span8">
        <h2>查詢應收帳款</h2>
        <div class="form-row">
          <div class="field"><input id="arKw" placeholder="活動編號、對象名稱、狀態" onkeydown="if(event.key==='Enter')queryAR()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryAR()">查詢</button></div>
        </div>
        <div id="arQueryMsg" class="msg">尚未查詢。</div>
        <div id="arTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <!-- ══ 收款紀錄 ══ -->
  <div id="secPay" style="display:none">
    <div class="grid">
      <section class="card span4">
        <h2>登錄收款／沖帳</h2>
        <form id="payForm">
          <div class="form-row">
            <div class="field"><label>應收編號</label><input name="應收ID" placeholder="可空白"></div>
            <div class="field"><label>活動編號</label><input name="活動ID" placeholder="活動編號"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>收款金額＊</label><input name="收款金額" type="number" min="0" required></div>
            <div class="field"><label>收款日期</label><input name="收款日期" type="date"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>收款方式</label>
              <select name="收款方式"><option>匯款</option><option>現金</option><option>行動支付</option><option>支票</option><option>其他</option></select>
            </div>
            <div class="field"><label>付款人</label><input name="付款人"></div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit" class="gold">登錄收款並沖帳</button></div>
        </form>
        <div id="payMsg" class="msg" style="margin-top:8px">尚未登錄。</div>
      </section>

      <section class="card span8">
        <h2>查詢收款紀錄</h2>
        <div class="form-row">
          <div class="field"><input id="payKw" placeholder="活動編號、應收編號、付款人" onkeydown="if(event.key==='Enter')queryPay()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryPay()">查詢</button></div>
        </div>
        <div id="payQueryMsg" class="msg">尚未查詢。</div>
        <div id="payTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <!-- ══ 支出明細 ══ -->
  <div id="secExp" style="display:none">
    <div class="grid">
      <section class="card span4">
        <h2>登錄支出</h2>
        <form id="expForm">
          <div class="form-row">
            <div class="field"><label>活動編號</label>
              <div style="display:flex;gap:6px">
                <input name="活動ID" placeholder="活動編號" style="flex:1">
                <button type="button" class="secondary" onclick="pickActForFinance('活動ID','expForm')" style="flex:0 0 60px">選取</button>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>支出日期</label><input name="支出日期" type="date"></div>
            <div class="field"><label>支出金額＊</label><input name="支出金額" type="number" min="0" required></div>
          </div>
          <div class="form-row">
            <div class="field"><label>支出類型</label>
              <select name="支出類型">
                <option>講師費</option><option>餐費</option><option>印刷費</option>
                <option>交通費</option><option>場地費</option><option>攝影費</option>
                <option>行政雜支</option><option>其他</option>
              </select>
            </div>
            <div class="field"><label>廠商／受款人</label>
              <div style="display:flex;gap:6px">
                <input name="廠商" placeholder="廠商名稱" id="expVendorName" style="flex:1">
                <button type="button" class="secondary" onclick="pickVenForFinance()" style="flex:0 0 60px">選取</button>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>付款方式</label>
              <select name="付款方式"><option>匯款</option><option>現金</option><option>行動支付</option><option>支票</option><option>其他</option></select>
            </div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit">登錄支出</button></div>
        </form>
        <div id="expMsg" class="msg" style="margin-top:8px">尚未登錄。</div>
      </section>

      <section class="card span8">
        <h2>查詢支出明細</h2>
        <div class="form-row">
          <div class="field"><input id="expKw" placeholder="活動編號、廠商、支出類型" onkeydown="if(event.key==='Enter')queryExp()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryExp()">查詢</button></div>
        </div>
        <div id="expQueryMsg" class="msg">尚未查詢。</div>
        <div id="expTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <!-- ══ 損益報表 ══ -->
  <div id="secPL" style="display:none">
    <div class="grid">
      <section class="card span12">
        <h2>損益報表</h2>
        <div class="btns">
          <button onclick="loadPL()">計算損益</button>
          <button class="secondary" onclick="initFinance()">初始化財務系統</button>
        </div>
        <div id="plMsg" class="msg" style="margin-top:12px">尚未計算。</div>
        <div id="plKpis" class="kpis" style="margin-top:12px"></div>
      </section>
    </div>
  </div>
</main>

<script src="./govops-api-client.js?v=p0-api"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

function financeSafeJson(key){
  try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}
}
function normalizeFinanceRole(role){
  const r=String(role||'viewer').toLowerCase();
  if(r==='tenant_owner')return'owner';
  if(r==='sys_admin'||r==='pm'||r==='project')return'admin';
  if(r==='accounting')return'finance';
  if(r==='teacher'||r==='admin_staff')return'staff';
  return ['owner','admin','finance','staff','viewer'].includes(r)?r:'viewer';
}
function getFinanceSession(){
  const profile=financeSafeJson('govops_profile');
  const auth=financeSafeJson('govops_auth');
  const role=normalizeFinanceRole(profile.userRole||profile.role||auth.userRole||auth.role);
  return {profile:profile,auth:auth,role:role,hasSession:!!(auth.sessionToken||auth.userId||profile.userId)};
}
function canOperateFinance(){
  return ['owner','admin','finance'].includes(getFinanceSession().role);
}
function enforceFinanceGuard(){
  const session=getFinanceSession();
  if(!session.hasSession){
    location.href='./login.html?redirect='+encodeURIComponent('./finance-secretary.html');
    return false;
  }
  if(!canOperateFinance()){
    document.getElementById('financeApp').style.display='none';
    document.getElementById('financeDenied').style.display='';
    return false;
  }
  document.getElementById('financeDenied').style.display='none';
  document.getElementById('financeApp').style.display='';
  return true;
}

// ── Tab ──────────────────────────────────────────────
function switchTab(tab){
  ['ar','pay','exp','pl'].forEach(t=>{
    document.getElementById('sec'+t.charAt(0).toUpperCase()+t.slice(1)).style.display = t===tab ? '' : 'none';
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).className = t===tab ? 'gold' : 'secondary';
  });
  if(tab==='ar')queryAR();
  if(tab==='pay')queryPay();
  if(tab==='exp')queryExp();
}

// ── 選取器 ───────────────────────────────────────────
function pickActForFinance(fieldName, formId){
  ERPALIGNED.showPickerModal('查詢活動', ['活動ID','活動名稱','活動日期','狀態'], row=>{
    const form=document.getElementById(formId);
    const inp=form.querySelector('[name="'+fieldName+'"]');
    if(inp) inp.value = row['活動ID']||'';
  },'選取活動');
}
function pickVenForFinance(){
  ERPALIGNED.showPickerModal('查詢合作廠商', ['廠商編號','名稱','類型','電話','銀行'], row=>{
    document.getElementById('expVendorName').value = row['名稱']||'';
  },'選取廠商');
}

// ── 應收 ─────────────────────────────────────────────
document.getElementById('arForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'建立應收帳款'};
  fd.forEach((v,k)=>{if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'arMsg');
  if(r&&r.success){e.target.reset();queryAR();}
});
async function queryAR(){
  const r=await ERPALIGNED.api({action:'查詢應收帳款',keyword:document.getElementById('arKw').value},'arQueryMsg');
  ERPALIGNED.renderTable(r,'arTable');
}

// ── 收款 ─────────────────────────────────────────────
document.getElementById('payForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'登錄收款'};
  fd.forEach((v,k)=>{if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'payMsg');
  if(r&&r.success){e.target.reset();queryPay();queryAR();}
});
async function queryPay(){
  const r=await ERPALIGNED.api({action:'查詢收款紀錄',keyword:document.getElementById('payKw').value},'payQueryMsg');
  ERPALIGNED.renderTable(r,'payTable');
}

// ── 支出 ─────────────────────────────────────────────
document.getElementById('expForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'登錄支出'};
  fd.forEach((v,k)=>{if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'expMsg');
  if(r&&r.success){e.target.reset();queryExp();}
});
async function queryExp(){
  const r=await ERPALIGNED.api({action:'查詢支出明細',keyword:document.getElementById('expKw').value},'expQueryMsg');
  ERPALIGNED.renderTable(r,'expTable');
}

// ── 損益 ─────────────────────────────────────────────
async function loadPL(){
  const r=await ERPALIGNED.api({action:'查詢損益報表'},'plMsg');
  const d=r.data||{};
  document.getElementById('plKpis').innerHTML=[
    ['應收總額','danger'],['已收總額','ok'],['未收總額','warn'],
    ['支出總額',''],['毛損益','']
  ].map(([k,cls])=>'<div class="kpi'+(cls?' '+cls:'')+'"><div class="num">'+(d[k]!==undefined?Number(d[k]).toLocaleString():'—')+'</div><div class="name">'+k+'(元)</div></div>').join('');
}

async function initFinance(){
  await ERPALIGNED.api({action:'初始化財務'},'plMsg');
}

if(enforceFinanceGuard())queryAR();
</script>
</body>
</html>
