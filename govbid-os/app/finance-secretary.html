<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜財務秘書</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js?v=p0-api"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <div class="brand">GovOps OS</div>
      <div class="sub">財務秘書｜應收、收款、支出與損益查詢</div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<section id="financeDenied" class="wrap" style="display:none">
  <div class="card">
    <h2>沒有財務操作權限</h2>
    <p class="hint">你沒有財務操作權限，請聯繫系統管理員。</p>
    <div class="btns"><button class="secondary" onclick="location.href='./dashboard.html'">回到戰情中心</button></div>
  </div>
</section>

<main class="wrap" id="financeApp">
  <div class="page-title">
    <h1>財務秘書</h1>
    <p>集中處理專案與活動的應收帳款、收款沖帳、支出登錄與損益摘要。</p>
  </div>

  <div class="btns" style="margin-bottom:16px">
    <button id="tabAR" class="gold" onclick="switchTab('ar')">應收帳款</button>
    <button id="tabPay" class="secondary" onclick="switchTab('pay')">收款紀錄</button>
    <button id="tabExp" class="secondary" onclick="switchTab('exp')">支出紀錄</button>
    <button id="tabPL" class="secondary" onclick="switchTab('pl')">損益查詢</button>
  </div>

  <div id="secAR">
    <div class="grid">
      <section class="card span4">
        <h2>建立應收帳款</h2>
        <div class="hint">請以活動編號建立應收帳款，系統會依活動回綁專案資料。</div>
        <form id="arForm">
          <div class="form-row">
            <div class="field"><label>活動編號</label><input name="活動ID" placeholder="請輸入活動編號"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>對象名稱</label><input name="對象名稱" placeholder="例如：主辦機關或委託單位"></div>
            <div class="field"><label>應收項目</label><input name="應收項目" value="活動費用"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>應收金額</label><input name="應收金額" type="number" min="0" required></div>
            <div class="field"><label>預計收款日</label><input name="預計收款日" type="date"></div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit">建立應收帳款</button></div>
        </form>
        <div id="arMsg" class="msg" style="margin-top:8px">尚未建立。</div>
      </section>

      <section class="card span8">
        <h2>查詢應收帳款</h2>
        <div class="form-row">
          <div class="field"><input id="arKw" placeholder="輸入活動編號、對象名稱或應收項目" onkeydown="if(event.key==='Enter')queryAR()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryAR()">查詢</button></div>
        </div>
        <div id="arQueryMsg" class="msg">尚未查詢。</div>
        <div id="arTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <div id="secPay" style="display:none">
    <div class="grid">
      <section class="card span4">
        <h2>登錄收款</h2>
        <form id="payForm">
          <div class="form-row">
            <div class="field"><label>應收編號</label><input name="應收ID" placeholder="請輸入應收編號"></div>
            <div class="field"><label>活動編號</label><input name="活動ID" placeholder="可選填"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>收款金額</label><input name="收款金額" type="number" min="0" required></div>
            <div class="field"><label>收款日期</label><input name="收款日期" type="date"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>收款方式</label>
              <select name="收款方式"><option>匯款</option><option>現金</option><option>支票</option><option>轉帳</option><option>其他</option></select>
            </div>
            <div class="field"><label>付款人</label><input name="付款人"></div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit" class="gold">登錄收款並沖帳</button></div>
        </form>
        <div id="payMsg" class="msg" style="margin-top:8px">尚未登錄。</div>
      </section>

      <section class="card span8">
        <h2>查詢收款紀錄</h2>
        <div class="form-row">
          <div class="field"><input id="payKw" placeholder="輸入應收編號、付款人或活動編號" onkeydown="if(event.key==='Enter')queryPay()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryPay()">查詢</button></div>
        </div>
        <div id="payQueryMsg" class="msg">尚未查詢。</div>
        <div id="payTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <div id="secExp" style="display:none">
    <div class="grid">
      <section class="card span4">
        <h2>登錄支出</h2>
        <form id="expForm">
          <div class="form-row">
            <div class="field"><label>專案編號</label><input name="專案ID" placeholder="可由活動帶入"></div>
            <div class="field"><label>活動編號</label><input name="活動ID" placeholder="請輸入活動編號"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>支出日期</label><input name="支出日期" type="date"></div>
            <div class="field"><label>支出金額</label><input name="支出金額" type="number" min="0" required></div>
          </div>
          <div class="form-row">
            <div class="field"><label>支出類型</label>
              <select name="支出類型">
                <option>講師費</option><option>場地費</option><option>餐點費</option>
                <option>交通費</option><option>印刷費</option><option>行政雜支</option>
                <option>工作人員費</option><option>其他</option>
              </select>
            </div>
            <div class="field"><label>支出項目</label><input name="支出項目" placeholder="例如：講師費、便當、場地租借"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>廠商 / 對象</label><input name="廠商名稱" placeholder="廠商或受款人" id="expVendorName"></div>
            <div class="field"><label>收據狀態</label>
              <select name="收據狀態"><option>未取得</option><option>已取得</option><option>補件中</option><option>免附</option><option>其他</option></select>
            </div>
          </div>
          <label>備註</label><textarea name="備註" rows="2"></textarea>
          <div class="btns"><button type="submit">登錄支出</button></div>
        </form>
        <div id="expMsg" class="msg" style="margin-top:8px">尚未登錄。</div>
      </section>

      <section class="card span8">
        <h2>查詢支出紀錄</h2>
        <div class="form-row">
          <div class="field"><input id="expKw" placeholder="輸入活動編號、支出項目或廠商" onkeydown="if(event.key==='Enter')queryExp()"></div>
          <div class="field" style="max-width:110px"><button onclick="queryExp()">查詢</button></div>
        </div>
        <div id="expQueryMsg" class="msg">尚未查詢。</div>
        <div id="expTable" style="margin-top:8px"></div>
      </section>
    </div>
  </div>

  <div id="secPL" style="display:none">
    <div class="grid">
      <section class="card span12">
        <h2>損益查詢</h2>
        <div class="btns">
          <button onclick="loadPL()">查詢損益</button>
          <button class="secondary" onclick="initFinance()">初始化財務資料</button>
        </div>
        <div id="plMsg" class="msg" style="margin-top:12px">尚未查詢。</div>
        <div id="plKpis" class="kpis" style="margin-top:12px"></div>
      </section>
    </div>
  </div>
</main>

<script src="./govops-api-client.js?v=p0-api"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

function financeSafeJson(key){
  try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}
}
function normalizeFinanceRole(role){
  const r=String(role||'viewer').toLowerCase();
  if(r==='tenant_owner')return'owner';
  if(r==='sys_admin'||r==='pm'||r==='project')return'admin';
  if(r==='accounting')return'finance';
  if(r==='teacher'||r==='admin_staff')return'staff';
  return ['owner','admin','finance','staff','viewer'].includes(r)?r:'viewer';
}
function getFinanceSession(){
  const profile=financeSafeJson('govops_profile');
  const auth=financeSafeJson('govops_auth');
  const role=normalizeFinanceRole(profile.userRole||profile.role||auth.userRole||auth.role);
  const token=String(auth.sessionToken||auth.token||profile.sessionToken||'');
  return {profile:profile,auth:auth,role:role,sessionToken:token,hasSession:!!token,isDemo:token.indexOf('LOCAL-DEMO-')===0};
}
function canOperateFinance(){
  return ['owner','admin','finance'].includes(getFinanceSession().role);
}
function enforceFinanceGuard(){
  const session=getFinanceSession();
  if(!session.hasSession||session.isDemo){
    ['govops_auth','govops_profile','govops_usage'].forEach(function(key){try{localStorage.removeItem(key)}catch(e){}});
    location.href='./login.html?redirect='+encodeURIComponent('finance-secretary.html');
    return false;
  }
  if(!canOperateFinance()){
    document.getElementById('financeApp').style.display='none';
    document.getElementById('financeDenied').style.display='';
    return false;
  }
  document.getElementById('financeDenied').style.display='none';
  document.getElementById('financeApp').style.display='';
  return true;
}

function switchTab(tab){
  const ids={ar:'AR',pay:'Pay',exp:'Exp',pl:'PL'};
  ['ar','pay','exp','pl'].forEach(function(t){
    document.getElementById('sec'+ids[t]).style.display = t===tab ? '' : 'none';
    document.getElementById('tab'+ids[t]).className = t===tab ? 'gold' : 'secondary';
  });
  if(tab==='ar')queryAR();
  if(tab==='pay')queryPay();
  if(tab==='exp')queryExp();
}

document.getElementById('arForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'建立應收帳款'};
  fd.forEach(function(v,k){if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'arMsg');
  if(r&&r.success){e.target.reset();queryAR();}
});
async function queryAR(){
  const r=await ERPALIGNED.api({action:'查詢未收款',keyword:document.getElementById('arKw').value},'arQueryMsg');
  ERPALIGNED.renderTable(r,'arTable');
}

document.getElementById('payForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'登錄收款'};
  fd.forEach(function(v,k){if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'payMsg');
  if(r&&r.success){e.target.reset();queryPay();queryAR();}
});
async function queryPay(){
  const r=await ERPALIGNED.api({action:'查詢收款紀錄',keyword:document.getElementById('payKw').value},'payQueryMsg');
  ERPALIGNED.renderTable(r,'payTable');
}

document.getElementById('expForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const fd=new FormData(e.target); const o={action:'登錄支出'};
  fd.forEach(function(v,k){if(v)o[k]=v;});
  const r=await ERPALIGNED.api(o,'expMsg');
  if(r&&r.success){e.target.reset();queryExp();}
});
async function queryExp(){
  const r=await ERPALIGNED.api({action:'查詢支出紀錄',keyword:document.getElementById('expKw').value},'expQueryMsg');
  ERPALIGNED.renderTable(r,'expTable');
}

async function loadPL(){
  const r=await ERPALIGNED.api({action:'查詢專案損益'},'plMsg');
  const d=r.data||{};
  const items=[['應收總額','danger'],['已收總額','ok'],['未收總額','warn'],['支出總額',''],['損益','']];
  document.getElementById('plKpis').innerHTML=items.map(function(item){
    const k=item[0], cls=item[1];
    return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="num">'+(d[k]!==undefined?Number(d[k]).toLocaleString():'--')+'</div><div class="name">'+k+'</div></div>';
  }).join('');
}

async function initFinance(){
  await ERPALIGNED.api({action:'初始化財務資料'},'plMsg');
}

if(enforceFinanceGuard())queryAR();
</script>
</body>
</html>
