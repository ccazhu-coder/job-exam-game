<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovOps OS｜財務與AI秘書面板</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f4f7fb;color:#182033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:22px 16px}.wrap{max-width:1100px;margin:0 auto}main{padding:16px 12px 70px}.brand{font-size:24px;font-weight:900}.sub{margin-top:6px;line-height:1.6;opacity:.9}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e7edf5;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(16,37,66,.08)}.span6{grid-column:span 6}.span12{grid-column:span 12}h2{margin:0 0 12px;font-size:19px}label{display:block;margin:10px 0 5px;font-weight:800;color:#344054}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e1ec;border-radius:12px;background:#fbfcff;font-size:16px}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:900;cursor:pointer;background:#1d4e89;color:#fff}button.secondary{background:#e8eef7;color:#1d3557}button.green{background:#12805c}button.orange{background:#b54708}.msg{margin-top:10px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cfd8e6;white-space:pre-wrap;line-height:1.65;max-height:320px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px 7px;text-align:left}th{background:#f8fafc}.hint{background:#eef6ff;border:1px solid #cfe6ff;color:#16436f;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.topnav a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 10px;border-radius:999px;font-weight:800;font-size:14px}.saasbar{display:grid;grid-template-columns:1.2fr .9fr .9fr .9fr;gap:10px;margin-bottom:14px}.saasbox{background:#fff;border:1px solid #dbe7ff;border-radius:16px;padding:13px;box-shadow:0 8px 18px rgba(16,37,66,.05)}.saasbox b{color:#1d4e89}.gate-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:14px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef6ff;color:#16436f;font-weight:900;font-size:12px;margin-top:4px}.small{font-size:13px;color:#667085;line-height:1.6;margin-top:4px}@media(max-width:900px){.span6{grid-column:span 12}.row{grid-template-columns:1fr}.saasbar{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){button{width:100%}.btns{display:block}.btns button{margin-bottom:8px}.saasbar{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">GovOps OS｜財務與AI秘書面板</div>
    <div class="sub">MVP v1.0.0 補充操作頁｜應收、收款、支出、損益、提醒、每日秘書摘要</div>
    <nav class="topnav"><a href="./index.html">返回主系統</a><a href="#finance">財務</a><a href="#secretary">AI秘書</a><a href="#test">測試</a><a href="./login.html">帳號</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="card span12" style="margin-bottom:14px">
    <h2>財務秘書 SaaS 使用者資訊</h2>
    <div id="financeSaaSPanel" class="saasbar"></div>
    <div id="financeGateMsg" class="gate-warn" style="display:none"></div>
  </section>
  <div class="grid">
    <section class="card span12" id="test">
      <h2>系統連線檢查</h2>
      <div class="btns"><button onclick="healthCheck()">檢查系統</button><button class="secondary" onclick="initFinance()">初始化財務</button><button class="secondary" onclick="initReminder()">初始化提醒中心</button></div>
      <div id="testMsg" class="msg">尚未檢查。</div>
    </section>

    <section class="card span6" id="finance">
      <h2>建立應收帳款</h2>
      <div class="hint">活動完成或確認要請款時，先建立應收。收到款項後，再用收款沖帳。</div>
      <label>系統活動編號＊</label><input id="arActivityId" placeholder="ACT-115-0001">
      <label>對象名稱</label><input id="arTarget" placeholder="主辦單位或付款單位">
      <label>應收項目</label><input id="arItem" value="活動費用">
      <div class="row"><div><label>應收金額＊</label><input id="arAmount" type="number" min="0"></div><div><label>預計收款日</label><input id="arDueDate" type="date"></div></div>
      <label>備註</label><textarea id="arNote"></textarea>
      <button onclick="createAR()">建立應收帳款</button>
      <div id="arMsg" class="msg">尚未建立。</div>
    </section>

    <section class="card span6">
      <h2>登錄收款／沖帳</h2>
      <label>應收ID</label><input id="payArId" placeholder="可空白，改用活動ID查找未收款">
      <label>系統活動編號</label><input id="payActivityId" placeholder="ACT-115-0001">
      <div class="row"><div><label>收款金額＊</label><input id="payAmount" type="number" min="0"></div><div><label>收款日期</label><input id="payDate" type="date"></div></div>
      <label>收款方式</label><select id="payMethod"><option>匯款</option><option>現金</option><option>LINE Pay</option><option>支票</option><option>其他</option></select>
      <label>付款人</label><input id="payer">
      <label>備註</label><textarea id="payNote"></textarea>
      <button class="green" onclick="registerPayment()">登錄收款並沖帳</button>
      <div id="payMsg" class="msg">尚未登錄。</div>
    </section>

    <section class="card span6">
      <h2>登錄支出</h2>
      <label>系統活動編號＊</label><input id="expActivityId" placeholder="ACT-115-0001">
      <div class="row"><div><label>支出日期</label><input id="expDate" type="date"></div><div><label>支出金額＊</label><input id="expAmount" type="number" min="0"></div></div>
      <label>支出類型</label><select id="expType"><option>講師費</option><option>餐費</option><option>印刷費</option><option>交通費</option><option>場地費</option><option>行政雜支</option><option>其他</option></select>
      <label>支出項目</label><input id="expItem" placeholder="例如：便當、講義印刷、講師鐘點費">
      <label>付款方式</label><select id="expMethod"><option>現金</option><option>匯款</option><option>信用卡</option><option>其他</option></select>
      <label>收據狀態</label><select id="expReceipt"><option>未取得</option><option>已取得</option><option>不適用</option></select>
      <label>備註</label><textarea id="expNote"></textarea>
      <button class="orange" onclick="registerExpense()">登錄支出</button>
      <div id="expMsg" class="msg">尚未登錄。</div>
    </section>

    <section class="card span6">
      <h2>財務查詢</h2>
      <label>活動ID／關鍵字</label><input id="financeKeyword" placeholder="可輸入活動ID、單位名稱或關鍵字">
      <div class="btns"><button onclick="queryUnpaid()">查詢未收款</button><button class="secondary" onclick="queryPL()">查詢專案損益</button></div>
      <div id="financeMsg" class="msg">尚未查詢。</div>
      <div id="financeTable"></div>
    </section>

    <section class="card span6" id="secretary">
      <h2>活動提醒</h2>
      <label>系統活動編號</label><input id="reminderActivityId" placeholder="ACT-115-0001">
      <div class="btns"><button onclick="createReminder()">建立活動提醒</button><button class="secondary" onclick="queryTodayReminder()">查詢今日提醒</button><button class="secondary" onclick="runReminderCheck()">執行提醒檢查</button></div>
      <div id="reminderMsg" class="msg">尚未操作。</div>
    </section>

    <section class="card span6">
      <h2>AI秘書查詢</h2>
      <label>輸入指令</label>
      <textarea id="secretaryText" placeholder="今天要做什麼&#10;今日提醒&#10;今日任務&#10;查詢未收款&#10;查詢缺件&#10;查詢損益"></textarea>
      <div class="btns"><button onclick="askSecretary()">送出秘書指令</button><button class="secondary" onclick="dailySummary()">產生今日摘要</button></div>
      <div id="secretaryMsg" class="msg">尚未查詢。</div>
      <div id="secretaryTable"></div>
    </section>
  </div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';
const PLAN_FEATURES={FREE:{finance:false,ai_secretary:false},STARTER:{finance:true,ai_secretary:false},PRO:{finance:true,ai_secretary:true},ENTERPRISE:{finance:true,ai_secretary:true}};
function safeJSON(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}}
function getGovOpsProfile(){return safeJSON('govops_profile')}
function getGovOpsAuth(){return safeJSON('govops_auth')}
function getGovOpsUsage(){return safeJSON('govops_usage')}
function getGovOpsSession(){const profile=getGovOpsProfile();const auth=getGovOpsAuth();const usage=getGovOpsUsage();const tenantId=profile.tenantId||auth.tenantId||'TENANT-LOCAL';const userId=profile.userId||auth.userId||'USER-LOCAL';const userRole=(auth.userRole||profile.userRole||profile.role||'owner').toLowerCase();const plan=(auth.plan||profile.plan||'FREE').toUpperCase();return{tenantId,userId,userName:profile.userName||profile.name||profile.orgName||'本機使用者',organizationName:profile.organizationName||profile.orgName||profile.userName||'本機組織',userRole,plan,status:auth.status||profile.status||'active',usage}}
function canUseFeature(feature){const s=getGovOpsSession();const plan=PLAN_FEATURES[s.plan]||PLAN_FEATURES.FREE;return !!plan[feature]}
function canUseFinance(){const s=getGovOpsSession();return canUseFeature('finance')&&['owner','admin','finance'].includes(s.userRole)}
function canUseAISecretary(){const s=getGovOpsSession();if(!canUseFeature('ai_secretary'))return false;if(s.userRole==='viewer')return false;return ['owner','admin','staff','finance'].includes(s.userRole)}
function saasParams(params){const s=getGovOpsSession();return Object.assign({},params,{tenantId:s.tenantId,userId:s.userId,userRole:s.userRole,plan:s.plan,使用者ID:s.userId,組織ID:s.tenantId,使用者角色:s.userRole,SaaS方案:s.plan})}
function show(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg||''}
function showFinanceGate(message){const el=document.getElementById('financeGateMsg');if(el){el.style.display='block';el.textContent=message}renderFinanceSaaSPanel()}
function renderFinanceSaaSPanel(){const s=getGovOpsSession();const u=s.usage||{};const panel=document.getElementById('financeSaaSPanel');if(!panel)return;panel.innerHTML=`<div class="saasbox"><b>${s.organizationName}</b><div class="small">tenantId：${s.tenantId}<br>userId：${s.userId}</div></div><div class="saasbox"><b>${s.userName}</b><div class="small">角色：${s.userRole}<br>狀態：${s.status}</div></div><div class="saasbox"><b>${s.plan}</b><div class="small">財務權限：${canUseFinance()?'可使用':'不可使用'}<br>AI秘書：${canUseAISecretary()?'可使用':'不可使用'}</div></div><div class="saasbox"><b>本月使用量</b><div class="small">活動：${u.events||0}<br>CRM：${u.crm||0}<br>AI查詢：${u.ai||0}</div></div>`;const gate=document.getElementById('financeGateMsg');if(gate&&canUseFinance()||canUseAISecretary()){gate.style.display='none'}}
function dateTW(id){const el=document.getElementById(id);const v=el?el.value:'';if(!v)return'';const a=v.split('-');return a[0]+'/'+a[1]+'/'+a[2]}
async function api(params,target){try{params=saasParams(params);show(target,'處理中，請稍候...');const res=await fetch(API_URL+'?'+new URLSearchParams(params).toString());const data=await res.json();show(target,formatResult(data));return data}catch(e){show(target,'系統暫時無法完成操作，請稍後再試。');return{success:false}}}
function formatResult(data){let text=(data&&data.message)||'操作完成';if(data&&data.data){const d=data.data;if(d.應收ID)text+='\n應收ID：'+d.應收ID;if(d.收款ID)text+='\n收款ID：'+d.收款ID;if(d.支出ID)text+='\n支出ID：'+d.支出ID;if(d.提醒數!==undefined)text+='\n提醒數：'+d.提醒數;if(d.摘要內容)text+='\n\n'+d.摘要內容}return text}
function renderTable(resp,id){const box=document.getElementById(id);if(!box)return;const d=resp&&resp.data;const arr=d&&(d.結果||d.資料||d.提醒||d.缺件||d.任務);if(!Array.isArray(arr)||!arr.length){box.innerHTML='';return}const keys=Object.keys(arr[0]).filter(k=>k!=='_row').slice(0,7);box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+arr.slice(0,30).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function healthCheck(){await api({action:'系統健康檢查'},'testMsg')}
async function initFinance(){await api({action:'初始化財務資料表'},'testMsg')}
async function initReminder(){await api({action:'初始化提醒中心'},'testMsg')}
async function createAR(){if(!canUseFinance()){showFinanceGate('目前方案或角色無法使用財務功能，請升級方案或切換管理者／財務角色。');return}await api({action:'建立應收帳款',活動ID:arActivityId.value,對象名稱:arTarget.value,應收項目:arItem.value,應收金額:arAmount.value,預計收款日:dateTW('arDueDate'),備註:arNote.value},'arMsg')}
async function registerPayment(){if(!canUseFinance()){showFinanceGate('目前方案或角色無法使用財務功能，請升級方案或切換管理者／財務角色。');return}await api({action:'登錄收款',應收ID:payArId.value,活動ID:payActivityId.value,收款金額:payAmount.value,收款日期:dateTW('payDate'),收款方式:payMethod.value,付款人:payer.value,備註:payNote.value},'payMsg')}
async function registerExpense(){if(!canUseFinance()){showFinanceGate('目前方案或角色無法使用財務功能，請升級方案或切換管理者／財務角色。');return}await api({action:'登錄支出',活動ID:expActivityId.value,支出日期:dateTW('expDate'),支出金額:expAmount.value,支出類型:expType.value,支出項目:expItem.value,付款方式:expMethod.value,收據狀態:expReceipt.value,備註:expNote.value},'expMsg')}
async function queryUnpaid(){if(!canUseFinance()){showFinanceGate('目前方案或角色無法使用財務功能，請升級方案或切換管理者／財務角色。');return}const r=await api({action:'查詢未收款',keyword:financeKeyword.value},'financeMsg');renderTable(r,'financeTable')}
async function queryPL(){if(!canUseFinance()){showFinanceGate('目前方案或角色無法使用財務功能，請升級方案或切換管理者／財務角色。');return}const r=await api({action:'查詢專案損益',活動ID:financeKeyword.value},'financeMsg');renderTable(r,'financeTable')}
async function createReminder(){if(!canUseAISecretary()){showFinanceGate('目前方案或角色無法使用 AI 秘書功能，請升級至 PRO 或 ENTERPRISE。');return}await api({action:'建立活動提醒',活動ID:reminderActivityId.value},'reminderMsg')}
async function queryTodayReminder(){if(!canUseAISecretary()){showFinanceGate('目前方案或角色無法使用 AI 秘書功能，請升級至 PRO 或 ENTERPRISE。');return}const r=await api({action:'查詢今日提醒'},'reminderMsg');renderTable(r,'secretaryTable')}
async function runReminderCheck(){if(!canUseAISecretary()){showFinanceGate('目前方案或角色無法使用 AI 秘書功能，請升級至 PRO 或 ENTERPRISE。');return}const r=await api({action:'執行提醒檢查'},'reminderMsg');renderTable(r,'secretaryTable')}
async function askSecretary(){if(!canUseAISecretary()){showFinanceGate('目前方案或角色無法使用 AI 秘書功能，請升級至 PRO 或 ENTERPRISE。');return}const r=await api({action:'AI秘書查詢',text:secretaryText.value},'secretaryMsg');renderTable(r,'secretaryTable')}
async function dailySummary(){if(!canUseAISecretary()){showFinanceGate('目前方案或角色無法使用 AI 秘書功能，請升級至 PRO 或 ENTERPRISE。');return}const r=await api({action:'產生秘書摘要'},'secretaryMsg');renderTable(r,'secretaryTable')}
renderFinanceSaaSPanel();
healthCheck();
</script>
</body>
</html>
