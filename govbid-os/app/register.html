<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜建立帳號</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
<style>
body{min-height:100vh;background:linear-gradient(135deg,#0d1f37 0%,#1a3a6c 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.reg-card{background:#0e1e31;border:1.5px solid #1e3a5c;border-radius:16px;padding:36px 32px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand{font-size:1.1rem;font-weight:700;color:#b8963e;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.brand::before{content:'';display:block;width:4px;height:1.1em;background:#b8963e;border-radius:2px}
.subtitle{font-size:.82rem;color:#7a9bc5;margin-bottom:24px}
.badge{display:inline-block;background:rgba(184,150,62,.15);border:1px solid rgba(184,150,62,.4);color:#b8963e;border-radius:4px;font-size:.72rem;padding:2px 8px;margin-bottom:20px}
.section-sep{font-size:.75rem;font-weight:700;color:#4a6a8c;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 10px}
.fi label{display:block;font-size:.8rem;font-weight:600;color:#7a9bc5;margin-bottom:4px}
.fi input,.fi select{width:100%;padding:9px 12px;background:#0a1628;border:1.5px solid #1e3a5c;border-radius:6px;color:#ccd6f6;font-size:.9rem;font-family:inherit;box-sizing:border-box}
.fi input:focus,.fi select:focus{outline:none;border-color:#b8963e;box-shadow:0 0 0 3px rgba(184,150,62,.12)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.plan-card{border:1.5px solid #1e3a5c;border-radius:8px;padding:10px 12px;cursor:pointer;transition:.2s}
.plan-card:hover{border-color:#b8963e}
.plan-card.active{border-color:#b8963e;background:rgba(184,150,62,.08)}
.plan-card input{display:none}
.plan-name{font-size:.85rem;font-weight:700;color:#ccd6f6}
.plan-price{font-size:.75rem;color:#7a9bc5;margin-top:2px}
.plan-badge{font-size:.68rem;background:#b8963e;color:#000;border-radius:3px;padding:1px 6px;float:right}
.submit-btn{width:100%;margin-top:20px;padding:13px;background:#b8963e;color:#000;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.submit-btn:hover{background:#d4a84e}
.submit-btn:disabled{opacity:.5;cursor:wait}
.err{background:rgba(192,57,43,.12);color:#e74c3c;border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:10px 14px;font-size:.83rem;margin-top:12px;display:none}
.login-link{text-align:center;margin-top:14px;font-size:.82rem;color:#7a9bc5}
.login-link a{color:#b8963e;text-decoration:none;font-weight:600}
.login-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="reg-card">
  <div class="brand">GovOps OS</div>
  <div class="subtitle">政府標案全流程營運系統｜SaaS 商業版 MVP</div>
  <div class="badge">建立新租戶帳號</div>

  <div class="section-sep">組織資訊</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="fi"><label>公司／工作室／單位名稱 *</label><input id="r_org" placeholder="例如：璞策顧問工作室" autocomplete="organization"></div>
    <div class="fr">
      <div class="fi"><label>組織類型</label>
        <select id="r_orgType">
          <option value="顧問工作室">顧問工作室</option>
          <option value="顧問公司">顧問公司</option>
          <option value="訓練機構">訓練機構</option>
          <option value="協會公會">協會公會</option>
          <option value="政府機關">政府機關</option>
          <option value="個人工作者">個人工作者</option>
        </select>
      </div>
      <div class="fi"><label>主要聯絡電話</label><input id="r_phone" placeholder="選填" type="tel"></div>
    </div>
  </div>

  <div class="section-sep">使用者資訊</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="fi"><label>姓名 *</label><input id="r_name" placeholder="您的真實姓名" autocomplete="name"></div>
    <div class="fi"><label>Email（登入用）*</label><input id="r_email" type="email" placeholder="your@email.com" autocomplete="email"></div>
    <div class="fr">
      <div class="fi"><label>密碼 *（至少 6 字元）</label><input id="r_pwd" type="password" placeholder="●●●●●●" autocomplete="new-password"></div>
      <div class="fi"><label>確認密碼 *</label><input id="r_pwd2" type="password" placeholder="●●●●●●" autocomplete="new-password"></div>
    </div>
  </div>

  <div class="section-sep">訂閱方案</div>
  <div class="plan-grid" id="planGrid">
    <label class="plan-card active" onclick="selectPlan('free',this)">
      <input type="radio" name="plan" value="free" checked>
      <span class="plan-badge">推薦</span>
      <div class="plan-name">Free 試用</div>
      <div class="plan-price">免費｜5案件 · 2用戶</div>
    </label>
    <label class="plan-card" onclick="selectPlan('basic',this)">
      <input type="radio" name="plan" value="basic">
      <div class="plan-name">Basic</div>
      <div class="plan-price">NT$990/月｜20案件 · 5用戶</div>
    </label>
    <label class="plan-card" onclick="selectPlan('pro',this)">
      <input type="radio" name="plan" value="pro">
      <div class="plan-name">Pro</div>
      <div class="plan-price">NT$2,490/月｜50案件 · 10用戶</div>
    </label>
    <label class="plan-card" onclick="selectPlan('team',this)">
      <input type="radio" name="plan" value="team">
      <div class="plan-name">Team</div>
      <div class="plan-price">NT$5,990/月｜200案件 · 30用戶</div>
    </label>
  </div>
  <div style="font-size:.73rem;color:#4a6a8c;margin-top:4px">v0.1 MVP 期間所有方案均免費使用，金流後續開放。</div>

  <div class="err" id="errMsg"></div>
  <button class="submit-btn" id="submitBtn" onclick="doRegister()">建立帳號並進入系統</button>
  <div class="login-link">已有帳號？<a href="./login.html">立即登入 →</a></div>
</div>

<script src="./govops-api-client.js"></script>
<script>
var _selectedPlan = 'free';
function selectPlan(id, el) {
  _selectedPlan = id;
  document.querySelectorAll('.plan-card').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
}

async function doRegister() {
  var org    = document.getElementById('r_org').value.trim();
  var name   = document.getElementById('r_name').value.trim();
  var email  = document.getElementById('r_email').value.trim();
  var pwd    = document.getElementById('r_pwd').value;
  var pwd2   = document.getElementById('r_pwd2').value;
  var orgType = document.getElementById('r_orgType').value;
  var err = document.getElementById('errMsg');
  err.style.display = 'none';

  if (!org)   { showErr('請填寫公司／工作室名稱'); return; }
  if (!name)  { showErr('請填寫您的姓名'); return; }
  if (!email) { showErr('請填寫 Email'); return; }
  if (pwd.length < 6) { showErr('密碼至少 6 個字元'); return; }
  if (pwd !== pwd2)   { showErr('兩次密碼不一致'); return; }

  var btn = document.getElementById('submitBtn');
  btn.textContent = '建立中…'; btn.disabled = true;

  var r = await GovOpsAPI.post({
    action: 'registerTenant',
    tenantName: org, orgType: orgType,
    userName: name, email: email, password: pwd, planId: _selectedPlan
  });

  btn.textContent = '建立帳號並進入系統'; btn.disabled = false;

  if (!r.success) { showErr(r.message || '建立失敗，請稍後再試'); return; }

  // 儲存 session
  saveSession(r.data);
  window.location.href = './dashboard.html';
}

function showErr(msg) {
  var el = document.getElementById('errMsg');
  el.textContent = msg; el.style.display = '';
}

function saveSession(d) {
  localStorage.setItem('govops_auth', JSON.stringify({
    sessionToken: d.sessionToken, userId: d.userId, tenantId: d.tenantId,
    workspaceId: d.workspaceId, workspaceName: d.workspaceName,
    userName: d.userName, email: d.email, role: d.role,
    planId: d.planId, planName: d.planName, isLoggedIn: true,
    loginTime: d.loginTime, expireTime: d.expireTime
  }));
  localStorage.setItem('govops_profile', JSON.stringify({
    userId: d.userId, userName: d.userName, email: d.email,
    role: d.role, tenantId: d.tenantId, workspaceId: d.workspaceId,
    orgName: d.workspaceName, plan: d.planId, isLoggedIn: true
  }));
}

// 已登入直接進入 dashboard
(function(){ try {
  var auth = JSON.parse(localStorage.getItem('govops_auth')||'{}');
  if (auth.sessionToken && auth.isLoggedIn) window.location.href = './dashboard.html';
} catch(e) {} })();
</script>
</body>
</html>
