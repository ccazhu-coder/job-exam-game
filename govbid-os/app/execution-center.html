<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GovOps ERP｜活動執行中心</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:28px 22px}main{max-width:1280px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}label{display:block;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px}textarea{min-height:80px}button{border:0;border-radius:12px;padding:12px 14px;background:#1d4e89;color:#fff;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.good{background:#12805c}.secondary{background:#e8eef7;color:#1d3557}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:420px;overflow:auto}.ok{background:#ecfdf3;border-color:#12b76a}.bad{background:#fff8e6;border-color:#f2c94c}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc}@media(max-width:900px){.span-6,.span-4,.span-3{grid-column:span 12}}@media(max-width:520px){button{width:100%}}</style></head><body><header><h1>GovOps ERP｜活動執行中心</h1><div>活動當日執行、出席管理、滿意度、成果照片、簽到表、核銷附件</div></header><main><section class="card"><div class="grid"><div class="span-4"><label>專案ID</label><input id="projectId"></div><div class="span-4"><label>場次ID</label><input id="eventId"></div><div class="span-4"><label>活動名稱</label><input id="eventName"></div></div><button class="good" onclick="loadProject()">載入專案</button><button class="secondary" onclick="location.href='./project-detail.html?projectId='+encodeURIComponent(val('projectId'))">回專案營運中心</button><button class="secondary" onclick="location.href='./projectops-home.html'">回ERP首頁</button><div id="result" class="status">請輸入專案ID與場次ID。</div></section><section class="card"><h2>出席管理</h2><div class="grid"><div class="span-3"><label>應出席人數</label><input id="expected" type="number"></div><div class="span-3"><label>實際出席人數</label><input id="actual" type="number"></div><div class="span-3"><label>缺席人數</label><input id="absent" type="number"></div><div class="span-3"><label>備註</label><input id="attNote"></div></div><button onclick="saveAttendance()">儲存出席統計</button></section><section class="card"><h2>滿意度</h2><div class="grid"><div class="span-4"><label>問卷方式</label><select id="surveyType"><option>紙本問卷</option><option>Google表單</option><option>其他線上問卷</option></select></div><div class="span-4"><label>滿意度平均</label><input id="satAvg" type="number" step="0.1"></div><div class="span-4"><label>問卷連結</label><input id="surveyUrl"></div><div class="span-12"><label>意見摘要 / 改善建議</label><textarea id="surveyNote"></textarea></div></div><button onclick="saveSatisfaction()">儲存滿意度</button></section><section class="card"><h2>成果與附件</h2><div class="grid"><div class="span-4"><label>附件類別</label><select id="fileType"><option>成果照片</option><option>簽到表</option><option>滿意度資料</option><option>核銷憑證</option><option>會議紀錄</option><option>其他附件</option></select></div><div class="span-4"><label>檔案名稱</label><input id="fileName"></div><div class="span-4"><label>Drive / 檔案 URL</label><input id="fileUrl"></div><div class="span-6"><label>是否納入結案</label><select id="includeClosing"><option>是</option><option>否</option></select></div><div class="span-6"><label>是否納入核銷</label><select id="includeReimburse"><option>否</option><option>是</option></select></div></div><button onclick="saveFile()">新增附件</button><button onclick="createReimburseFromFile()">新增核銷附件紀錄</button></section><section class="card"><h2>執行資料總覽</h2><button onclick="loadProject()">重新整理</button><div id="tableBox"></div></section></main><script>const CONFIG_API_URL=(window.GOVOPS_CONFIG&&(window.GOVOPS_CONFIG.API_URL||window.GOVOPS_CONFIG.apiUrl))||'';const FALLBACK_API_URL='https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';const API_URL=CONFIG_API_URL||FALLBACK_API_URL;function $(id){return document.getElementById(id)}function val(id){return($(id)||{}).value||''}function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function base(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role,plan:u.plan,專案ID:val('projectId'),場次ID:val('eventId'),活動名稱:val('eventName')},x||{})}function show(x,cls){$('result').className='status '+(cls||'');$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function api(data,opt){opt=opt||{};if(!opt.silent)show('處理中...');try{let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}if(!opt.silent)show(res,res&&res.success?'ok':'bad');return res}catch(e){const out={success:false,message:'API呼叫失敗',data:{error:String(e)}};if(!opt.silent)show(out,'bad');return out}}async function loadProject(){const r=await api(base({action:'project.detail.get'}));if(r.success)render(r.data.detail)}async function saveAttendance(){await api(base({action:'execution.attendance.record',應出席人數:val('expected'),實際出席人數:val('actual'),缺席人數:val('absent'),備註:val('attNote')}));loadProject()}async function saveSatisfaction(){await api(base({action:'execution.satisfaction.record',問卷方式:val('surveyType'),滿意度平均:val('satAvg'),問卷連結:val('surveyUrl'),意見摘要:val('surveyNote')}));loadProject()}async function saveFile(){await api(base({action:'file.center.create',檔案類別:val('fileType'),檔案名稱:val('fileName'),DriveURL:val('fileUrl'),是否納入結案:val('includeClosing'),是否納入核銷:val('includeReimburse')}));loadProject()}async function createReimburseFromFile(){await api(base({action:'project.finance.reimburse.record',核銷類型:val('fileType'),金額:0,憑證URL:val('fileUrl'),備註:val('fileName')}));loadProject()}function render(d){if(!d){$('tableBox').innerHTML='';return}const groups=[['場次',d.events],['報名',d.registrations],['名冊',d.roster],['檔案',d.files],['財務',d.finance],['結案',d.closing]];$('tableBox').innerHTML=groups.map(g=>'<h3>'+g[0]+'（'+((g[1]||[]).length)+'）</h3>'+table(g[1]||[])).join('')}function table(rows){if(!rows.length)return'<div class="status">無資料</div>';const keys=Object.keys(rows[0]).filter(k=>k!=='_row').slice(0,6);return'<table><thead><tr>'+keys.map(k=>'<th>'+safe(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,20).map(r=>'<tr>'+keys.map(k=>'<td>'+safe(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function safe(x){return String(x===undefined||x===null?'':x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}const url=new URL(location.href);if(url.searchParams.get('projectId'))$('projectId').value=url.searchParams.get('projectId');if(url.searchParams.get('eventId'))$('eventId').value=url.searchParams.get('eventId');if(val('projectId'))loadProject();</script></body></html>
