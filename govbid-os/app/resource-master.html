<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜人員主檔</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">政府標案全流程營運系統</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>人員主檔</h1>
    <p>管理講師、攝影師、場務、司機等人員資料，含扣繳與匯款資訊</p>
  </div>

  <div class="btns" style="margin-bottom:12px">
    <button id="tabLec" class="gold" onclick="switchTab('lec')">講師主檔</button>
    <button id="tabStf" class="secondary" onclick="switchTab('stf')">工作人員主檔</button>
  </div>

  <!-- ══ 講師 ══ -->
  <div id="secLec">
    <div class="card">
      <div class="btns" style="margin-bottom:10px">
        <button class="gold" onclick="openLecCreate()">＋ 新增講師</button>
        <div style="flex:1"></div>
        <input id="lecKeyword" placeholder="姓名、電話、專業領域…" style="max-width:240px;margin:0" onkeydown="if(event.key==='Enter')queryLec()">
        <button onclick="queryLec()">查詢</button>
      </div>
      <div id="lecQueryMsg" class="msg">載入中…</div>
      <div id="lecTable" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- ══ 工作人員 ══ -->
  <div id="secStf" style="display:none">
    <div class="card">
      <div class="btns" style="margin-bottom:10px;flex-wrap:wrap">
        <button class="gold" onclick="openStfCreate()">＋ 新增工作人員</button>
        <select id="stfType" onchange="queryStf()" style="max-width:140px">
          <option value="">全部職務</option>
          <option>攝影</option><option>錄影</option><option>主持</option>
          <option>場務</option><option>行政協助</option><option>交通接送</option>
          <option>餐飲服務</option><option>技術支援</option><option>其他</option>
        </select>
        <div style="flex:1"></div>
        <input id="stfKeyword" placeholder="姓名、電話、備註…" style="max-width:220px;margin:0" onkeydown="if(event.key==='Enter')queryStf()">
        <button onclick="queryStf()">查詢</button>
      </div>
      <div id="stfQueryMsg" class="msg">載入中…</div>
      <div id="stfTable" style="margin-top:8px"></div>
    </div>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

// Tab 切換
function switchTab(tab){
  document.getElementById('secLec').style.display=tab==='lec'?'':'none';
  document.getElementById('secStf').style.display=tab==='stf'?'':'none';
  document.getElementById('tabLec').className=tab==='lec'?'gold':'secondary';
  document.getElementById('tabStf').className=tab==='stf'?'gold':'secondary';
  tab==='lec'?queryLec():queryStf();
}

// 講師 Fields
const LEC_CREATE = [
  {name:'姓名', label:'姓名＊'},
  {name:'電話', label:'電話', type:'tel'},
  {name:'Email', label:'Email', type:'email'},
  {name:'專業領域', label:'專業領域'},
  {name:'時薪', label:'時薪／課酬（元）', type:'number'},
  {name:'銀行', label:'銀行'},
  {name:'帳號', label:'帳號'},
  {name:'戶名', label:'戶名'},
  {name:'統編/身分證', label:'統編／身分證'},
  {name:'是否扣繳', label:'是否扣繳', type:'select', options:['','是','否']},
  {name:'扣繳類型', label:'扣繳類型', type:'select', options:['執行業務所得','薪資','稿費','其他']},
  {name:'評價', label:'評價', type:'select', options:['','5','4','3','2','1']},
  {name:'備註', label:'備註', type:'textarea'}
];
const LEC_EDIT = [{name:'講師ID',label:'講師 ID',readonly:true},...LEC_CREATE];

function openLecCreate(){ERPALIGNED.showEditModal('新增講師',LEC_CREATE,{},'新增講師',null,queryLec);}
function openLecEdit(row){ERPALIGNED.showEditModal('編輯講師：'+row['姓名'],LEC_EDIT,row,'修改講師','講師ID',queryLec);}
async function queryLec(){
  const r=await ERPALIGNED.api({action:'查詢講師',keyword:document.getElementById('lecKeyword').value},'lecQueryMsg');
  ERPALIGNED.renderTableWithEdit(r,'lecTable',openLecEdit,['講師ID','姓名','電話','專業領域','時薪','銀行','是否扣繳','評價']);
}

// 工作人員 Fields
const STF_CREATE = [
  {name:'姓名', label:'姓名＊'},
  {name:'電話', label:'電話', type:'tel'},
  {name:'Email', label:'Email', type:'email'},
  {name:'職務類型', label:'職務類型', type:'select', options:['攝影','錄影','主持','場務','行政協助','交通接送','餐飲服務','技術支援','其他']},
  {name:'時薪', label:'時薪（元）', type:'number'},
  {name:'銀行', label:'銀行'},
  {name:'帳號', label:'帳號'},
  {name:'戶名', label:'戶名'},
  {name:'統編/身分證', label:'統編／身分證'},
  {name:'是否扣繳', label:'是否扣繳', type:'select', options:['','是','否']},
  {name:'評價', label:'評價', type:'select', options:['','5','4','3','2','1']},
  {name:'備註', label:'備註', type:'textarea'}
];
const STF_EDIT = [{name:'人員ID',label:'人員 ID',readonly:true},...STF_CREATE];

function openStfCreate(){ERPALIGNED.showEditModal('新增工作人員',STF_CREATE,{},'新增工作人員',null,queryStf);}
function openStfEdit(row){ERPALIGNED.showEditModal('編輯工作人員：'+row['姓名'],STF_EDIT,row,'修改工作人員','人員ID',queryStf);}
async function queryStf(){
  const r=await ERPALIGNED.api({action:'查詢工作人員',keyword:document.getElementById('stfKeyword').value,職務類型:document.getElementById('stfType').value},'stfQueryMsg');
  ERPALIGNED.renderTableWithEdit(r,'stfTable',openStfEdit,['人員ID','姓名','電話','職務類型','時薪','銀行','是否扣繳','評價']);
}

// 支援 ?tab=stf 自動切換
const _tab = new URLSearchParams(location.search).get('tab');
if(_tab==='stf') switchTab('stf'); else queryLec();
</script>
</body>
</html>
