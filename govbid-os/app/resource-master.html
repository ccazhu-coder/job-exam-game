<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜正式資源主檔管理</title>
<script src="./config.js"></script>
<script src="./saas-runtime.js"></script>
<script src="./govops-api-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:white;padding:30px 20px}.wrap{max-width:1220px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.sub{opacity:.92;line-height:1.7;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}textarea{min-height:92px}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.danger{background:#b42318}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#344054}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{background:#eef3f8;color:#1d3557}.tab.active{background:#1d4e89;color:#fff}.panel{display:none}.panel.active{display:block}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><h1>正式資源主檔管理</h1><div class="sub">Master Data｜講師、工作人員、合作廠商與自訂資源類型。資料只建一次，後續履約執行直接選用。</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span-12"><h2>主檔總覽</h2><label>關鍵字</label><input id="keyword" placeholder="姓名、廠商、類型、專長、地區"><button class="good" onclick="queryAll()">查詢主檔</button><button class="secondary" onclick="seedTypes()">建立預設類型</button><button class="secondary" onclick="location.href='./tender-execution.html'">履約執行</button><button class="secondary" onclick="location.href='./tender-erp.html'">回標案 ERP</button><div class="kpis" id="kpiBox"></div><div id="mainResult" class="status">尚未操作。</div></section>
<section class="card span-12"><div class="tabs"><button class="tab active" onclick="showPanel('types')">類型主檔</button><button class="tab" onclick="showPanel('lecturer')">講師</button><button class="tab" onclick="showPanel('staff')">工作人員</button><button class="tab" onclick="showPanel('vendor')">合作廠商</button></div>
<div id="types" class="panel active"><h2>新增自訂資源類型</h2><div class="grid"><div class="span-4"><label>資源類別</label><select id="typeCategory"><option>講師</option><option>工作人員</option><option>合作廠商</option></select></div><div class="span-4"><label>類型名稱</label><input id="typeName" placeholder="例：身心靈療癒類、短影音拍攝類"></div><div class="span-4"><label>上層類型</label><input id="parentType"></div><div class="span-4"><label>排序</label><input id="typeSort" value="999"></div><div class="span-4"><label>狀態</label><select id="typeStatus"><option>啟用</option><option>停用</option></select></div></div><button class="good" onclick="createType()">新增類型</button><button onclick="queryTypes()">查詢類型</button></div>
<div id="lecturer" class="panel"><h2>講師基本資料</h2><div class="grid"><div class="span-4"><label>姓名</label><input id="lecName"></div><div class="span-4"><label>專業類型</label><select id="lecType"></select></div><div class="span-4"><label>課程領域</label><input id="lecField"></div><div class="span-6"><label>可授課主題</label><input id="lecTopics"></div><div class="span-6"><label>服務對象專長</label><input id="lecAudience"></div><div class="span-6"><label>證照資格</label><input id="lecCert"></div><div class="span-6"><label>授課地區</label><input id="lecArea"></div><div class="span-4"><label>授課方式</label><input id="lecMode" value="實體/線上皆可"></div><div class="span-4"><label>鐘點費/報價</label><input id="lecFee"></div><div class="span-4"><label>聯絡電話</label><input id="lecPhone"></div><div class="span-4"><label>Email</label><input id="lecEmail"></div><div class="span-4"><label>LineID</label><input id="lecLine"></div><div class="span-4"><label>狀態</label><select id="lecStatus"><option>可邀課</option><option>暫停合作</option><option>黑名單</option></select></div><div class="span-12"><label>學經歷摘要</label><textarea id="lecBio"></textarea></div></div><button class="good" onclick="createLecturer()">建立講師</button><button onclick="queryLecturers()">查詢講師</button></div>
<div id="staff" class="panel"><h2>工作人員基本資料</h2><div class="grid"><div class="span-4"><label>姓名</label><input id="staffName"></div><div class="span-4"><label>人員類型</label><select id="staffType"></select></div><div class="span-4"><label>可服務地區</label><input id="staffArea"></div><div class="span-6"><label>可支援工作</label><input id="staffTasks"></div><div class="span-6"><label>專長技能</label><input id="staffSkills"></div><div class="span-4"><label>聯絡電話</label><input id="staffPhone"></div><div class="span-4"><label>Email</label><input id="staffEmail"></div><div class="span-4"><label>LineID</label><input id="staffLine"></div><div class="span-4"><label>時薪/日薪/報價</label><input id="staffRate"></div><div class="span-4"><label>可配合時段</label><input id="staffTime"></div><div class="span-4"><label>狀態</label><select id="staffStatus"><option>可派工</option><option>暫停派工</option><option>黑名單</option></select></div></div><button class="good" onclick="createStaff()">建立工作人員</button><button onclick="queryStaff()">查詢工作人員</button></div>
<div id="vendor" class="panel"><h2>合作廠商基本資料</h2><div class="grid"><div class="span-4"><label>廠商名稱</label><input id="vendorName"></div><div class="span-4"><label>廠商類型</label><select id="vendorType"></select></div><div class="span-4"><label>聯絡人</label><input id="vendorContact"></div><div class="span-6"><label>服務項目</label><input id="vendorServices"></div><div class="span-6"><label>地址</label><input id="vendorAddress"></div><div class="span-4"><label>電話</label><input id="vendorPhone"></div><div class="span-4"><label>Email</label><input id="vendorEmail"></div><div class="span-4"><label>LineID</label><input id="vendorLine"></div><div class="span-4"><label>統一編號</label><input id="vendorTax"></div><div class="span-4"><label>報價方式</label><input id="vendorQuote"></div><div class="span-4"><label>可服務地區</label><input id="vendorArea"></div><div class="span-4"><label>狀態</label><select id="vendorStatus"><option>可合作</option><option>暫停合作</option><option>黑名單</option></select></div></div><button class="good" onclick="createVendor()">建立合作廠商</button><button onclick="queryVendors()">查詢合作廠商</button></div></section>
<section class="card span-12"><h2>資源類型</h2><div id="typeTable"></div></section>
<section class="card span-12"><h2>講師清單</h2><div id="lecturerTable"></div></section>
<section class="card span-6"><h2>工作人員清單</h2><div id="staffTable"></div></section>
<section class="card span-6"><h2>合作廠商清單</h2><div id="vendorTable"></div></section>
</div></main>
<script>
const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';
function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}
function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.userRole||u.role||'owner',plan:u.plan||'pro'},p||{})}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}
function showPanel(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');event.target.classList.add('active')}
function table(id,rows,keys,empty){rows=rows||[];const box=document.getElementById(id);if(!rows.length){box.innerHTML='<div class="status">'+(empty||'無資料')+'</div>';return}box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,200).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function fillSelect(id,opts){const el=document.getElementById(id);el.innerHTML=(opts||[]).map(o=>'<option value="'+o.value+'">'+o.label+'</option>').join('')+'<option value="其他">其他</option>'}
function renderKpis(types,lec,staff,vendor){const items=[['類型',types.total||0],['講師',lec.total||0],['工作人員',staff.total||0],['合作廠商',vendor.total||0],['總主檔',(lec.total||0)+(staff.total||0)+(vendor.total||0)]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}
async function seedTypes(){await api({action:'resource.type.seedDefaults'},'mainResult');await loadTypeOptions();queryTypes()}
async function loadTypeOptions(){const r=await api({action:'resource.type.options'},'mainResult');const g=(r.data&&r.data.grouped)||{};fillSelect('lecType',g['講師']||[]);fillSelect('staffType',g['工作人員']||[]);fillSelect('vendorType',g['合作廠商']||[]);return r.data||{}}
async function createType(){await api({action:'resource.type.create',資源類別:val('typeCategory'),類型名稱:val('typeName'),上層類型:val('parentType'),排序:val('typeSort'),狀態:val('typeStatus')},'mainResult');await loadTypeOptions();queryTypes()}
async function queryTypes(){const r=await api({action:'resource.type.query',keyword:val('keyword'),includeDisabled:true},'mainResult');table('typeTable',r.data&&r.data.rows,['資源類別','類型名稱','上層類型','排序','狀態','是否系統預設'],'無類型資料');return r.data||{}}
async function createLecturer(){await api({action:'resource.lecturer.create',姓名:val('lecName'),專業類型:val('lecType'),課程領域:val('lecField'),可授課主題:val('lecTopics'),服務對象專長:val('lecAudience'),證照資格:val('lecCert'),學經歷摘要:val('lecBio'),授課地區:val('lecArea'),授課方式:val('lecMode'),'鐘點費/報價':val('lecFee'),聯絡電話:val('lecPhone'),Email:val('lecEmail'),LineID:val('lecLine'),狀態:val('lecStatus')},'mainResult');queryLecturers()}
async function createStaff(){await api({action:'resource.staff.create',姓名:val('staffName'),人員類型:val('staffType'),可支援工作:val('staffTasks'),專長技能:val('staffSkills'),可服務地區:val('staffArea'),聯絡電話:val('staffPhone'),Email:val('staffEmail'),LineID:val('staffLine'),'時薪/日薪/報價':val('staffRate'),可配合時段:val('staffTime'),狀態:val('staffStatus')},'mainResult');queryStaff()}
async function createVendor(){await api({action:'resource.vendor.create',廠商名稱:val('vendorName'),廠商類型:val('vendorType'),服務項目:val('vendorServices'),聯絡人:val('vendorContact'),電話:val('vendorPhone'),Email:val('vendorEmail'),LineID:val('vendorLine'),地址:val('vendorAddress'),統一編號:val('vendorTax'),報價方式:val('vendorQuote'),可服務地區:val('vendorArea'),狀態:val('vendorStatus')},'mainResult');queryVendors()}
async function queryLecturers(){const r=await api({action:'resource.lecturer.query',keyword:val('keyword')},'mainResult');table('lecturerTable',r.data&&r.data.rows,['姓名','專業類型','課程領域','可授課主題','服務對象專長','證照資格','授課地區','授課方式','鐘點費/報價','狀態'],'無講師資料');return r.data||{}}
async function queryStaff(){const r=await api({action:'resource.staff.query',keyword:val('keyword')},'mainResult');table('staffTable',r.data&&r.data.rows,['姓名','人員類型','可支援工作','專長技能','可服務地區','時薪/日薪/報價','狀態'],'無工作人員資料');return r.data||{}}
async function queryVendors(){const r=await api({action:'resource.vendor.query',keyword:val('keyword')},'mainResult');table('vendorTable',r.data&&r.data.rows,['廠商名稱','廠商類型','服務項目','聯絡人','電話','統一編號','報價方式','可服務地區','狀態'],'無合作廠商資料');return r.data||{}}
async function queryAll(){const t=await queryTypes();const l=await queryLecturers();const s=await queryStaff();const v=await queryVendors();renderKpis(t,l,s,v)}
loadTypeOptions().then(queryAll);
</script>
</body>
</html>
