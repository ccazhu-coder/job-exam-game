<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovOps ERP｜自用正式版</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f4f7fb;color:#182033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:22px 16px}.wrap{max-width:1180px;margin:0 auto}.brand{font-size:24px;font-weight:900}.sub{margin-top:6px;opacity:.92;line-height:1.6}main{padding:16px 12px 96px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e7edf5;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(16,37,66,.08)}.span12{grid-column:span 12}.span6{grid-column:span 6}h2{margin:0 0 12px;font-size:19px}.hint{background:#eef6ff;border:1px solid #cfe6ff;color:#16436f;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}.warn{background:#fff8e6;border:1px solid #fedf89;color:#93370d;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}label{display:block;margin:10px 0 5px;font-weight:800;color:#344054}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e1ec;border-radius:12px;background:#fbfcff;font-size:16px}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:900;cursor:pointer;background:#1d4e89;color:#fff}button.secondary{background:#e8eef7;color:#1d3557}button.green{background:#12805c}button.danger{background:#b42318}.msg{margin-top:10px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cfd8e6;white-space:pre-wrap;line-height:1.65;max-height:260px;overflow:auto}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{background:#f8fafc;border:1px solid #e7edf5;border-radius:14px;padding:14px}.num{font-size:26px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px 7px;text-align:left;vertical-align:top}th{background:#f8fafc}.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.topnav a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 10px;border-radius:999px;font-weight:800;font-size:14px}.footerbar{display:none}.small{font-size:13px;color:#667085;line-height:1.6;margin-top:6px}
    @media(max-width:900px){.span6{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
    @media(max-width:560px){button{width:100%}.btns{display:block}.btns button{margin-bottom:8px}.kpis{grid-template-columns:1fr}.footerbar{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #d8e1ec;z-index:50}.footerbar a{text-align:center;padding:10px 4px;text-decoration:none;color:#1d3557;font-size:12px;font-weight:900}}
  </style>
</head>
<body>
<header><div class="wrap"><div class="brand">GovOps ERP｜自用正式版</div><div class="sub">專案、多場次、招生報名、通知、CRM、執行、財務、主檔、結案與查詢</div><nav class="topnav"><a href="#dashboard">首頁</a><a href="#auth-center">登入</a><a href="#project-management">專案</a><a href="#session-management">場次</a><a href="#plan-activity-query">查詢</a><a href="#notification-center">通知</a><a href="#finance">財務</a><a href="#master-data">主檔</a><a href="#closing-delivery">結案</a></nav></div></header>
<main class="wrap">
  <section id="dashboard" class="card span12" style="margin-bottom:14px"><h2>首頁儀表板</h2><div class="hint">目前已清空舊內容，改為整合版。請先登入，再建立專案與場次。</div><div class="btns"><button onclick="loadDashboard()">重新整理</button><button class="secondary" onclick="quickQuery('查詢今日任務')">今日任務</button><button class="secondary" onclick="quickQuery('查詢缺件')">查看缺件</button></div><div id="kpis" class="kpis" style="margin-top:12px"></div><div id="dashboardMsg" class="msg">尚未載入。</div></section>
  <div class="grid"></div>
</main>
<nav class="footerbar"><a href="#dashboard">首頁</a><a href="#project-management">專案</a><a href="#session-management">場次</a><a href="#notification-center">通知</a><a href="#finance">財務</a></nav>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwNWbHwPs9lw1qpbOi6HeQhNn3kHNfs6Ap9ybTnOX_u2bssBGKwtwfygwwGpYblj-vt2Q/exec';
function show(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg||''}
function getProfile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',orgName:'自用正式版',role:'owner',roleLabel:'負責人／系統管理者',plan:'internal',status:'active'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',orgName:'自用正式版',role:'owner',roleLabel:'負責人／系統管理者',plan:'internal',status:'active'}}}
function saasParams(params){const p=getProfile();return Object.assign({tenantId:p.tenantId,userId:p.userId,userRole:p.role,plan:'internal'},params)}
function friendly(data){if(!data)return'系統沒有回應';if(data.success===false)return data.message||'系統暫時無法完成操作';return data.message||'操作完成'}
function formatResult(data){let text=friendly(data);if(data&&data.data){const d=data.data;if(d.活動ID)text+='\n系統活動編號：'+d.活動ID;if(d.專案ID)text+='\n專案ID：'+d.專案ID;if(d.報名ID)text+='\n報名編號：'+d.報名ID;if(d.新增筆數!==undefined)text+='\n新增筆數：'+d.新增筆數;if(d.略過筆數!==undefined)text+='\n略過筆數：'+d.略過筆數;if(d.連結)text+='\n連結：'+d.連結}return text}
async function api(params,target){try{show(target,'處理中，請稍候...');const res=await fetch(API_URL+'?'+new URLSearchParams(saasParams(params)).toString());const data=await res.json();show(target,formatResult(data));return data}catch(e){show(target,'系統暫時無法完成操作，請稍後再試。');return{success:false}}}
function gate(){return true}function checkLimit(){return true}function renderSaaSPanel(){}
async function loadDashboard(){const r=await api({action:'取得儀表板'},'dashboardMsg');const d=(r&&r.data)||{};const keys=['今日活動','招生中活動','待審核報名','未完成任務','核銷缺件','最近異動'];document.getElementById('kpis').innerHTML=keys.map(k=>`<div class="kpi"><div class="num">${d[k]??0}</div><div class="name">${k}</div></div>`).join('')}
async function quickQuery(text){return api({action:'查詢',text:text,文字:text},'dashboardMsg')}
function dateTW(id){const v=document.getElementById(id)?.value;if(!v)return'';const a=v.split('-');return a[0]+'/'+a[1]+'/'+a[2]}
function fillActivityId(id){['activityId','regActivityId','taskActivityId','itemActivityId','signActivityId','checkActivityId','driveActivityId'].forEach(x=>{const el=document.getElementById(x);if(el)el.value=id})}
function autoFillSheetId(){return true}
</script>
<script src="./index-auth-patch.js"></script>
<script src="./index-project-patch.js"></script>
<script src="./index-session-patch.js"></script>
<script src="./index-query-patch.js"></script>
<script src="./index-notification-patch.js"></script>
<script src="./index-execution-patch.js"></script>
<script src="./index-finance-patch.js"></script>
<script src="./index-masterdata-patch.js"></script>
<script src="./index-closing-patch.js"></script>
</body>
</html>
