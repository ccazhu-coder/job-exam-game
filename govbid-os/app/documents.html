<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜行政文件產生</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
<style>
/* 文件類型選單 */
.doc-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.doc-layout{grid-template-columns:1fr}}
.doc-sidebar{background:var(--white);border:1.5px solid var(--gray-100);border-radius:12px;overflow:hidden;position:sticky;top:80px}
.doc-sidebar h3{background:var(--navy);color:var(--white);font-size:.8rem;font-weight:700;padding:12px 16px;margin:0}
.doc-group-label{font-size:.68rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 4px;background:var(--offwhite)}
.doc-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--gray-100);font-size:.82rem;color:var(--navy-mid);transition:.12s}
.doc-item:hover{background:var(--gold-pale);color:var(--navy)}
.doc-item.active{background:var(--navy);color:var(--white)}
.doc-item .dot{width:7px;height:7px;border-radius:50%;background:var(--gray-300);flex-shrink:0}
.doc-item.ready .dot{background:#16a34a}
.doc-item.warn .dot{background:var(--gold)}
.doc-item.missing .dot{background:var(--danger)}

/* 文件工作區 */
.doc-workspace{background:var(--white);border:1.5px solid var(--gray-100);border-radius:12px;padding:20px 24px;min-height:400px}
.doc-workspace h2{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.doc-workspace .doc-desc{font-size:.82rem;color:var(--gray-500);margin-bottom:16px;line-height:1.5}
.doc-status-bar{background:var(--offwhite);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem}
.doc-status-bar .si{display:flex;align-items:center;gap:5px;color:var(--navy-mid)}
.doc-status-bar .si .v{font-weight:700;color:var(--navy)}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

/* 案件/場次選擇器 */
.selector-card{background:var(--offwhite);border:1.5px solid var(--gray-200);border-radius:10px;padding:14px 18px;margin-bottom:18px}
.selector-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.selector-row{grid-template-columns:1fr}}
.selector-row label{display:block;font-size:.74rem;font-weight:600;color:var(--navy-mid);margin-bottom:3px}
.selector-row select{width:100%;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:.85rem;font-family:var(--font)}
.selector-row select:focus{outline:none;border-color:var(--navy-mid)}

/* 預覽區 */
.preview-wrap{border:1.5px solid var(--gray-200);border-radius:8px;overflow:auto;max-height:600px}
.preview-empty{text-align:center;padding:48px;color:var(--gray-400);font-size:.9rem}

/* 預算管理 */
.budget-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.budget-total{font-size:.85rem;color:var(--navy-mid);margin-left:auto}

/* 列印樣式 */
@media print {
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0;margin:0}
  .no-print{display:none!important}
}
#printArea{display:none}

/* 簽到表樣式 */
.signin-sheet{font-family:'標楷體',serif;font-size:11pt;padding:20px}
.signin-sheet .s-title{text-align:center;font-size:16pt;font-weight:bold;margin-bottom:8px}
.signin-sheet .s-meta{display:flex;gap:20px;margin-bottom:8px;font-size:10pt;flex-wrap:wrap}
.signin-sheet table{width:100%;border-collapse:collapse;font-size:10pt}
.signin-sheet th,.signin-sheet td{border:1px solid #000;padding:4px 6px;text-align:center;vertical-align:middle}
.signin-sheet th{background:#eee;font-weight:bold}
.signin-sheet .sig-row td{height:40px}

/* 領據樣式 */
.receipt-wrap{font-family:'標楷體',serif;padding:20px;max-width:700px;margin:0 auto}
.receipt-box{border:2px solid #000;padding:16px 20px;margin-bottom:20px;page-break-inside:avoid}
.receipt-box .r-title{text-align:center;font-size:16pt;font-weight:bold;letter-spacing:4px;margin-bottom:12px}
.receipt-box .r-org{text-align:right;font-size:10pt;margin-bottom:8px}
.receipt-box table{width:100%;border-collapse:collapse;margin-bottom:10px}
.receipt-box td{border:1px solid #000;padding:5px 8px;font-size:10pt;vertical-align:top}
.receipt-box .r-amount{font-size:14pt;font-weight:bold;text-align:center;border:2px solid #000;padding:8px}
.receipt-box .r-sign{display:flex;justify-content:space-between;margin-top:10px;font-size:10pt}
.receipt-box .r-note{font-size:8pt;color:#555;margin-top:8px;line-height:1.4}
.receipt-box .r-bank{border-left:4px solid #000;padding-left:8px;font-size:9pt;color:#333}

/* 核銷清單樣式 */
.reimb-sheet{font-family:'標楷體',serif;padding:20px}
.reimb-sheet h2{text-align:center;font-size:14pt;font-weight:bold;margin-bottom:4px}
.reimb-sheet .r-meta{text-align:center;font-size:10pt;color:#555;margin-bottom:12px}
.reimb-sheet table{width:100%;border-collapse:collapse;font-size:9pt}
.reimb-sheet th,.reimb-sheet td{border:1px solid #000;padding:5px 7px}
.reimb-sheet th{background:#ddd;font-weight:bold;text-align:center}
.reimb-sheet td.num{text-align:right}
.reimb-sheet .total-row td{font-weight:bold;background:#eee}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">行政文件產生</div>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <div class="page-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div><h1>行政文件產生</h1><p style="color:var(--gray-500);font-size:.84rem;margin:0">選擇案件與場次後產生各類行政文件，支援 HTML 預覽與列印輸出</p></div>
  </div>

  <!-- 案件/場次選擇器 -->
  <div class="selector-card">
    <div class="selector-row">
      <div>
        <label>案件</label>
        <select id="caseSelect" onchange="onCaseChange()"><option value="">載入中…</option></select>
      </div>
      <div>
        <label>場次</label>
        <select id="sessionSelect" onchange="onSessionChange()"><option value="">— 選擇案件後載入 —</option></select>
      </div>
    </div>
    <div id="selStatus" style="margin-top:8px;font-size:.78rem;color:var(--gray-400)">請先選擇案件</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="secondary" style="font-size:.78rem" onclick="createCaseFolders()">📁 建立案件 Google Drive 資料夾</button>
      <div id="folderResult" style="font-size:.78rem;color:var(--gray-500)"></div>
    </div>
  </div>

  <div class="doc-layout">
    <!-- 文件類型側欄 -->
    <div class="doc-sidebar">
      <h3>文件類型</h3>
      <div class="doc-group-label">報名與名冊</div>
      <div class="doc-item" id="di_attendance" onclick="selectDoc('attendance')"><span class="dot"></span>簽到表</div>
      <div class="doc-item" id="di_admission" onclick="selectDoc('admission')"><span class="dot"></span>錄取名冊</div>
      <div class="doc-item" id="di_meal" onclick="selectDoc('meal')"><span class="dot"></span>便當統計表</div>
      <div class="doc-item" id="di_address" onclick="selectDoc('address')"><span class="dot"></span>地址標籤</div>
      <div class="doc-group-label">人員費用領據</div>
      <div class="doc-item" id="di_lecReceipt" onclick="selectDoc('lecReceipt')"><span class="dot"></span>講師鐘點費領據</div>
      <div class="doc-item" id="di_staffReceipt" onclick="selectDoc('staffReceipt')"><span class="dot"></span>工作人員費用領據</div>
      <div class="doc-group-label">核銷與結案</div>
      <div class="doc-item" id="di_budget" onclick="selectDoc('budget')"><span class="dot"></span>案件預算明細</div>
      <div class="doc-item" id="di_reimb" onclick="selectDoc('reimb')"><span class="dot"></span>核銷清單</div>
      <div class="doc-item" id="di_checklist" onclick="selectDoc('checklist')"><span class="dot"></span>工作檢核表</div>
      <div class="doc-item" id="di_closing" onclick="selectDoc('closing')"><span class="dot"></span>結案附件清單</div>
    </div>

    <!-- 文件工作區 -->
    <div class="doc-workspace" id="docWorkspace">
      <div style="text-align:center;padding:60px;color:var(--gray-400)">
        <div style="font-size:2rem;margin-bottom:10px">📄</div>
        <div>請先選擇案件與場次，再從左側選擇要產生的文件類型</div>
      </div>
    </div>
  </div>
</main>

<!-- 列印區域（隱藏，列印時顯示） -->
<div id="printArea"></div>

<script src="./erp-aligned-core.js"></script>
<script>
function safeJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
var _caseId='', _sessionId='', _docData={}, _currentDoc='';
var _cases=[], _sessions=[];

function init(){
  var p=safeJSON('govops_profile');
  if(!p||!p.userId){location.href='./dashboard.html';return;}
  document.getElementById('nav').innerHTML=ERPALIGNED.nav();
  ERPALIGNED.appendUserChip('header .wrap');
  // Check URL params
  var sp=new URLSearchParams(location.search);
  var cid=sp.get('caseId')||'', sid=sp.get('sessionId')||'';
  loadCases(cid, sid);
}

async function loadCases(preCaseId, preSessionId){
  const r=await ERPALIGNED.api({action:'getCases'});
  const sel=document.getElementById('caseSelect');
  if(!r.success){sel.innerHTML='<option value="">載入失敗</option>';return;}
  _cases=r.data&&r.data.rows||[];
  sel.innerHTML='<option value="">— 請選擇案件 —</option>';
  _cases.forEach(function(c){
    var o=document.createElement('option');
    o.value=c['專案ID']||'';
    o.textContent=(c['專案計畫名稱']||'未命名')+(c['狀態']?' ('+c['狀態']+')':'');
    sel.appendChild(o);
  });
  if(preCaseId){sel.value=preCaseId;onCaseChange(preSessionId);}
}

async function onCaseChange(preSessionId){
  _caseId=document.getElementById('caseSelect').value;
  _sessionId='';
  const sesSel=document.getElementById('sessionSelect');
  sesSel.innerHTML='<option value="">— 全案件（不限場次）—</option>';
  if(!_caseId){document.getElementById('selStatus').textContent='請先選擇案件';return;}
  const r=await ERPALIGNED.api({action:'getSessions',caseId:_caseId});
  if(r.success){
    _sessions=r.data&&r.data.rows||[];
    _sessions.forEach(function(s){
      var o=document.createElement('option');
      o.value=s['活動ID']||'';
      o.textContent=(s['活動名稱']||'未命名')+' '+shortDate(s['活動日期']);
      sesSel.appendChild(o);
    });
  }
  if(preSessionId){sesSel.value=preSessionId;}
  await onSessionChange();
}

async function onSessionChange(){
  _sessionId=document.getElementById('sessionSelect').value;
  if(!_caseId)return;
  // Fetch document data summary
  const r=await ERPALIGNED.api({action:'getDocumentableData',caseId:_caseId,sessionId:_sessionId});
  if(r.success){
    _docData=r.data||{};
    updateSidebarStatus();
    var cName=(_cases.find(function(c){return c['専案ID']===_caseId||c['專案ID']===_caseId;})||{})['專案計畫名稱']||'';
    var sName=_sessionId?((_sessions.find(function(s){return s['活動ID']===_sessionId;})||{})['活動名稱']||''):'（全案件）';
    document.getElementById('selStatus').innerHTML='<span style="color:var(--navy);font-weight:600">'+ERPALIGNED.esc(cName)+'</span> ＞ '+ERPALIGNED.esc(sName)+' ｜ 報名 '+(_docData.total||0)+' 人，錄取 '+(_docData.admitted||0)+' 人，工作人員 '+(_docData.staffCount||0)+' 人';
  }
  if(_currentDoc) selectDoc(_currentDoc);
}

function updateSidebarStatus(){
  var d=_docData;
  setDotStatus('attendance', d.admitted>0?'ready':'warn');
  setDotStatus('admission', d.admitted>0?'ready':'warn');
  setDotStatus('meal', d.needMeal>0?'ready':(d.admitted>0?'warn':'missing'));
  setDotStatus('address', d.withAddress>0?'ready':'warn');
  setDotStatus('lecReceipt', d.lecCount>0?'ready':'warn');
  setDotStatus('staffReceipt', d.staffCount>0?'ready':'warn');
  setDotStatus('budget', d.budgetCount>0?'ready':'warn');
  setDotStatus('reimb', d.budgetCount>0?'ready':'missing');
  setDotStatus('checklist', d.taskCount>0?'ready':'warn');
  setDotStatus('closing', 'warn');
}
function setDotStatus(docId, status){
  var el=document.getElementById('di_'+docId);
  if(!el)return;
  el.className='doc-item '+status;
}

// ── 文件選擇 ──────────────────────────────────────────
function selectDoc(docId){
  _currentDoc=docId;
  document.querySelectorAll('.doc-item').forEach(function(el){el.classList.remove('active');});
  var di=document.getElementById('di_'+docId);
  if(di){di.classList.add('active');}
  var ws=document.getElementById('docWorkspace');

  var docs={
    attendance:{title:'簽到表',desc:'依錄取名單產生簽到表，包含葷素備註欄位，格式對應簽到表-範本.docx',build:buildAttendance},
    admission:{title:'錄取名冊',desc:'錄取人員完整名冊，含身份別、服務單位、聯絡資訊',build:buildAdmission},
    meal:{title:'便當統計表',desc:'依錄取學員用餐習慣統計葷素份數',build:buildMeal},
    address:{title:'地址標籤',desc:'20格地址標籤（對應 C30105-2-0 規格），可直接列印套印',build:buildAddress},
    lecReceipt:{title:'講師鐘點費領據',desc:'對應核銷憑證-領據-講師費用-範本.docx，填入講師資料後可列印',build:buildLecReceipt},
    staffReceipt:{title:'工作人員費用領據',desc:'對應核銷憑證-領據--工作人員-範本.docx，批次產生每人一張',build:buildStaffReceipt},
    budget:{title:'案件預算明細',desc:'逐案建立標價清單項目（每案不同），作為核銷依據',build:buildBudget},
    reimb:{title:'核銷清單',desc:'預算項目對比實際支出，產生可列印的核銷比對表',build:buildReimb},
    checklist:{title:'工作檢核表',desc:'對應工作檢核表-範本.xlsx，從任務清單產生待辦項目',build:buildChecklist},
    closing:{title:'結案附件清單',desc:'從結案檢核表自動產生附件清單',build:buildClosingList}
  };
  var d=docs[docId];
  if(!d){ws.innerHTML='<div class="preview-empty">未知文件類型</div>';return;}
  if(!_caseId){ws.innerHTML='<h2>'+d.title+'</h2><p class="doc-desc">'+d.desc+'</p><div class="preview-empty">請先選擇案件</div>';return;}
  ws.innerHTML='<h2>'+d.title+'</h2><p class="doc-desc">'+d.desc+'</p><div id="docLoading" style="padding:20px;color:var(--gray-400)">載入中…</div>';
  d.build();
}

function printDoc(){
  var area=document.getElementById('printArea');
  var preview=document.getElementById('docPreviewContent');
  if(!preview){alert('請先產生文件預覽');return;}
  area.innerHTML=preview.outerHTML;
  window.print();
}

// ── 簽到表 ────────────────────────────────────────────
async function buildAttendance(){
  if(!_sessionId){showWorkspaceMsg('請選擇特定場次才能產生簽到表');return;}
  const r=await ERPALIGNED.api({action:'generateAttendanceList',sessionId:_sessionId});
  if(!r.success){showWorkspaceMsg('載入失敗：'+r.message);return;}
  const d=r.data||{};
  const ses=_docData.sessionInfo||{};
  const profile=safeJSON('govops_profile')||{};
  var list=d.list||[];
  var html='<table><thead><tr><th>序號</th><th>姓名</th><th>服務單位</th><th>簽到</th><th>簽退</th><th>用餐</th><th>備註</th></tr></thead><tbody>';
  list.forEach(function(p){
    html+='<tr><td>'+p['序號']+'</td><td>'+esc(p['姓名'])+'</td><td>'+esc(p['服務單位']||'')+'</td><td style="width:60px"></td><td style="width:60px"></td><td style="width:80px">'+esc(p['用餐']||'')+'</td><td style="width:80px">'+esc(p['備註']||'')+'</td></tr>';
  });
  html+='</tbody></table>';
  var preview='<div class="signin-sheet" id="docPreviewContent">'
    +'<div class="s-title">簽 到 表</div>'
    +'<div class="s-meta">'
    +'<span>課程名稱：<u>'+esc(ses['活動名稱']||'___________________________')+'</u></span>'
    +'<span>日期：<u>'+shortDate(ses['活動日期']||'_________')+'</u></span>'
    +'<span>場次：第 ___ 場</span>'
    +'</div>'
    +'<div class="s-meta">'
    +'<span>上課地點：<u>'+esc(ses['活動地點']||'___________________________')+'</u></span>'
    +'<span>上課時間：<u>'+fmtTime(ses['開始時間']||'')+' ~ '+fmtTime(ses['結束時間']||'')+'</u></span>'
    +'<span>承辦單位：<u>'+esc(profile.orgName||'___________________________')+'</u></span>'
    +'</div>'
    +html
    +'<div class="s-meta sig-row" style="margin-top:8px">'
    +'<span>授課教師簽名：<u>&nbsp;&nbsp;&nbsp;&nbsp;'+esc(ses['講師']||'')+'&nbsp;&nbsp;&nbsp;&nbsp;</u></span>'
    +'<span>工作人員簽名：<u>&nbsp;&nbsp;&nbsp;&nbsp;'+esc(ses['工作人員']||'')+'&nbsp;&nbsp;&nbsp;&nbsp;</u></span>'
    +'</div>'
    +'</div>';
  renderWorkspace('簽到表',d.count||0,'人',preview,{action:'autoGenerateSignInSheet'});
}

// ── 錄取名冊 ──────────────────────────────────────────
async function buildAdmission(){
  const r=await ERPALIGNED.api({action:'generateAdmissionList',caseId:_caseId,sessionId:_sessionId});
  if(!r.success){showWorkspaceMsg('載入失敗：'+r.message);return;}
  const list=r.data&&r.data.list||[];
  var html='<table><thead><tr><th>序號</th><th>姓名</th><th>性別</th><th>服務單位</th><th>身分別</th><th>電話</th><th>Email</th><th>錄取別</th><th>備註</th></tr></thead><tbody>';
  list.forEach(function(p){
    html+='<tr><td>'+p['序號']+'</td><td>'+esc(p['姓名'])+'</td><td>'+esc(p['性別']||'')+'</td><td>'+esc(p['服務單位']||'')+'</td><td>'+esc(p['身分別']||'')+'</td><td>'+esc(p['電話']||'')+'</td><td>'+esc(p['Email']||'')+'</td><td>'+esc(p['錄取別']||'')+'</td><td>'+esc(p['備註']||'')+'</td></tr>';
  });
  html+='</tbody></table>';
  var preview='<div class="signin-sheet" id="docPreviewContent"><div class="s-title">錄取名冊</div>'+html+'</div>';
  renderWorkspace('錄取名冊',list.length,'人',preview);
}

// ── 便當統計 ──────────────────────────────────────────
async function buildMeal(){
  if(!_sessionId){showWorkspaceMsg('請選擇特定場次');return;}
  const r=await ERPALIGNED.api({action:'generateMealCount',sessionId:_sessionId});
  if(!r.success){showWorkspaceMsg('載入失敗：'+r.message);return;}
  const d=r.data||{};
  var html='<table><thead><tr><th>用餐習慣</th><th>人數</th></tr></thead><tbody>';
  (d.list||[]).forEach(function(row){html+='<tr><td>'+esc(row['用餐習慣'])+'</td><td>'+row['人數']+'</td></tr>';});
  html+='<tr style="font-weight:bold"><td>合計</td><td>'+(d.total||0)+'</td></tr></tbody></table>';
  var preview='<div class="signin-sheet" id="docPreviewContent"><div class="s-title">便當統計表</div>'+html+'</div>';
  renderWorkspace('便當統計表',d.total||0,'份',preview);
}

// ── 地址標籤 ──────────────────────────────────────────
async function buildAddress(){
  const r=await ERPALIGNED.api({action:'generateAddressLabels',caseId:_caseId,sessionId:_sessionId});
  if(!r.success){showWorkspaceMsg('載入失敗：'+r.message);return;}
  const list=r.data&&r.data.list||[];
  // 20 格 / 頁
  var pages=[];
  for(var i=0;i<list.length;i+=20){pages.push(list.slice(i,i+20));}
  var html='';
  pages.forEach(function(pg){
    html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;page-break-after:always;padding:8px">';
    var cells=pg.slice();
    while(cells.length<20)cells.push(null);
    cells.forEach(function(c){
      html+='<div style="border:1px dashed #ccc;padding:8px;min-height:50px;font-size:10pt">';

async function buildReimb(){
  const r=await ERPALIGNED.api({action:'generateReimbursementList',caseId:_caseId});

  const d=r.data||{};

      +'<td class="num">'+Math.round(parseFloat(b['預算金額'])||0).toLocaleString()+'</td>'
      +'<td class="num">'+Math.round(actual).toLocaleString()+'</td>'
      +'<td class="num" style="color:'+(diff<0?'#b91c1c':'#166534')+'">'+Math.round(diff).toLocaleString()+'</td>'
      +'<td>'+esc(b['核銷狀態']||'未核銷')+'</td></tr>';
  });
  html+='<tr class="total-row"><td colspan="4">合計</td><td class="num">'+Math.round(d.totalBudget||0).toLocaleString()+'</td><td class="num">'+Math.round(d.totalActual||0).toLocaleString()+'</td><td class="num">'+Math.round((d.totalBudget||0)-(d.totalActual||0)).toLocaleString()+'</td><td></td></tr>';

    +'<h2>核銷清單</h2>'

}

// ── 工具函式 ──────────────────────────────────────────
function renderWorkspace(title, count, unit, previewHtml, driveOpts){
  var ws=document.getElementById('docWorkspace');
  var existing=ws.querySelector('h2');
  var desc=ws.querySelector('.doc-desc');
  var insertAfter=desc||existing;
  var statusDiv='<div class="doc-status-bar"><span class="si"><span class="v">'+count+'</span> '+esc(unit)+'</span></div>';
  var driveBtn=driveOpts?'<button class="secondary" id="driveBtnMain" style="background:var(--navy);color:#fff;border-color:var(--navy)" onclick="generateToDrive('+JSON.stringify(driveOpts)+')">📂 產生到 Google Drive</button>':'';
  var actions='<div class="doc-actions no-print">'+driveBtn+'<button class="gold" onclick="printDoc()">🖨 列印</button><button class="secondary" onclick="window.location.reload()">重新載入</button></div>';
  var driveResult='<div id="driveResult" style="margin-bottom:8px;font-size:.82rem"></div>';
  var previewWrap='<div class="preview-wrap">'+previewHtml+'</div>';
  if(insertAfter){
    var remaining=ws.innerHTML.replace('<div id="docLoading" style="padding:20px;color:var(--gray-400)">載入中…</div>','');
    ws.innerHTML=remaining+statusDiv+driveResult+actions+previewWrap;
  } else {
    ws.innerHTML='<h2>'+title+'</h2>'+statusDiv+driveResult+actions+previewWrap;
  }
}
async function generateToDrive(opts){
  var btn=document.getElementById('driveBtnMain');
  var el=document.getElementById('driveResult');
  if(btn){btn.textContent='產生中…';btn.disabled=true;}
  if(el)el.innerHTML='<span style="color:var(--gray-400)">正在 Google Drive 產生文件，請稍候…</span>';
  var p=Object.assign({},opts,{caseId:_caseId,sessionId:_sessionId||''});
  if(opts.action==='autoGenerateLecturerReceipt'){
    p.hours=(document.getElementById('lec_hours')||{}).value||'';
    p.hourlyRate=(document.getElementById('lec_rate')||{}).value||'';
    p.lecturerName=(document.getElementById('lec_name')||{}).value||'';
  }
  if(opts.action==='autoGenerateStaffReceipts'){
    p.hourlyRate=(document.getElementById('staff_rate')||{}).value||'190';
  }
  var r=await ERPALIGNED.api(p);
  if(btn){btn.textContent='📂 產生到 Google Drive';btn.disabled=false;}
  if(r.success){
    var d=r.data||{};
    var url=d.sheetUrl||d.docUrl||d.fileUrl||'';
    if(el)el.innerHTML='<span style="color:#166534">✅ 已產生到 Google Drive　'+(d.fileName||'')+'</span>'
      +(url?'　<a href="'+url+'" target="_blank" style="color:var(--navy);font-weight:700">開啟檔案 →</a>':'');
  } else {
    if(el)el.innerHTML='<span style="color:var(--danger)">❌ 產生失敗：'+esc(r.message||r.error||'未知錯誤')+'</span>';
  }
}
async function createCaseFolders(){
  if(!_caseId){alert('請先選擇案件');return;}
  var el=document.getElementById('folderResult');
  el.textContent='建立中…';
  var r=await ERPALIGNED.api({action:'createCaseFolders',caseId:_caseId});
  if(r.success){
    var d=r.data||{};
    el.innerHTML='✅ 資料夾建立完成'+(d.folderUrl?'　<a href="'+d.folderUrl+'" target="_blank" style="color:var(--navy);font-weight:700">在 Drive 開啟 →</a>':'');
  } else el.innerHTML='❌ 失敗：'+esc(r.message||r.error||'未知');
}
function showWorkspaceMsg(msg){
  var ws=document.getElementById('docWorkspace');
  var existing=ws.querySelector('h2');
  var loadingEl=ws.querySelector('#docLoading');
  if(loadingEl)loadingEl.textContent=msg;
  else if(existing) ws.innerHTML=ws.innerHTML+'<div class="preview-empty">'+esc(msg)+'</div>';
  else ws.innerHTML='<div class="preview-empty">'+esc(msg)+'</div>';
}
function shortDate(v){if(!v)return'—';return String(v).replace(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2}).*/,'$1/$2/$3');}
function fmtTime(v){if(!v)return'';var m=String(v).match(/T(\d{2}):(\d{2})/);if(m)return m[1]+':'+m[2];if(/^\d{1,2}:\d{2}/.test(String(v)))return String(v).substring(0,5);return'';}
function esc(v){return ERPALIGNED?ERPALIGNED.esc(v):String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function calcHoursBetween(s,e){if(!s||!e)return'';var sh=parseInt(s.split(':')[0]),sm=parseInt(s.split(':')[1]),eh=parseInt(e.split(':')[0]),em=parseInt(e.split(':')[1]);return Math.round(((eh*60+em)-(sh*60+sm))/60*10)/10;}
function toChineseAmount(n){var units=['','十','百','千','萬','十萬'];var s=Math.round(n).toString();return s;}// simplified

window.addEventListener('DOMContentLoaded', init);
