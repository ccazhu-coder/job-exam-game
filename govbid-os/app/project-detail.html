<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ProjectOps ERP｜專案營運中心</title><script src="./config.js"></script><script src="./govops-api-client.js"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:28px 22px}main{max-width:1280px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(16,37,66,.06)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px}textarea{min-height:76px}button{border:0;border-radius:12px;padding:12px 14px;background:#1d4e89;color:#fff;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.good{background:#12805c}.warn{background:#b54708}.secondary{background:#e8eef7;color:#1d3557}.status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #d0d5dd;border-radius:12px;padding:12px;margin-top:12px;max-height:420px;overflow:auto}.ok{background:#ecfdf3;border-color:#12b76a}.bad{background:#fff8e6;border-color:#f2c94c}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#eef4ff;color:#173a63}.tab.active{background:#1d4e89;color:#fff}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}</style></head><body><header><h1>ProjectOps ERP｜專案營運中心</h1><div>單一專案總控：場次、招生、報名、名冊、CRM、任務、財務、結案、交付包</div></header><main><section class="card"><div class="grid"><div class="span-6"><label>專案ID</label><input id="projectId" placeholder="貼上專案ID"></div><div class="span-6"><label>快速搜尋</label><input id="keyword" placeholder="專案名稱/主辦單位/課程名稱"></div></div><button class="good" onclick="loadProject()">載入專案</button><button onclick="loadTimeline()">時間軸</button><button class="secondary" onclick="location.href='./project-pool.html'">回專案池</button><button class="secondary" onclick="location.href='./projectops-home.html'">回ERP首頁</button><div id="kpiBox" class="kpis"></div><div id="result" class="status">請輸入專案ID或關鍵字後載入。</div></section><section class="card"><div class="tabs"><button class="tab active" onclick="showPanel('operate',this)">營運動作</button><button class="tab" onclick="showPanel('finance',this)">財務</button><button class="tab" onclick="showPanel('closing',this)">結案</button><button class="tab" onclick="showPanel('data',this)">資料總覽</button></div><div id="operate" class="panel"><h2>營運動作</h2><button onclick="createEvent()">建立場次</button><button onclick="createRegistration()">建立招生</button><button onclick="finalizeRegistration()">報名結轉：名冊＋CRM＋Email</button><button onclick="bootstrapTasks()">建立標準任務</button><button onclick="remindTasks()">任務提醒</button><div class="grid"><div class="span-4"><label>場次ID</label><input id="eventId"></div><div class="span-4"><label>活動名稱</label><input id="eventName"></div><div class="span-4"><label>活動日期</label><input id="eventDate" type="date"></div></div></div><div id="finance" class="panel" style="display:none"><h2>財務營運</h2><div class="grid"><div class="span-4"><label>項目</label><input id="finItem"></div><div class="span-4"><label>金額</label><input id="finAmount" type="number"></div><div class="span-4"><label>對象</label><input id="finTarget"></div><div class="span-6"><label>憑證URL</label><input id="receiptUrl"></div><div class="span-6"><label>備註</label><input id="finNote"></div></div><button onclick="createReceivable()">建立應收</button><button onclick="recordIncome()">記錄收款</button><button onclick="recordExpense()">記錄支出</button><button onclick="recordReimburse()">建立核銷</button><button class="secondary" onclick="financeSummary()">財務摘要</button></div><div id="closing" class="panel" style="display:none"><h2>結案營運</h2><label>檢討建議</label><textarea id="review"></textarea><button onclick="closingSummary()">結案摘要</button><button onclick="closingCheck()">缺件檢查</button><button onclick="createClosing()">建立結案</button><button onclick="createPackage()">建立交付包</button><button class="good" onclick="closingReport()">產生結案報告</button><button class="secondary" onclick="deliveryHtml()">產生HTML交付版</button></div><div id="data" class="panel" style="display:none"><h2>資料總覽</h2><div id="dataTable"></div></div></section></main><script>const CONFIG_API_URL=(window.GOVOPS_CONFIG&&(window.GOVOPS_CONFIG.API_URL||window.GOVOPS_CONFIG.apiUrl))||'';const FALLBACK_API_URL='https://script.google.com/macros/s/AKfycbxSRLOXnMcWULDmI_w0Zluirb_i5tZllEYrrcno-MUMafqVSF4p-4W3UKh_WQMA5Q4sTQ/exec';const API_URL=CONFIG_API_URL||FALLBACK_API_URL;function $(id){return document.getElementById(id)}function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function base(x){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role,plan:u.plan,專案ID:$('projectId').value.trim(),keyword:$('keyword').value.trim()},x||{})}function show(x,cls){$('result').className='status '+(cls||'');$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function api(data,opt){opt=opt||{};if(!opt.silent)show('處理中...');try{let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(data,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(data));res=await r.json()}if(!opt.silent)show(res,res&&res.success?'ok':'bad');return res}catch(e){const out={success:false,message:'API呼叫失敗',data:{error:String(e)}};if(!opt.silent)show(out,'bad');return out}}function kpis(d){d=d||{};const items=[['場次',d.場次數||0],['報名',d.報名數||0],['已錄取',d.已錄取||0],['名冊',d.名冊數||0],['任務',d.任務數||0],['缺件',d.缺件數||0]];$('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+safe(x[1])+'</div><div class="name">'+safe(x[0])+'</div></div>').join('')}function showPanel(id,btn){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$(id).style.display='block';btn.classList.add('active')}async function loadProject(){const r=await api(base({action:'project.detail.get'}));if(r.success){kpis(r.data.summary);renderDetail(r.data.detail)}}async function loadTimeline(){await api(base({action:'project.detail.timeline'}))}async function createEvent(){await api(base({action:'project.createEvent',場次ID:$('eventId').value,活動名稱:$('eventName').value,活動日期:$('eventDate').value}));loadProject()}async function createRegistration(){await api(base({action:'project.createRegistration',場次ID:$('eventId').value,活動名稱:$('eventName').value}));loadProject()}async function finalizeRegistration(){await api(base({action:'project.registration.finalize',場次ID:$('eventId').value}));loadProject()}async function bootstrapTasks(){await api(base({action:'project.task.bootstrap',場次ID:$('eventId').value,活動名稱:$('eventName').value}));loadProject()}async function remindTasks(){await api(base({action:'project.task.remind',場次ID:$('eventId').value}))}async function createReceivable(){await api(base({action:'project.finance.receivable.create',項目:$('finItem').value,金額:$('finAmount').value,對象:$('finTarget').value,備註:$('finNote').value}));loadProject()}async function recordIncome(){await api(base({action:'project.finance.income.record',項目:$('finItem').value,金額:$('finAmount').value,對象:$('finTarget').value,備註:$('finNote').value}));loadProject()}async function recordExpense(){await api(base({action:'project.finance.expense.record',項目:$('finItem').value,金額:$('finAmount').value,對象:$('finTarget').value,憑證URL:$('receiptUrl').value,備註:$('finNote').value}));loadProject()}async function recordReimburse(){await api(base({action:'project.finance.reimburse.record',金額:$('finAmount').value,憑證URL:$('receiptUrl').value,備註:$('finNote').value}));loadProject()}async function financeSummary(){await api(base({action:'project.finance.summary'}))}async function closingSummary(){await api(base({action:'project.closing.summary'}))}async function closingCheck(){await api(base({action:'project.closing.check'}))}async function createClosing(){await api(base({action:'project.closing.create',檢討建議:$('review').value}));loadProject()}async function createPackage(){await api(base({action:'project.closing.package'}));loadProject()}async function closingReport(){await api(base({action:'project.document.closingReport',檢討建議:$('review').value}))}async function deliveryHtml(){await api(base({action:'project.document.deliveryHtml',檢討建議:$('review').value}))}function renderDetail(d){if(!d){$('dataTable').innerHTML='';return}const groups=[['場次',d.events],['報名',d.registrations],['名冊',d.roster],['任務',d.tasks],['Email',d.email],['檔案',d.files],['財務',d.finance],['結案',d.closing]];$('dataTable').innerHTML=groups.map(g=>'<h3>'+g[0]+'（'+((g[1]||[]).length)+'）</h3>'+simpleTable(g[1]||[])).join('')}function simpleTable(rows){if(!rows.length)return'<div class="status">無資料</div>';const keys=Object.keys(rows[0]).filter(k=>k!=='_row').slice(0,6);return'<table><thead><tr>'+keys.map(k=>'<th>'+safe(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,20).map(r=>'<tr>'+keys.map(k=>'<td>'+safe(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function safe(x){return String(x===undefined||x===null?'':x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}const url=new URL(location.href);if(url.searchParams.get('projectId')){$('projectId').value=url.searchParams.get('projectId');loadProject();}</script></body></html>
