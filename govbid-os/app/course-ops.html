<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜課程執行現場管理</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜課程執行現場管理</div><div class="sub">一頁快速執行：場地、教材、簽到、餐點、照片、核銷、任務</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span12"><h2>快速建立當日執行包</h2><div class="row"><input id="activityId" placeholder="活動ID"><button onclick="buildPackage()">建立當日快速執行包</button></div><div class="hint">系統會自動建立：報到任務、場地設備、教材物資、餐點、物品、注意事項、課後檢核。</div><div id="packageMsg" class="msg">尚未建立。</div></section><section class="card span6"><h2>快速新增現場資料</h2><form id="opsForm"><label>模組</label><select name="模組"><option>課程執行紀錄</option><option>場地設備確認</option><option>教材與物資準備</option><option>領據管理</option><option>核銷文件管理</option><option>當日工作任務表</option><option>當日注意事項</option><option>報到處任務</option><option>餐點管理</option><option>物品清單</option><option>現場聯絡人</option><option>現場照片紀錄</option><option>課後回收檢核</option></select><label>活動ID</label><input name="活動ID" required><label>名稱／主題</label><input name="任務名稱" placeholder="任務／物品／文件／照片說明"><label>狀態</label><input name="狀態" placeholder="待執行／已完成／待確認"><label>負責人</label><input name="負責人"><label>備註</label><textarea name="備註"></textarea><button>新增現場資料</button></form><div id="opsMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>快速查詢</h2><label>模組</label><select id="queryModule"><option>課程執行紀錄</option><option>場地設備確認</option><option>教材與物資準備</option><option>領據管理</option><option>核銷文件管理</option><option>當日工作任務表</option><option>當日注意事項</option><option>報到處任務</option><option>餐點管理</option><option>物品清單</option><option>現場聯絡人</option><option>現場照片紀錄</option><option>課後回收檢核</option></select><div class="row"><input id="queryActivity" placeholder="活動ID"><button onclick="queryOps()">查詢</button></div><div class="hint">現場工作人員只要選模組＋活動ID即可快速查詢。</div><div id="queryMsg" class="msg">尚未查詢。</div></section><section class="card span12"><h2>資料列表</h2><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function obj(id,action){const fd=new FormData(document.getElementById(id));const o={action};fd.forEach((v,k)=>{if(v)o[k]=v});return o}document.getElementById('opsForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(obj('opsForm','新增課程執行資料'),'opsMsg');queryOps();});async function buildPackage(){const id=document.getElementById('activityId').value;if(!id){document.getElementById('packageMsg').textContent='請輸入活動ID';return;}await ERPALIGNED.api({action:'建立當日快速執行包','活動ID':id},'packageMsg');}async function queryOps(){const r=await ERPALIGNED.api({action:'查詢課程執行資料','模組':document.getElementById('queryModule').value,'活動ID':document.getElementById('queryActivity').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}</script></body></html>
