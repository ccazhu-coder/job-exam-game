<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜活動管理</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">政府標案全流程營運系統</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-title">
    <h1>活動管理</h1>
    <p>管理課程場次、活動執行與工作流程</p>
  </div>
  <div class="card">
    <div class="btns" style="margin-bottom:10px;flex-wrap:wrap">
      <button class="gold" onclick="openCreate()">＋ 新增活動</button>
      <button class="secondary" style="font-size:.8rem" onclick="doWf('ERP流程_活動完成')">標記完成</button>
      <button class="secondary" style="font-size:.8rem" onclick="doWf('ERP流程_活動取消')">取消活動</button>
      <button class="secondary" style="font-size:.8rem" onclick="doWf('生成活動作業包')">建立作業包</button>
      <button class="secondary" style="font-size:.8rem" onclick="doWf('建立活動資料夾與歸檔清單')">建立資料夾</button>
      <div style="flex:1"></div>
      <input id="keyword" placeholder="活動名稱、講師、日期、狀態…" style="max-width:240px;margin:0" onkeydown="if(event.key==='Enter')query()">
      <button onclick="query()">查詢</button>
    </div>
    <div id="queryMsg" class="msg">載入中…</div>
    <div id="table" style="margin-top:8px"></div>
  </div>
</main>
<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

// 已選工作人員
let selStaff = [];

const ACT_CREATE = [
  {name:'專案計畫名稱', label:'所屬專案＊'},
  {name:'活動名稱', label:'活動名稱＊'},
  {name:'活動類型', label:'活動類型'},
  {name:'活動日期', label:'活動日期', type:'date'},
  {name:'活動地點', label:'活動地點'},
  {name:'開始時間', label:'開始時間', type:'time'},
  {name:'結束時間', label:'結束時間', type:'time'},
  {name:'講師', label:'講師'},
  {name:'聯絡人', label:'聯絡人'},
  {name:'聯絡電話', label:'聯絡電話'}
];
const ACT_EDIT = [
  {name:'活動ID', label:'活動 ID', readonly:true},
  {name:'專案計畫名稱', label:'所屬專案'},
  {name:'活動名稱', label:'活動名稱'},
  {name:'活動類型', label:'活動類型'},
  {name:'活動日期', label:'活動日期', type:'date'},
  {name:'活動地點', label:'活動地點'},
  {name:'開始時間', label:'開始時間', type:'time'},
  {name:'結束時間', label:'結束時間', type:'time'},
  {name:'講師', label:'講師',
    type:'picker', pickerAction:'查詢講師', pickerTitle:'選取講師',
    pickerKeys:['講師ID','姓名','電話','專業領域'],
    autoFill:{'聯絡電話':'電話'}},
  {name:'聯絡電話', label:'聯絡電話'},
  {name:'聯絡人', label:'聯絡人',
    type:'picker', pickerAction:'查詢工作人員', pickerTitle:'選取聯絡人',
    pickerKeys:['人員ID','姓名','電話','職務類型']},
  {name:'工作人員', label:'工作人員',
    type:'picker-append', pickerAction:'查詢工作人員', pickerTitle:'選取工作人員（可多選）',
    pickerKeys:['人員ID','姓名','電話','職務類型']},
  {name:'狀態', label:'狀態', type:'select', options:['規劃中','招生中','已完成','已取消']},
  {name:'備註', label:'變更原因／備註', type:'textarea'}
];

function openCreate(){
  // Custom create form with picker buttons
  const existing = document.getElementById('_govopsModal');
  if(existing) existing.remove();
  const modal = document.createElement('div');
  modal.id='_govopsModal'; modal.className='modal-backdrop';
  modal.innerHTML=`<div class="modal" style="max-width:600px">
    <h2>新增活動</h2>
    <form id="_createActForm">
      <div class="form-row">
        <div class="field"><label>所屬專案＊</label>
          <div style="display:flex;gap:6px">
            <input name="專案計畫名稱" required placeholder="輸入或選取" style="flex:1">
            <button type="button" class="secondary" onclick="pickProj()" style="flex:0 0 60px">選取</button>
          </div>
        </div>
        <div class="field"><label>活動名稱＊</label><input name="活動名稱" required></div>
      </div>
      <div class="form-row">
        <div class="field"><label>活動類型</label><input name="活動類型" placeholder="課程、研討…"></div>
        <div class="field"><label>活動日期</label><input name="活動日期" type="date"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>開始時間</label><input name="開始時間" type="time"></div>
        <div class="field"><label>結束時間</label><input name="結束時間" type="time"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>活動地點</label><input name="活動地點"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>講師</label>
          <div style="display:flex;gap:6px">
            <input name="講師" placeholder="輸入或從主檔選取" id="_createLecName" style="flex:1">
            <button type="button" class="secondary" onclick="pickLec()" style="flex:0 0 60px">選取</button>
          </div>
        </div>
      </div>
      <div id="_staffList" style="margin:4px 0 8px"></div>
      <button type="button" class="secondary" style="width:100%;margin-bottom:10px" onclick="pickStf()">＋ 從主檔選取工作人員</button>
      <div class="form-row">
        <div class="field"><label>聯絡人</label><input name="聯絡人"></div>
        <div class="field"><label>聯絡電話</label><input name="聯絡電話"></div>
      </div>
    </form>
    <div class="btns" style="margin-top:14px;justify-content:flex-end">
      <button class="secondary" id="_mc">取消</button>
      <button class="gold" id="_ms">新增活動</button>
    </div>
    <div id="_mm" class="msg" style="margin-top:8px;display:none"></div>
  </div>`;
  document.body.appendChild(modal);
  selStaff=[];
  document.getElementById('_mc').onclick=()=>modal.remove();
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  document.getElementById('_ms').onclick=async()=>{
    const mm=document.getElementById('_mm'); mm.style.display=''; mm.textContent='儲存中…';
    const fd=new FormData(document.getElementById('_createActForm'));
    const o={action:'新增活動'};
    fd.forEach((v,k)=>{if(v)o[k]=v;});
    if(selStaff.length){o['工作人員']=selStaff.map(s=>s['姓名']).join('、');}
    const r=await ERPALIGNED.api(o,'_mm');
    if(r&&r.success)setTimeout(()=>{modal.remove();query();},700);
  };
}

function pickProj(){ERPALIGNED.showPickerModal('查詢專案',['專案ID','專案計畫名稱','狀態'],r=>{document.querySelector('#_createActForm [name="專案計畫名稱"]').value=r['專案計畫名稱']||'';},'選取所屬專案');}
function pickLec(){ERPALIGNED.showPickerModal('查詢講師',['講師ID','姓名','電話','專業領域'],r=>{document.getElementById('_createLecName').value=r['姓名']||'';},'選取講師');}
function pickStf(){ERPALIGNED.showPickerModal('查詢工作人員',['人員ID','姓名','電話','職務類型'],r=>{if(!selStaff.find(s=>s['人員ID']===r['人員ID'])){selStaff.push(r);renderStaff();}},'選取工作人員');}
function renderStaff(){const el=document.getElementById('_staffList');if(!selStaff.length){el.innerHTML='';return;}el.innerHTML='<div class="hint" style="font-size:.8rem;margin:0">已選工作人員：'+selStaff.map((s,i)=>ERPALIGNED.esc(s['姓名'])+'（'+ERPALIGNED.esc(s['職務類型']||'')+'）<button type="button" onclick="selStaff.splice('+i+',1);renderStaff()" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:0 4px;font-size:.8rem">×</button>').join('、')+'</div>';}

function openEdit(row){
  ERPALIGNED.showEditModal('編輯活動：'+row['活動名稱'], ACT_EDIT, row, '修改活動','活動ID',query);
}
async function doWf(action){
  const kw=document.getElementById('keyword').value;
  if(!kw){document.getElementById('queryMsg').textContent='❌ 請先在查詢欄填入活動ID再執行';return;}
  await ERPALIGNED.api({action,活動ID:kw},'queryMsg');
  query();
}
async function query(){
  const r=await ERPALIGNED.api({action:'查詢活動',keyword:document.getElementById('keyword').value},'queryMsg');
  ERPALIGNED.renderTableWithEdit(r,'table',openEdit,['活動ID','活動名稱','活動日期','活動地點','講師','工作人員','狀態']);
}
query();
</script>
</body>
</html>
