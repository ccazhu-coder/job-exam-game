<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovOps OS｜活動管理</title>
<link rel="stylesheet" href="./erp-page-style.css">
<script src="./config.js"></script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">GovOps OS</div>
  <div class="sub">對齊：02_場次活動</div>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <div class="page-title">
    <h1>活動管理</h1>
    <p>新增、查詢、修改課程場次，可從主檔直接選取講師與工作人員</p>
  </div>
  <div class="grid">
    <section class="card span4">
      <h2>新增活動／場次</h2>
      <form id="createForm">
        <div class="form-row">
          <div class="field"><label>所屬專案＊</label><input name="專案計畫名稱" id="fProjName" required placeholder="輸入或選取"></div>
          <div class="field" style="max-width:80px;justify-content:flex-end"><label>&nbsp;</label><button type="button" class="secondary" onclick="pickProject()" style="width:100%">選取</button></div>
        </div>
        <div class="form-row">
          <div class="field"><label>活動名稱＊</label><input name="活動名稱" required></div>
          <div class="field"><label>活動類型</label><input name="活動類型" placeholder="課程、研討、參訪…"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>活動日期</label><input name="活動日期" type="date"></div>
          <div class="field"><label>活動地點</label><input name="活動地點"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>開始時間</label><input name="開始時間" type="time"></div>
          <div class="field"><label>結束時間</label><input name="結束時間" type="time"></div>
        </div>

        <div class="section-sep"><span>講師</span></div>
        <div class="form-row">
          <div class="field"><label>講師姓名</label><input name="講師" id="fLecName" placeholder="輸入或從主檔選取"></div>
          <div class="field" style="max-width:80px;justify-content:flex-end"><label>&nbsp;</label><button type="button" class="secondary" onclick="pickLec()" style="width:100%">選取</button></div>
        </div>
        <div id="lecInfo" class="hint" style="display:none;margin-top:-6px;font-size:.78rem"></div>

        <div class="section-sep"><span>工作人員</span></div>
        <div id="staffList" style="margin-bottom:8px"></div>
        <button type="button" class="secondary" style="width:100%;margin-bottom:8px" onclick="pickStaff()">＋ 從主檔選取工作人員</button>

        <div class="form-row">
          <div class="field"><label>聯絡人</label><input name="聯絡人"></div>
          <div class="field"><label>聯絡電話</label><input name="聯絡電話"></div>
        </div>
        <div class="btns"><button type="submit">新增活動</button></div>
      </form>
      <div id="createMsg" class="msg" style="margin-top:8px">尚未新增。</div>
    </section>

    <section class="card span8">
      <h2>查詢活動</h2>
      <div class="form-row">
        <div class="field"><input id="keyword" placeholder="活動ID、專案、講師、日期、狀態" onkeydown="if(event.key==='Enter')queryActivities()"></div>
        <div class="field" style="max-width:110px"><button onclick="queryActivities()">查詢</button></div>
      </div>
      <div class="btns" style="margin-bottom:8px">
        <button class="secondary" style="font-size:.8rem" onclick="doAction('ERP流程_活動完成')">完成活動</button>
        <button class="secondary" style="font-size:.8rem" onclick="doAction('ERP流程_活動取消')">取消活動</button>
        <button class="secondary" style="font-size:.8rem" onclick="doAction('生成活動作業包')">建立作業包</button>
        <button class="secondary" style="font-size:.8rem" onclick="doAction('建立活動資料夾與歸檔清單')">建立資料夾</button>
      </div>
      <div id="queryMsg" class="msg">尚未查詢。</div>
      <div id="table" style="margin-top:8px"></div>
    </section>
  </div>
</main>

<script src="./govops-api-client.js"></script>
<script src="./erp-aligned-core.js"></script>
<script>
document.getElementById('nav').innerHTML = ERPALIGNED.nav();

// 已選工作人員清單
let selectedStaff = [];

// ── 選取器 ────────────────────────────────────────────
function pickProject() {
  ERPALIGNED.showPickerModal('查詢專案', ['專案ID','專案計畫名稱','狀態','開始日期'], row => {
    document.querySelector('[name="專案計畫名稱"]').value = row['專案計畫名稱'] || '';
    document.querySelector('[name="專案計畫名稱"]').dataset.projId = row['專案ID'] || '';
  }, '選取所屬專案');
}

function pickLec() {
  ERPALIGNED.showPickerModal('查詢講師', ['講師ID','姓名','電話','專業領域','時薪'], row => {
    document.getElementById('fLecName').value = row['姓名'] || '';
    document.getElementById('fLecName').dataset.lecId = row['講師ID'] || '';
    const info = document.getElementById('lecInfo');
    info.style.display = '';
    info.textContent = '已選：' + (row['姓名']||'') + '　電話：' + (row['電話']||'') + '　領域：' + (row['專業領域']||'') + '　時薪：' + (row['時薪']||'');
  }, '選取講師');
}

function pickStaff() {
  ERPALIGNED.showPickerModal('查詢工作人員', ['人員ID','姓名','電話','職務類型','時薪'], row => {
    if (selectedStaff.find(s => s['人員ID'] === row['人員ID'])) return;
    selectedStaff.push(row);
    renderStaffList();
  }, '選取工作人員');
}

function removeStaff(i) {
  selectedStaff.splice(i, 1);
  renderStaffList();
}

function renderStaffList() {
  const el = document.getElementById('staffList');
  if (!selectedStaff.length) { el.innerHTML = ''; return; }
  el.innerHTML = selectedStaff.map((s,i) =>
    '<div class="hint" style="margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">' +
    '<span>' + ERPALIGNED.esc(s['姓名']) + '（' + ERPALIGNED.esc(s['職務類型']||'') + '）</span>' +
    '<button type="button" class="danger" style="padding:2px 8px;font-size:.74rem" onclick="removeStaff('+i+')">移除</button></div>'
  ).join('');
}

// ── 新增 ──────────────────────────────────────────────
document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const o = { action: '新增活動' };
  fd.forEach((v,k) => { if(v) o[k] = v; });
  if (selectedStaff.length) {
    o['工作人員'] = selectedStaff.map(s => s['姓名']).join('、');
    o['工作人員ID'] = selectedStaff.map(s => s['人員ID']).join(',');
  }
  const r = await ERPALIGNED.api(o, 'createMsg');
  if (r && r.success) { e.target.reset(); selectedStaff=[]; renderStaffList(); document.getElementById('lecInfo').style.display='none'; queryActivities(); }
});

// ── 工作流程動作 ──────────────────────────────────────
async function doAction(action) {
  const kw = document.getElementById('keyword').value;
  if (!kw) { document.getElementById('queryMsg').textContent = '❌ 請先在查詢欄填入活動ID再執行此操作'; return; }
  await ERPALIGNED.api({ action, 活動ID: kw }, 'queryMsg');
  queryActivities();
}

// ── 查詢 ──────────────────────────────────────────────
const ACT_EDIT_FIELDS = [
  {name:'活動ID', label:'活動 ID', readonly:true},
  {name:'專案計畫名稱', label:'所屬專案'},
  {name:'活動名稱', label:'活動名稱'},
  {name:'活動類型', label:'活動類型'},
  {name:'活動日期', label:'活動日期', type:'date'},
  {name:'活動地點', label:'活動地點'},
  {name:'開始時間', label:'開始時間', type:'time'},
  {name:'結束時間', label:'結束時間', type:'time'},
  {name:'講師', label:'講師'},
  {name:'工作人員', label:'工作人員'},
  {name:'聯絡人', label:'聯絡人'},
  {name:'聯絡電話', label:'聯絡電話'},
  {name:'狀態', label:'狀態', type:'select', options:['規劃中','招生中','已完成','已取消']},
  {name:'備註', label:'變更原因／備註', type:'textarea'}
];

function openActEdit(row) {
  ERPALIGNED.showEditModal('編輯活動：' + (row['活動名稱']||''), ACT_EDIT_FIELDS, row, '修改活動', '活動ID', queryActivities);
}

async function queryActivities() {
  const r = await ERPALIGNED.api({ action:'查詢活動', keyword: document.getElementById('keyword').value }, 'queryMsg');
  ERPALIGNED.renderTableWithEdit(r, 'table', openActEdit,
    ['活動ID','活動名稱','活動日期','活動地點','講師','狀態']);
}

queryActivities();
</script>
</body>
</html>
