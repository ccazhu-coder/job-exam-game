<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOps OS｜活動管理</title><link rel="stylesheet" href="./erp-page-style.css"></head><body><header><div class="wrap"><div class="brand">GovOps OS｜活動管理</div><div class="sub">對齊：02_場次活動｜每個模組必備：新增、修改、查詢</div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid"><section class="card span6"><h2>新增活動／課程場次</h2><form id="createForm"><label>所屬專案計畫＊</label><input name="專案計畫名稱" required><label>活動名稱＊</label><input name="活動名稱" required><div class="row"><div><label>活動日期</label><input name="活動日期" type="date"></div><div><label>活動類型</label><input name="活動類型"></div></div><div class="row"><div><label>開始時間</label><input name="開始時間" type="time"></div><div><label>結束時間</label><input name="結束時間" type="time"></div></div><label>活動地點</label><input name="活動地點"><label>講師</label><input name="講師"><div class="row"><div><label>聯絡人</label><input name="聯絡人"></div><div><label>聯絡電話</label><input name="聯絡電話"></div></div><button>新增活動</button></form><div id="createMsg" class="msg">尚未新增。</div></section><section class="card span6"><h2>修改活動</h2><form id="updateForm"><label>活動ID＊</label><input name="活動ID" required><label>變更原因＊</label><input name="變更原因" required><label>活動名稱</label><input name="活動名稱"><div class="row"><div><label>活動日期</label><input name="活動日期" type="date"></div><div><label>活動地點</label><input name="活動地點"></div></div><label>講師</label><input name="講師"><label>狀態</label><select name="狀態"><option value="">不變更</option><option value="planning">規劃中</option><option value="recruiting">招生中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select><button class="green">修改活動</button></form><div class="btns"><button class="secondary" onclick="wf('ERP流程_活動完成')">完成活動</button><button class="secondary" onclick="wf('ERP流程_活動取消')">取消活動</button><button class="secondary" onclick="wf('生成活動作業包')">建立作業包</button><button class="secondary" onclick="wf('建立活動資料夾與歸檔清單')">建立資料夾</button></div><div id="updateMsg" class="msg">尚未修改。</div></section><section class="card span12"><h2>查詢活動</h2><div class="row"><input id="keyword" placeholder="活動ID、專案、講師、日期、狀態"><button onclick="queryActivities()">查詢活動</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="table"></div></section></div></main><script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./erp-aligned-core.js"></script><script>document.getElementById('nav').innerHTML=ERPALIGNED.nav();function formObj(id,action){const fd=new FormData(document.getElementById(id));const obj={action};fd.forEach((v,k)=>{if(v)obj[k]=v});return obj}document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(formObj('createForm','新增活動'),'createMsg');queryActivities();});document.getElementById('updateForm').addEventListener('submit',async e=>{e.preventDefault();await ERPALIGNED.api(formObj('updateForm','修改活動'),'updateMsg');queryActivities();});async function wf(action){const id=document.querySelector('[name="活動ID"]').value;if(!id){document.getElementById('updateMsg').textContent='請先填寫活動ID';return}await ERPALIGNED.api({action,活動ID:id},'updateMsg');queryActivities()}async function queryActivities(){const r=await ERPALIGNED.api({action:'查詢活動',keyword:document.getElementById('keyword').value},'queryMsg');ERPALIGNED.renderTable(r,'table')}queryActivities();</script></body></html>
