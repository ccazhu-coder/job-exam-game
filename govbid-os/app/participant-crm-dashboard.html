<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GovOps OS｜學員 CRM Dashboard</title><script src="./config.js"></script><script src="./saas-runtime.js"></script><script src="./govops-api-client.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:30px 20px}.wrap{max-width:1280px;margin:0 auto;padding:20px}h1{margin:0;font-size:30px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(16,37,66,.07)}.span-12{grid-column:span 12}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{border:1px solid #e5eaf2;border-radius:16px;padding:14px;background:#f8fafc}.num{font-size:22px;font-weight:900;color:#1d4e89}.name{font-size:13px;color:#667085;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:12px;font-size:15px;background:#fbfcff}button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#1d4e89;color:white;margin:8px 6px 0 0}.secondary{background:#e8eef7;color:#1d3557}.good{background:#12805c}.status{padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #d0d5dd;margin-top:12px;white-space:pre-wrap;line-height:1.7;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:10px 8px;text-align:left}th{background:#f8fafc;color:#344054}@media(max-width:900px){.span-6,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:1fr}button{width:100%}}</style></head><body><header><div class="wrap"><h1>學員 CRM Dashboard</h1><div>回流分析｜完訓統計｜行銷名單｜學員生命週期</div></div></header><main class="wrap"><div class="grid"><section class="card span-12"><label>關鍵字</label><input id="keyword"><button class="good" onclick="loadAll()">載入 CRM</button><button onclick="marketing()">行銷名單</button><button class="secondary" onclick="location.href='./registration-management.html'">報名管理</button><div class="kpis" id="kpiBox"></div><div id="mainResult" class="status">尚未操作。</div></section><section class="card span-12"><h2>學員資料庫</h2><div id="participantTable"></div></section><section class="card span-12"><h2>學員參與歷程</h2><div id="historyTable"></div></section></div></main><script>const API_URL=(window.GOVOPS_CONFIG&&window.GOVOPS_CONFIG.API_URL)||'https://script.google.com/macros/s/AKfycbzEayaKAUTk5C0s_3fSGQe49KmuJmsZNhYCoia2cjpYSmlYqnnZKIRHZh1GQZT4JpDy5g/exec';function profile(){try{return Object.assign({tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'},JSON.parse(localStorage.getItem('govops_profile')||'{}'))}catch(e){return{tenantId:'TENANT-DEMO',userId:'USR-DEMO',role:'owner',plan:'pro'}}}function params(p){const u=profile();return Object.assign({tenantId:u.tenantId,userId:u.userId,userRole:u.role||'owner',plan:u.plan||'pro'},p||{})}function val(id){const e=document.getElementById(id);return e?e.value.trim():''}function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t}async function api(p,target){const payload=params(p);if(target)set(target,'處理中...');let res;if(window.GovOpsAPI&&GovOpsAPI.request){res=await GovOpsAPI.request(payload,{apiUrl:API_URL});}else{const r=await fetch(API_URL+'?'+new URLSearchParams(payload));res=await r.json();}if(target)set(target,JSON.stringify(res,null,2));return res}function table(id,rows,keys){rows=rows||[];const box=document.getElementById(id);if(!rows.length){box.innerHTML='<div class="status">無資料</div>';return}box.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,300).map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function renderKpi(s){s=s||{};const items=[['學員總數',s.total||0],['可追蹤',s.trackable||0],['行銷同意',s.marketingConsentYes||0],['總報名',s.totalRegistration||0],['總出席',s.totalAttendance||0],['回流學員',s.repeatParticipants||0]];document.getElementById('kpiBox').innerHTML=items.map(x=>'<div class="kpi"><div class="num">'+x[1]+'</div><div class="name">'+x[0]+'</div></div>').join('')}async function loadAll(){const p=await api({action:'participant.master.query',keyword:val('keyword')},'mainResult');renderKpi(p.data&&p.data.summary);table('participantTable',p.data&&p.data.rows,['學員ID','姓名','電話','Email','累計報名次數','累計出席次數','累計完訓次數','最近活動名稱','CRM狀態']);const h=await api({action:'participant.history.query',keyword:val('keyword')},'mainResult');table('historyTable',h.data&&h.data.rows,['學員ID','活動名稱','活動日期','報名狀態','錄取狀態','出席狀態','完訓狀態','是否重複參課'])}async function marketing(){await api({action:'participant.master.query',keyword:val('keyword'),行銷同意:'是'},'mainResult')}loadAll();</script></body></html>
