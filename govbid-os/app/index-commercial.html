<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovOps OS｜正式商用主系統</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;background:#f4f7fb;color:#182033}header{background:linear-gradient(135deg,#102542,#1d4e89);color:#fff;padding:22px 16px}.wrap{max-width:1200px;margin:0 auto}.brand{font-size:25px;font-weight:900}.sub{margin-top:6px;line-height:1.65;opacity:.92}main{padding:16px 12px 90px}.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.topnav a,.topnav button{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 11px;border-radius:999px;font-weight:800;font-size:14px;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e7edf5;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(16,37,66,.08)}.span12{grid-column:span 12}.span6{grid-column:span 6}h2{margin:0 0 12px;font-size:19px}.hint{background:#eef6ff;border:1px solid #cfe6ff;color:#16436f;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:12px;padding:10px 12px;line-height:1.65;margin-bottom:10px}label{display:block;margin:10px 0 5px;font-weight:800;color:#344054}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e1ec;border-radius:12px;background:#fbfcff;font-size:16px}textarea{min-height:86px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:900;cursor:pointer;background:#1d4e89;color:#fff}button.secondary{background:#e8eef7;color:#1d3557}button.green{background:#12805c}button.danger{background:#b42318}.msg{margin-top:10px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cfd8e6;white-space:pre-wrap;line-height:1.65;max-height:280px;overflow:auto}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#eef6ff;color:#16436f;font-weight:900;font-size:13px}.enterprise{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:999px;padding:6px 10px;font-weight:900;margin-left:6px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border-bottom:1px solid #edf1f6;padding:9px 7px;text-align:left;vertical-align:top}th{background:#f8fafc}@media(max-width:900px){.span6{grid-column:span 12}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">GovOps OS｜正式商用主系統 <span class="enterprise">企業版</span></div><div class="sub">基本資料／資源主檔 → 專案計畫 → 活動／課程場次 → 招生、任務、財務、核銷、CRM</div><nav class="topnav"><a href="#login">登入</a><a href="#masters">基本資料</a><a href="#project">專案</a><a href="#activity">活動場次</a><a href="#query">查詢</a><a href="./finance-secretary.html">財務秘書</a><button onclick="logout()">登出</button></nav></div></header>
<main class="wrap"><section class="card span12" style="margin-bottom:14px"><h2>首頁</h2><div class="ok">正式商用版固定企業版，全功能開放，不再做免費版／專業版／團隊版限制。</div><div id="userPanel" class="msg">尚未登入。</div><div class="btns"><button onclick="loadDashboard()">重新整理</button><button class="secondary" onclick="refreshMasterOptions()">重新載入主檔選單</button></div><div id="dashboardMsg" class="msg">尚未載入。</div></section><div class="grid">
<section id="login" class="card span6"><h2>登入使用者</h2><label>組織／公司名稱</label><input id="loginOrg" value="知己知途／GovOps OS"><div class="row"><div><label>使用者姓名</label><input id="loginName" value="珍珠老師"></div><div><label>角色</label><select id="loginRole"><option value="owner">負責人</option><option value="admin">管理者</option><option value="staff">工作人員</option><option value="finance">財務</option></select></div></div><label>Email／帳號</label><input id="loginEmail"><div class="btns"><button onclick="login()">登入／建立企業版 Session</button><button class="danger" onclick="logout()">登出</button></div><div id="loginMsg" class="msg">尚未登入。</div></section>
<section id="masters" class="card span6"><h2>基本資料／資源主檔</h2><div class="hint">先建立一次，後續新增專案活動時即可用選的。</div><label>資料類型</label><select id="masterKind"><option>資源主檔</option><option>講師資料</option><option>講師專業類型</option><option>工作人員資料</option><option>合作廠商資料</option><option>場地資料</option><option>餐飲廠商</option><option>印刷設計</option><option>交通接駁</option><option>設備租借</option></select><label>自訂類型／分類</label><input id="masterType" list="masterTypeList"><datalist id="masterTypeList"></datalist><label>名稱＊</label><input id="masterName"><div class="row"><div><label>聯絡人</label><input id="masterContact"></div><div><label>聯絡電話</label><input id="masterPhone"></div></div><label>地址／Email／補充資料</label><input id="masterExtra"><label>備註</label><textarea id="masterNote"></textarea><div class="btns"><button onclick="saveMaster()">儲存基本資料</button><button class="secondary" onclick="queryMasters()">查詢基本資料</button></div><div id="masterMsg" class="msg">尚未操作。</div><div id="masterTable"></div></section>
<section id="project" class="card span6"><h2>新增專案計畫</h2><div class="hint">一個專案計畫名稱下面可以建立 N 場活動或課程。</div><label>專案計畫名稱＊</label><input id="projectTitle" list="projectList"><datalist id="projectList"></datalist><div class="row"><div><label>專案類型</label><select id="projectType"><option>政府標案</option><option>自辦活動</option><option>委託課程</option><option>公會計畫</option><option>其他</option></select></div><div><label>主辦／委託單位</label><input id="projectHost"></div></div><label>專案說明</label><textarea id="projectDesc"></textarea><div class="btns"><button onclick="createProject()">新增專案</button><button class="secondary" onclick="queryProjects()">查詢專案</button></div><div id="projectMsg" class="msg">尚未建立。</div><div id="projectTable"></div></section>
<section id="activity" class="card span6"><h2>建立專案活動／課程場次</h2><label>所屬專案計畫＊</label><input id="projectName" list="projectList"><label>活動／課程名稱＊</label><input id="activityName"><div class="row"><div><label>活動日期＊</label><input id="activityDate" type="date"></div><div><label>活動類型</label><input id="activityType"></div></div><div class="row"><div><label>開始時間＊</label><input id="startTime" type="time" value="09:00"></div><div><label>結束時間＊</label><input id="endTime" type="time" value="12:00"></div></div><label>活動地點＊</label><input id="place" list="placeList" onchange="applyResourceByName(this.value)"><datalist id="placeList"></datalist><div class="row"><div><label>聯絡人</label><input id="contact" list="contactList"><datalist id="contactList"></datalist></div><div><label>聯絡電話</label><input id="contactPhone" list="phoneList"><datalist id="phoneList"></datalist></div></div><label>講師</label><input id="teacher" list="teacherList"><datalist id="teacherList"></datalist><div class="btns"><button onclick="createActivity(false)">新增場次</button><button class="green" onclick="createActivity(true)">新增並建立作業包</button></div><div id="activityMsg" class="msg">尚未操作。</div></section>
<section id="query" class="card span12"><h2>查詢中心</h2><textarea id="lineText" placeholder="查詢今日任務／查詢缺件／查詢活動"></textarea><div class="btns"><button onclick="quickQuery(lineText.value)">查詢</button></div><div id="queryMsg" class="msg">尚未查詢。</div><div id="resultTable"></div></section>
</div></main>
<script src="./config.js"></script><script src="./govops-api-client.js"></script><script src="./index-commercial.js"></script>
</body></html>
